<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Style preview scene</title>
<script src="vendor/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: #0b0d12; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #14110f; font-family: "Space Grotesk", Inter, sans-serif; color: #fff; }
  .layer { position: absolute; inset: 0; }
  /* story: the whole scene, edge to edge in height, the same art blurred to fill the sides */
  .fill { position: absolute; inset: -80px; background-image: url("ART"); background-size: cover; background-position: center; filter: blur(30px) brightness(.55) saturate(1.15); }
  /* centred with auto margins, not a translate: GSAP reads the starting transform before the image has loaded and would lose a percentage offset */
  .scene { position: absolute; top: 0; left: 0; right: 0; margin: 0 auto; height: 720px; width: auto; transform-origin: 50% 55%; box-shadow: 0 0 80px rgba(0,0,0,.45); }
  /* alive: the art itself moves (warp, sway, breathing), light drifts across it and specks float through it */
  .sway { transform-origin: 50% 100%; filter: url(#warp); }
  .alive { }
  .sweep { position: absolute; inset: -20%; background: linear-gradient(100deg, rgba(255,255,255,0) 38%, rgba(255,244,214,.28) 50%, rgba(255,255,255,0) 62%); mix-blend-mode: soft-light; }
  .vignette { background: radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.42) 100%); }
  .mote { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle, rgba(255,250,230,.95), rgba(255,250,230,0) 70%); }
  /* tall panels (paper, clay): fill the frame and crop to the upper body; square plates stay whole with blurred sides */
  .scene.tall { left: 0; width: 1280px; height: 720px; transform: none; object-fit: cover; object-position: 50% 24%; box-shadow: none; }
  .shade { background: linear-gradient(180deg, rgba(0,0,0,0) 52%, rgba(0,0,0,.72) 100%); }
  .caption { position: absolute; left: 70px; right: 70px; bottom: 58px; font-family: "Instrument Serif", "Source Serif 4", serif; font-size: 74px; line-height: 1.02; letter-spacing: -.01em; text-shadow: 0 4px 28px rgba(0,0,0,.55); }
  .rule { position: absolute; left: 72px; bottom: 46px; height: 4px; width: 120px; background: #fff; border-radius: 2px; transform-origin: 0 50%; }
  /* saas: the scene is the backdrop, the product's own screen and words sit on top */
  .cover { position: absolute; inset: -40px; background-image: url("ART"); background-size: cover; background-position: 50% POS; filter: brightness(.92) saturate(1.12); transform-origin: 50% 50%; }
  .wash { background: linear-gradient(90deg, rgba(10,12,18,.74) 0%, rgba(10,12,18,.36) 44%, rgba(10,12,18,0) 100%); }
  .headline { position: absolute; left: 70px; top: 150px; width: 520px; font-size: 62px; line-height: 1.04; font-weight: 700; letter-spacing: -.03em; text-shadow: 0 3px 24px rgba(0,0,0,.45); }
  .sub { position: absolute; left: 72px; top: 400px; width: 460px; font-size: 24px; color: rgba(255,255,255,.92); text-shadow: 0 2px 16px rgba(0,0,0,.5); }
  .pill { position: absolute; left: 72px; top: 470px; padding: 14px 30px; border-radius: 999px; background: #fff; color: #111; font-weight: 600; font-size: 22px; }
  .card { position: absolute; right: 70px; top: 130px; width: 560px; border-radius: 18px; background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,.45); overflow: hidden; transform: rotate(2deg); }
  .card .bar { height: 30px; background: #eef1f5; display: flex; align-items: center; gap: 7px; padding-left: 14px; }
  .card .bar i { width: 10px; height: 10px; border-radius: 50%; background: #cfd5de; }
  .card img { display: block; width: 100%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
<svg width="0" height="0" style="position:absolute"><filter id="warp" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div class="fill clip" data-start="0" data-duration="5" data-track-index="0"></div>
<div class="layer sway clip" data-start="0" data-duration="5" data-track-index="1"><img class="scene alive" src="ART" alt="" /></div>
<div class="layer sweep clip" data-start="0" data-duration="5" data-track-index="2"></div>
<div class="layer motes clip" data-start="0" data-duration="5" data-track-index="3"></div>
<div class="layer vignette clip" data-start="0" data-duration="5" data-track-index="4"></div>
<div class="cover clip" data-start="0" data-duration="5" data-track-index="0"></div>
<div class="layer wash clip" data-start="0" data-duration="5" data-track-index="1"></div>
<div class="headline clip" data-start="0" data-duration="5" data-track-index="2">HEADLINE</div>
<div class="sub clip" data-start="0" data-duration="5" data-track-index="3">SUB</div>
<div class="pill clip" data-start="0" data-duration="5" data-track-index="4">CTA</div>
<div class="card clip" data-start="0" data-duration="5" data-track-index="5"><div class="bar"><i></i><i></i><i></i></div><img src="shot.svg" alt="" /></div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const mode = "MODE";
  const build = "BUILD"; // paper | origami | clay: the scene assembles itself from pieces of the art
  if (mode === "story" && build !== "none") {
    // seeded PRNG so every seek is identical
    let seed = 4242; const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const W = 1280, H = 720, cols = build === "origami" ? 6 : 5, rows = build === "origami" ? 4 : 4;
    const stage = document.querySelector(".sway");
    const base = stage.querySelector(".scene");
    base.style.opacity = 0.18;
    document.querySelector(".fill").style.display = "none";
    stage.style.perspective = "1400px";
    // jittered grid: neighbouring pieces share their corners, so the finished scene has no gaps
    const vx = [], cw = W / cols, ch = H / rows;
    for (let r = 0; r <= rows; r++) { vx.push([]); for (let c = 0; c <= cols; c++) vx[r].push([c * cw + (c > 0 && c < cols ? (rnd() - .5) * cw * .55 : 0), r * ch + (r > 0 && r < rows ? (rnd() - .5) * ch * .55 : 0)]); }
    const polys = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const a = vx[r][c], b = vx[r][c + 1], d = vx[r + 1][c + 1], e = vx[r + 1][c];
      if (build === "origami") { polys.push([a, b, d]); polys.push([a, d, e]); } else polys.push([a, b, d, e]);
    }
    const pieces = polys.map((pts) => {
      const cx = pts.reduce((n, p) => n + p[0], 0) / pts.length, cy = pts.reduce((n, p) => n + p[1], 0) / pts.length;
      const wrap = document.createElement("div"); wrap.style.cssText = "position:absolute;inset:0;";
      const face = document.createElement("div");
      face.style.cssText = "position:absolute;inset:0;background:url(art.jpg) 50% 24%/cover;clip-path:polygon(" + pts.map((p) => p[0].toFixed(1) + "px " + p[1].toFixed(1) + "px").join(",") + ");";
      wrap.appendChild(face); stage.appendChild(wrap);
      return { wrap, cx, cy, d: Math.hypot(cx - W / 2, (cy - H / 2) * 1.3) };
    });
    // edges first, the middle (the subject) last
    const order = pieces.slice().sort((p, q) => q.d - p.d + (rnd() - .5) * 120);
    const span = 1.9, dur = build === "clay" ? 0.75 : 0.8;
    order.forEach((piece, i) => {
      const at = 0.08 + (i / order.length) * span, w = piece.wrap;
      gsap.set(w, { transformOrigin: piece.cx + "px " + piece.cy + "px", opacity: 0 });
      const out = { x: (piece.cx - W / 2) * 1.6 + (rnd() - .5) * 160, y: (piece.cy - H / 2) * 1.6 + (rnd() - .5) * 160 };
      if (build === "paper") {
        w.style.filter = "drop-shadow(0 14px 16px rgba(30,15,0,.5))";
        tl.fromTo(w, { x: out.x, y: out.y, rotation: (rnd() - .5) * 50, opacity: 0 }, { x: 0, y: 0, rotation: 0, opacity: 1, duration: dur, ease: "power3.out" }, at);
        tl.to(w, { filter: "drop-shadow(0 0px 0px rgba(30,15,0,0))", duration: 0.3 }, at + dur);
      } else if (build === "origami") {
        w.style.filter = "drop-shadow(0 8px 10px rgba(20,10,30,.4))";
        const axis = rnd() > .5 ? "rotationX" : "rotationY";
        tl.fromTo(w, { [axis]: (rnd() > .5 ? 1 : -1) * 100, scale: 0.7, opacity: 0 }, { [axis]: 0, scale: 1, opacity: 1, duration: dur, ease: "power2.out" }, at);
        tl.to(w, { filter: "drop-shadow(0 0px 0px rgba(20,10,30,0))", duration: 0.3 }, at + dur);
      } else {
        tl.fromTo(w, { scaleX: 0.1, scaleY: 0.1, rotation: (rnd() - .5) * 30, opacity: 0 }, { scaleX: 1, scaleY: 1, rotation: 0, opacity: 1, duration: dur, ease: "back.out(2.2)" }, at);
      }
    });
    // once every piece is down the whole picture sits beneath, so no seam shows; then it breathes
    const done = 0.08 + span + dur;
    tl.fromTo(base, { opacity: 0.18 }, { opacity: 1, duration: 0.2 }, done - 0.1);
    tl.fromTo(".sway", { rotation: 0, skewX: 0, y: 0 }, { rotation: 0.7, skewX: 1, y: -6, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, Math.min(done, 2.4));
    tl.fromTo(".sweep", { xPercent: -55 }, { xPercent: 55, duration: 2.6, ease: "sine.inOut" }, Math.min(done, 2.4));
  } else if (mode === "story") {
    // seeded PRNG so every seek is identical
    let seed = 12345; const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const host = document.querySelector(".motes");
    for (let i = 0; i < 26; i++) {
      const m = document.createElement("i"); m.className = "mote";
      m.style.left = (rnd() * 1280) + "px"; m.style.top = (200 + rnd() * 520) + "px"; host.appendChild(m);
      const z = 0.5 + rnd() * 1.2, dx = (rnd() - .5) * 90, rise = 90 + rnd() * 160, delay = rnd() * 1.6;
      gsap.set(m, { scale: z, opacity: 0 });
      tl.to(m, { y: -rise, x: dx, duration: 5, ease: "none" }, 0);
      tl.to(m, { opacity: 0.85, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, delay);
    }
    // living line: the displacement field drifts and breathes (set from one proxy value, never from transforms)
    const turb = document.getElementById("turb"), disp = turb.nextElementSibling, f = { p: 0 };
    tl.to(f, { p: 1, duration: 5, ease: "none", onUpdate: () => {
      const t = f.p * 5;
      turb.setAttribute("baseFrequency", `${(0.006 + Math.sin(t * 1.3) * 0.0012).toFixed(5)} ${(0.009 + Math.cos(t * 1.1) * 0.0012).toFixed(5)}`);
      disp.setAttribute("scale", (11 + Math.sin(t * 2.1) * 5).toFixed(2));
    } }, 0);
    // sway and breathing from the feet, light drifting across, a slow camera push
    tl.fromTo(".sway", { rotation: -0.9, skewX: -1.3, y: 4 }, { rotation: 0.9, skewX: 1.3, y: -7, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
    tl.fromTo(".scene", { scale: 1.0, yPercent: 0 }, { scale: 1.1, yPercent: -1.5, duration: 5, ease: "none" }, 0);
    tl.fromTo(".fill", { scale: 1.0 }, { scale: 1.12, duration: 5, ease: "none" }, 0);
    tl.fromTo(".sweep", { xPercent: -55 }, { xPercent: 55, duration: 5, ease: "sine.inOut" }, 0);
  } else {
    tl.fromTo(".cover", { scale: 1.0 }, { scale: 1.1, duration: 5, ease: "none" }, 0);
    tl.fromTo(".headline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.15);
    tl.fromTo(".sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.7);
    tl.fromTo(".pill", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.4);
    tl.fromTo(".card", { opacity: 0, x: 120, rotate: 6 }, { opacity: 1, x: 0, rotate: 2, duration: 1.1, ease: "power3.out" }, 0.5);
    tl.to(".card", { y: -14, duration: 3.6, ease: "sine.inOut" }, 1.5);
  }
  tl.to({}, { duration: 5 }, 0);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
