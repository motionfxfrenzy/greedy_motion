<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Workflow product demo</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #0a0c0f; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0a0c0f; font-family: "Inter", Arial, sans-serif; color: #f4f6f8; }
  #glow { position:absolute; left:-200px; top:-300px; width:900px; height:700px; background: radial-gradient(closest-side, rgba(53,224,138,.22), rgba(53,224,138,0)); }
  .title { position:absolute; left:80px; top:34px; height:110px; overflow:hidden; }
  .title span { display:block; font-weight:800; font-size:88px; letter-spacing:-0.045em; line-height:110px; white-space:nowrap; }
  .title em { font-style:normal; color:#35e08a; }
  #ul { position:absolute; left:80px; top:140px; height:8px; width:360px; background:#35e08a; border-radius:4px; transform-origin:0 50%; }
  .steps { position:absolute; right:80px; top:62px; display:flex; gap:12px; }
  .steps u { width:44px; height:10px; border-radius:5px; background:#262b33; display:block; }
  .panel { position:absolute; left:80px; top:178px; width:1120px; height:506px; background:#14181d; border:2px solid #272d36; border-radius:26px; box-shadow:0 30px 80px rgba(0,0,0,.6); overflow:hidden; }
  .bar { height:50px; border-bottom:2px solid #272d36; display:flex; align-items:center; gap:10px; padding:0 22px; }
  .bar i { width:14px; height:14px; border-radius:7px; background:#2c333d; display:block; }
  .bar b { margin-left:16px; font-size:19px; font-weight:600; color:#8a94a3; }
  .sc { position:absolute; left:0; top:50px; right:0; bottom:0; padding:34px 44px; opacity:0; }
  label { display:block; font-size:22px; font-weight:600; color:#8a94a3; margin-bottom:10px; }
  .field { height:74px; border-radius:16px; background:#0d1014; border:2px solid #2a313b; padding:0 24px; display:flex; align-items:center; font-size:38px; font-weight:700; margin-bottom:26px; }
  .field.f1 { border-color:#35e08a; }
  .field .t { display:inline-block; overflow:hidden; white-space:nowrap; width:0; }
  .caret { width:4px; height:40px; background:#35e08a; margin-left:4px; }
  .row2 { display:flex; gap:26px; }
  .row2 > div { flex:1; }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:78px; padding:0 54px; border-radius:18px; background:#35e08a; color:#05140c; font-size:36px; font-weight:800; }
  .hub { position:absolute; left:460px; top:120px; width:200px; height:200px; border-radius:100px; background:#0d1014; border:3px solid #35e08a; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; text-align:center; line-height:1.1; }
  .node { position:absolute; width:240px; height:100px; border-radius:20px; background:#0d1014; border:2px solid #2a313b; display:flex; align-items:center; gap:14px; padding:0 22px; font-size:30px; font-weight:700; }
  .node s { width:34px; height:34px; border-radius:17px; background:#2a313b; display:block; position:relative; text-decoration:none; }
  .node .ck { position:absolute; right:-14px; top:-14px; width:38px; height:38px; border-radius:19px; background:#35e08a; color:#05140c; font-size:26px; font-weight:900; display:flex; align-items:center; justify-content:center; opacity:0; }
  svg.lines { position:absolute; left:0; top:0; width:1120px; height:456px; }
  .msg { border-radius:20px; background:#0d1014; border:2px solid #2a313b; padding:22px 28px; font-size:32px; font-weight:600; line-height:1.25; }
  .msg small { display:block; font-size:21px; color:#8a94a3; font-weight:600; margin-bottom:8px; }
  .wave { display:flex; align-items:center; gap:7px; height:52px; margin-top:6px; }
  .wave i { width:9px; border-radius:5px; background:#35e08a; display:block; height:60px; transform-origin:50% 50%; }
  .done { position:absolute; left:44px; bottom:34px; height:78px; padding:0 40px; border-radius:18px; background:#1f2a24; color:#35e08a; font-size:34px; font-weight:800; display:flex; align-items:center; opacity:0; border:2px solid #35e08a; }
  .kpis { display:flex; gap:24px; }
  .kpi { flex:1; background:#0d1014; border:2px solid #2a313b; border-radius:20px; padding:18px 26px; }
  .kpi small { font-size:21px; color:#8a94a3; font-weight:600; display:block; }
  .kpi b { font-size:64px; font-weight:800; letter-spacing:-0.04em; display:block; margin-top:2px; }
  .kpi b.g { color:#35e08a; }
  .chart { position:absolute; left:44px; right:44px; bottom:30px; height:200px; display:flex; align-items:flex-end; gap:20px; }
  .chart i { flex:1; border-radius:10px 10px 4px 4px; background:#1f3a2c; display:block; height:100%; transform-origin:50% 100%; }
  .chart i.hot { background:#35e08a; }
  #cur { position:absolute; left:0; top:0; width:56px; height:56px; z-index:20; filter:drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
  <div id="glow"></div>
  <div class="steps"><u></u><u></u><u></u><u></u></div>
  <div class="title" id="t1"><span>Create <em>a campaign</em></span></div>
  <div class="title" id="t2"><span>Connect <em>metrics</em></span></div>
  <div class="title" id="t3"><span>Approve <em>the reply</em></span></div>
  <div class="title" id="t4"><span>See <em>what works</em></span></div>
  <div id="ul"></div>
  <div class="panel" id="panel">
    <div class="bar"><i></i><i></i><i></i><b>Launchpad</b></div>
    <div class="sc" id="s1">
      <div class="row2"><div><label>Campaign name</label><div class="field f1"><span class="t" id="ty1">Spring launch</span><span class="caret" id="car"></span></div></div>
      <div><label>Daily budget</label><div class="field"><span class="t" id="ty2">$120</span></div></div></div>
      <div class="btn" id="launch">Launch campaign</div>
    </div>
    <div class="sc" id="s2">
      <svg class="lines" viewBox="0 0 1120 456">
        <path id="l1" d="M300 110 C 380 110 400 200 460 200" fill="none" stroke="#35e08a" stroke-width="5" stroke-linecap="round" pathLength="1"/>
        <path id="l2" d="M300 330 C 380 330 400 240 460 240" fill="none" stroke="#35e08a" stroke-width="5" stroke-linecap="round" pathLength="1"/>
        <path id="l3" d="M820 110 C 740 110 720 200 660 200" fill="none" stroke="#35e08a" stroke-width="5" stroke-linecap="round" pathLength="1"/>
        <path id="l4" d="M820 330 C 740 330 720 240 660 240" fill="none" stroke="#35e08a" stroke-width="5" stroke-linecap="round" pathLength="1"/>
      </svg>
      <div class="hub" id="hub">Your<br>data</div>
      <div class="node n" style="left:60px;top:60px"><s></s>Ad spend<span class="ck">&#10003;</span></div>
      <div class="node n" style="left:60px;top:280px"><s></s>Store<span class="ck">&#10003;</span></div>
      <div class="node n" style="left:820px;top:60px"><s></s>Leads<span class="ck">&#10003;</span></div>
      <div class="node n" style="left:820px;top:280px"><s></s>Sales<span class="ck">&#10003;</span></div>
    </div>
    <div class="sc" id="s3" style="padding-top:24px">
      <div class="msg" style="width:760px"><small>New lead asks</small>Can I start this week?</div>
      <div class="msg" style="width:860px;margin:22px 0 0 auto;border-color:#35e08a"><small style="color:#35e08a">Voice assistant replies</small><div class="wave" id="wave"></div></div>
      <div class="btn" id="appr" style="margin-top:22px">Approve</div>
      <div class="done" id="done">&#10003; Approved</div>
    </div>
    <div class="sc" id="s4">
      <div class="kpis"><div class="kpi"><small>Leads</small><b class="g" id="k1">0</b></div><div class="kpi"><small>Replies</small><b id="k2">0</b></div><div class="kpi"><small>Booked</small><b id="k3">0</b></div></div>
      <div class="chart" id="chart"></div>
    </div>
  </div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M3 2 L3 19 L8 14.5 L11.2 21.5 L14 20.3 L10.9 13.4 L17.5 13.2 Z" fill="#fff" stroke="#0a0c0f" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  var $ = function (s) { return document.querySelector(s); };
  // build waveform + chart deterministically
  var w = $("#wave"), c = $("#chart"), hs = [.35,.5,.42,.62,.55,.78,.7,.92,1];
  for (var i = 0; i < 40; i++) { var b = document.createElement("i"); b.style.height = (10 + 38 * Math.abs(Math.sin(i * 1.3) * Math.cos(i * 0.37))) + "px"; w.appendChild(b); }
  hs.forEach(function (h, i) { var b = document.createElement("i"); b.style.height = (h * 100) + "%"; if (i > 6) b.className = "hot"; c.appendChild(b); });
  var steps = document.querySelectorAll(".steps u");
  var T = [0, 1.3, 2.4, 3.5, 5];
  gsap.set(".title", { opacity: 0 });
  gsap.set(".title span", { yPercent: 110 });
  gsap.set(".node", { opacity: 0, scale: .85 });
  gsap.set("#hub", { opacity: 0, scale: .6 });
  ["#l1","#l2","#l3","#l4"].forEach(function (l) { gsap.set(l, { strokeDasharray: 1, strokeDashoffset: 1 }); });
  gsap.set("#cur", { x: 1330, y: 520 });
  gsap.set("#ty1,#ty2", { width: 0 });
  gsap.set(".chart i", { scaleY: 0 });
  gsap.set(".wave i", { scaleY: .15 });

  function scene(n, t0, t1) {
    var s = "#s" + n, t = "#t" + n;
    var e = n === 1 ? 0 : .1;
    tl.set(s, { opacity: 1 }, t0 - e); tl.set(t, { opacity: 1 }, t0 - e);
    tl.fromTo(t + " span", { yPercent: 110 }, { yPercent: 0, duration: n === 1 ? .01 : .3, ease: "power4.out" }, t0 - e);
    tl.fromTo(s, { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: n === 1 ? .01 : .28, ease: "power3.out" }, t0 - e);
    if (t1) {
      tl.to(t + " span", { yPercent: -110, duration: .14, ease: "power3.in" }, t1 - .24);
      tl.to(s, { y: -24, opacity: 0, duration: .14, ease: "power2.in" }, t1 - .24);
      tl.set(t, { opacity: 0 }, t1 - .1); tl.set(s, { opacity: 0 }, t1 - .1);
    }
    tl.to(steps[n - 1], { backgroundColor: "#35e08a", width: 84, duration: .25 }, t0);
  }
  scene(1, 0, T[1]); scene(2, T[1], T[2]); scene(3, T[2], T[3]); scene(4, T[3], 0);
  tl.to("#ul", { scaleX: 1, duration: .01 }, 0);
  // underline width per title
  tl.set("#ul", { width: 520 }, 0).set("#ul", { width: 330 }, T[1] - .1).set("#ul", { width: 470 }, T[2]).set("#ul", { width: 470 }, T[3]);

  // S1: typing + click launch (cursor slides in, types, clicks)
  tl.to("#cur", { x: 330, y: 300, duration: .4, ease: "power3.out" }, .15);
  tl.to("#ty1", { width: 330, duration: .5, ease: "steps(13)" }, .2);
  tl.to("#ty2", { width: 100, duration: .22, ease: "steps(4)" }, .65);
  tl.to("#cur", { x: 320, y: 450, duration: .3, ease: "power3.inOut" }, .72);
  tl.to("#cur", { scale: .8, duration: .06, yoyo: true, repeat: 1 }, 1.02);
  tl.to("#launch", { scale: .95, duration: .06, yoyo: true, repeat: 1 }, 1.02);
  tl.to("#car", { opacity: 0, duration: .05 }, 1.0);
  // S2: connect
  var cs = T[1] - .1;
  tl.to("#cur", { x: 360, y: 240, duration: .3, ease: "power3.inOut" }, cs);
  tl.to(".node", { opacity: 1, scale: 1, duration: .22, ease: "back.out(2)", stagger: .05 }, cs + .1);
  tl.to("#hub", { opacity: 1, scale: 1, duration: .3, ease: "back.out(2)" }, cs + .1);
  ["#l1","#l2","#l3","#l4"].forEach(function (l, i) { tl.to(l, { strokeDashoffset: 0, duration: .28, ease: "power2.out" }, cs + .38 + i * .15); });
  tl.to(".node .ck", { opacity: 1, scale: 1, duration: .15, stagger: .15 }, cs + .62);
  tl.fromTo(".node .ck", { scale: .3 }, { scale: 1, duration: .2, ease: "back.out(3)", stagger: .15 }, cs + .62);
  // S3: approve
  var a = T[2];
  tl.to(".wave i", { scaleY: 1, duration: .3, stagger: { each: .008 }, ease: "power2.out" }, a + .3);
  tl.to(".wave i", { scaleY: .45, duration: .22, stagger: { each: .006 }, ease: "sine.inOut" }, a + .65);
  tl.to("#cur", { x: 150, y: 640, duration: .45, ease: "power3.inOut" }, a + .35);
  tl.to("#cur", { scale: .8, duration: .06, yoyo: true, repeat: 1 }, a + .85);
  tl.to("#appr", { scale: .94, duration: .06, yoyo: true, repeat: 1 }, a + .85);
  tl.set("#appr", { opacity: 0 }, a + .95);
  tl.fromTo("#done", { opacity: 0, scale: .8 }, { opacity: 1, scale: 1, duration: .2, ease: "back.out(3)" }, a + .95);
  // S4: dashboard
  var d = T[3];
  tl.to("#cur", { x: 1330, y: 640, duration: .5, ease: "power2.in" }, d - .05);
  ["#k1:1284", "#k2:342", "#k3:96"].forEach(function (s, i) {
    var p = s.split(":"), o = { v: 0 };
    tl.to(o, { v: +p[1], duration: .8, ease: "power3.out", onUpdate: function () { $(p[0]).textContent = Math.round(o.v).toLocaleString("en-US"); } }, d + .15 + i * .1);
  });
  tl.to(".chart i", { scaleY: 1, duration: .5, ease: "back.out(1.6)", stagger: .06 }, d + .25);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
