<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Code diff reveal</title>
<script src="vendor/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0b1020}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:#0b1020;font-family:'JetBrains Mono',monospace;color:#d6deeb}
.pane{position:absolute;top:44px;width:600px;height:530px;background:#101830;border:2px solid #1f2b4d;border-radius:18px;overflow:hidden}
#pl{left:30px}#pr{left:650px}
.hd{height:56px;line-height:56px;padding-left:22px;font-size:22px;letter-spacing:3px;color:#7f8fb5;background:#141d3a;border-bottom:2px solid #1f2b4d}
.hd b{color:#ff6b81}#pr .hd b{color:#4ade80}
.row{position:absolute;left:0;right:0;height:46px;line-height:46px;font-size:24px;white-space:pre;padding-left:62px}
.row i{position:absolute;left:0;width:44px;text-align:right;color:#4a5a85;font-style:normal}
.bg{position:absolute;inset:0}
.rm .bg{background:rgba(255,80,100,.18);border-left:5px solid #ff5064}
.ad .bg{background:rgba(74,222,128,.17);border-left:5px solid #4ade80}
.k{color:#c792ea}.f{color:#82aaff}.s{color:#c3e88d}.n{color:#f78c6c}.c{color:#637799;font-style:italic}.p{color:#89ddff}.v{color:#ffcb6b}
.in{position:relative}
#chip{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:#4ade80;color:#052e16;font-family:'Space Grotesk';font-weight:700;font-size:34px;padding:16px 34px;border-radius:40px;white-space:nowrap;display:flex;gap:14px;align-items:center}
#chip em{font-style:normal;background:#052e16;color:#4ade80;border-radius:8px;padding:2px 12px;font-family:'JetBrains Mono';font-size:28px}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720">
<div class="pane" id="pl"><div class="hd"><b>-</b>  BEFORE</div></div>
<div class="pane" id="pr"><div class="hd"><b>+</b>  AFTER</div></div>
<div id="chip">Change <em>loop</em> to <em>reduce</em></div>
</div>
<script>
const L=[
 ['<span class="c">// order total</span>',0],
 ['<span class="k">function</span> <span class="f">total</span><span class="p">(</span><span class="v">items</span><span class="p">) {</span>',1],
 ['  <span class="k">let</span> <span class="v">sum</span> <span class="p">=</span> <span class="n">0</span>;',1],
 ['  <span class="k">for</span> <span class="p">(</span><span class="k">const</span> <span class="v">i</span> <span class="k">of</span> <span class="v">items</span><span class="p">) {</span>',1],
 ['    <span class="v">sum</span> <span class="p">+=</span> <span class="v">i</span>;',1],
 ['  <span class="p">}</span>',1],
 ['  <span class="k">return</span> <span class="v">sum</span>;',1],
 ['<span class="p">}</span>',1],
 ['<span class="k">export</span> <span class="p">{</span> <span class="v">total</span> <span class="p">}</span>;',0]
];
const R=[
 ['<span class="c">// order total</span>',0],
 ['<span class="k">const</span> <span class="f">total</span> <span class="p">=</span> <span class="p">(</span><span class="v">items</span><span class="p">) =&gt;</span>',2],
 ['  <span class="v">items</span>.<span class="f">reduce</span><span class="p">((</span><span class="v">s</span>, <span class="v">i</span><span class="p">) =&gt;</span> <span class="v">s</span> <span class="p">+</span> <span class="v">i</span>, <span class="n">0</span><span class="p">);</span>',2],
 ['',0],['',0],['',0],['',0],['',0],
 ['<span class="k">export</span> <span class="p">{</span> <span class="v">total</span> <span class="p">}</span>;',0]
];
function build(id,arr){const p=document.getElementById(id);return arr.map((a,i)=>{const r=document.createElement("div");r.className="row"+(a[1]==1?" rm":a[1]==2?" ad":"");r.style.top=(56+12+i*47)+"px";r.innerHTML='<div class="bg"></div><i>'+(i+1)+'</i><span class="in">'+a[0]+'</span>';p.appendChild(r);return r;});}
const lr=build("pl",L), rr=build("pr",R);
const tl=gsap.timeline({paused:true});
// start: left shows code; right shows only context lines. removed rows start un-highlighted, then flag red
lr.forEach((r,i)=>{ if(L[i][1]==1){tl.fromTo(r.querySelector(".bg"),{opacity:0},{opacity:1,duration:.25},0.9+(i-1)*0.1);
  tl.to(r,{opacity:.12,x:-30,duration:.45,ease:"power2.in"},1.9+(i-1)*.06);}});
rr.forEach((r,i)=>{ if(R[i][1]==2){const k=i-1;tl.fromTo(r,{opacity:0,x:120},{opacity:1,x:0,duration:.5,ease:"power4.out"},2.2+k*.22);}});
// first frame: left rows visible; add slight pane intro
tl.fromTo("#pl",{y:14},{y:0,duration:.5,ease:"power3.out"},0);
tl.fromTo("#pr",{y:14},{y:0,duration:.5,ease:"power3.out"},0.08);
tl.fromTo("#chip",{scale:0,opacity:0},{scale:1,opacity:1,duration:.45,ease:"back.out(2.5)",transformOrigin:"50% 50%"},3.3);
tl.set({},{},5);
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;
</script></body></html>
