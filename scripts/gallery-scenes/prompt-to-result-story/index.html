<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Relay motion-graphics reel</title>
<script src="vendor/gsap.min.js"></script>
<style>

  html, body { width: 1280px; height: 720px; overflow: hidden; background: #fff; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #fff; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }

</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1280" data-height="720" data-fps="30">

</div>
<script>

  // ---------- shards ----------

  var oc = document.createElement("canvas"); oc.width = W; oc.height = H; var og = oc.getContext("2d", { willReadFrequently: true });

    var t1 = sample(function (c) { chars(c, "Relay", CX, CY + 6, 230, -8, 800, null); }, N, 11);
    assign(shards, t1, "T1");
    var col = shards.filter(function (s) { return s.kind > 0; }).sort(function (a, b) { return b.kind - a.kind; });

    var sqS = shards.filter(function (s) { return triS.indexOf(s) < 0; });
    var tTri = sample(function (c) { tri(c, CX, CY, MK.s); c.fill(); }, triN, 21);
    var tSq = sample(function (c) { rrect(c, CX - MK.s / 2, CY - MK.s / 2, MK.s, MK.s, MK.r); c.fill(); c.globalCompositeOperation = "destination-out"; tri(c, CX, CY, MK.s); c.lineWidth = 16; c.strokeStyle = "#000"; c.stroke(); c.fill(); }, sqS.length, 31);
    assign(triS, tTri, "T2"); assign(sqS, tSq, "T2");
  }
  build();

  // ---------- shard choreography: segments with continuity offsets ----------
  function pulses(t, list) { var s = 0; list.forEach(function (tk) { var x = (t - tk) / 0.55; if (x > 0 && x < 1) { var v = Math.sin(Math.PI * x); s += v * v; } }); return s; }
  var S1_ARRIVE = 0.42, S2_ARRIVE = 0.72;
  function S0(sh, t) {

  function S1(sh, t) {

  }
  function S2(sh, t) {

  }
  function wipeX(t) { return -150 + 2300 * sm((t - 7.15) / 0.85); }
  function S3(sh, t) {

  }
  function S4(sh, t) {
    var u = Math.max(0, t - 8.3);
    return [sh.cx0 + 70 * Math.sin(sh.ph + 2.3 * u), sh.cy0 + sh.cvy * u + 90 * u * u, sh.rot + sh.spin * 1.5 * u, sh.depth];
  }
  function S5(sh, t) {

  }

  function segAt(t) { var i = SEGS.length - 1; while (i > 0 && t < SEGS[i].t0) i--; return i; }

    }
    return v;
  }
  function activity(t) {
    var a1 = sm((t - 2.0) / 0.5) * (1 - sm((t - 3.0) / 0.25)), a2 = sm((t - 11.4) / 0.5) * (1 - sm((t - 12.9) / 0.25));

  }
  function drawShard(sh, tm, alpha) {

  }

  // ---------- panel palettes ----------
  var PA = { c: [[58, 15, 44], [74, 42, 58], [12, 26, 61]], gl: [214, 120, 60] };
  var PB = { c: [[8, 78, 90], [20, 62, 100], [30, 24, 96]], gl: [70, 210, 190] };
  var PC = { c: [[158, 92, 24], [104, 40, 70], [56, 16, 74]], gl: [255, 178, 72] };
  var PS = [[0, PA], [3.0, PA], [4.0, PB], [5.8, PB], [6.7, PC], [10.0, PC], [11.0, PA], [12.9, PA], [13.9, PB], [15, PB]];

    for (j = 0; j < 3; j++) { out.c.push([]); for (m = 0; m < 3; m++) out.c[j].push(Math.round(lerp(a[1].c[j][m], b[1].c[j][m], k))); }
    for (m = 0; m < 3; m++) out.gl.push(Math.round(lerp(a[1].gl[m], b[1].gl[m], k)));

  }
  function rgb(a) { return "rgb(" + a[0] + "," + a[1] + "," + a[2] + ")"; }
  function flashAmt(t) { var s = 0; [2.35, 3.0, 5.8, 8.3, 11.85, 12.9].forEach(function (tk) { if (t >= tk) s += 0.16 * Math.exp(-(t - tk) * 9); }); return s; }

  // ---------- text ----------
  function shadowOn() { g.shadowColor = "rgba(10,6,30,0.42)"; g.shadowBlur = 26; g.shadowOffsetY = 6; }
  function shadowOff() { g.shadowColor = "transparent"; g.shadowBlur = 0; g.shadowOffsetY = 0; }
  function maskLine(t, text, cy, size, track, color, tIn, tOut) {

  }

  function beat(t, o) {

    g.fillStyle = "#fff"; g.globalAlpha = al; chars(g, o.word, CX, 345, 200, -4, 800, o.fn);
    g.fillStyle = WARM; g.globalAlpha = al * da; chars(g, o.desc, CX, 480 + (1 - da) * 28, 50, 1, 600, null);
    g.restore();
  }
  function drawText(t) {

    }
    if (t >= 7.1 && t < 8.7) {

    }

    }
    // 5 end card
