<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Budget app promo</title>
<script src="vendor/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#fff3ec}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:#fff3ec;font-family:'Quicksand','Inter',sans-serif;color:#2b1d1a}
#blob{position:absolute;left:640px;top:-120px;width:760px;height:760px;border-radius:50%;background:#ffd9cc}
.hl{z-index:5;text-shadow:0 0 14px #fff3ec,0 0 30px #fff3ec;position:absolute;left:72px;top:210px;font-size:104px;font-weight:700;line-height:1.0;letter-spacing:-3px}
.hl.a{color:#2b1d1a}.hl.b{color:#e5483b}
.mask{overflow:hidden;padding:0 10px 14px}.mask span{display:block}
.slip{position:absolute;width:118px;height:176px;background:#fff;box-shadow:0 10px 24px rgba(120,50,30,.18);padding:14px 12px;
 clip-path:polygon(0 0,100% 0,100% 94%,92% 100%,83% 94%,75% 100%,66% 94%,58% 100%,50% 94%,41% 100%,33% 94%,25% 100%,16% 94%,8% 100%,0 94%)}
.slip i{display:block;height:7px;border-radius:4px;background:#e8ddd8;margin-bottom:9px}
.slip b{display:block;height:11px;width:60%;background:#2b1d1a;opacity:.75;border-radius:4px;margin-bottom:14px}
.slip em{position:absolute;right:12px;bottom:26px;font-style:normal;font-weight:700;color:#e5483b;font-size:26px}
#phone{position:absolute;left:770px;top:48px;width:340px;height:660px;border-radius:50px;background:#2b1d1a;padding:14px;box-shadow:0 30px 60px rgba(120,40,20,.3)}
#scr{position:relative;width:100%;height:100%;border-radius:38px;background:#fffaf7;overflow:hidden}
#scr h4{position:absolute;left:26px;top:24px;font-size:30px;font-weight:700}
#scr .sp{position:absolute;right:24px;top:30px;font-size:20px;font-weight:700;color:#e5483b}
.row{position:absolute;left:22px;right:22px;height:56px;border-radius:16px;background:#fff;box-shadow:0 2px 10px rgba(120,50,30,.1);display:flex;align-items:center;padding:0 16px;gap:14px;font-weight:700;font-size:22px}
.row u{width:18px;height:18px;border-radius:50%;display:block}
.row .bar{margin-left:auto;height:10px;border-radius:5px;width:80px;background:#f4e6df;position:relative;overflow:hidden}
.row .bar s{position:absolute;left:0;top:0;bottom:0;border-radius:5px;width:100%;transform-origin:0 50%}
#plus{position:absolute;right:24px;bottom:26px;width:70px;height:70px;border-radius:50%;background:#e5483b;box-shadow:0 8px 18px rgba(229,72,59,.45);display:flex;align-items:center;justify-content:center}
#plus:before,#plus:after{content:"";position:absolute;background:#fff;border-radius:3px}
#plus:before{width:30px;height:6px}#plus:after{width:6px;height:30px}
#cur{position:absolute;left:0;top:0;width:60px;height:60px;z-index:9}
.pulse{position:absolute;width:70px;height:70px;border-radius:50%;border:4px solid #e5483b;opacity:0}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720">
<div id="blob"></div>
<div class="hl a" id="h1"><div class="mask"><span>Receipts</span></div><div class="mask"><span>everywhere.</span></div></div>
<div class="hl b" id="h2"><div class="mask"><span>Know where</span></div><div class="mask"><span>it goes.</span></div></div>
<div id="slips"></div>
<div id="phone"><div id="scr">
 <h4>June</h4><div class="sp">spent so far</div>
 <svg width="312" height="260" viewBox="0 0 312 260" style="position:absolute;left:0;top:26px">
  <circle cx="156" cy="124" r="80" fill="none" stroke="#f4e6df" stroke-width="26"/>
  <g transform="rotate(-90 156 124)" fill="none" stroke-width="26">
   <circle id="r1" cx="156" cy="124" r="80" stroke="#e5483b"/><circle id="r2" cx="156" cy="124" r="80" stroke="#2fb59a"/><circle id="r3" cx="156" cy="124" r="80" stroke="#f5b83d"/></g>
  <text x="156" y="136" text-anchor="middle" font-family="Quicksand" font-weight="700" font-size="34" fill="#2b1d1a" id="tot">$0</text>
 </svg>
 <div class="row" id="n0" style="top:262px;background:#ffeae4"><u style="background:#e5483b"></u>Coffee<span style="margin-left:auto;color:#e5483b">+ $4</span></div>
 <div class="row" id="a1" style="top:262px"><u style="background:#e5483b"></u>Food<div class="bar"><s id="b1" style="background:#e5483b"></s></div></div>
 <div class="row" id="a2" style="top:326px"><u style="background:#2fb59a"></u>Home<div class="bar"><s id="b2" style="background:#2fb59a"></s></div></div>
 <div class="row" id="a3" style="top:390px"><u style="background:#f5b83d"></u>Fun<div class="bar"><s id="b3" style="background:#f5b83d"></s></div></div>
 <div id="plus"></div><div class="pulse" id="pulse" style="right:24px;bottom:26px"></div>
</div></div>
<svg id="cur" viewBox="0 0 60 60"><path d="M10 6 L10 46 L21 36 L29 54 L37 50 L29 33 L44 33 Z" fill="#fff" stroke="#2b1d1a" stroke-width="3.5" stroke-linejoin="round"/></svg>
</div>
<script>
function R(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=R(81);
const sl=document.getElementById("slips");const prices=["$8","$23","$5","$41","$12","$7","$19","$3","$16","$9"];
const slips=[];
for(let i=0;i<10;i++){const d=document.createElement("div");d.className="slip";d.innerHTML='<b></b><i></i><i style="width:80%"></i><i style="width:55%"></i><i></i><i style="width:70%"></i><em>'+prices[i]+'</em>';sl.appendChild(d);
 const x=[40,200,390,90,330,520,640,20,500,250][i]+(rnd()*30-15),y=[60,300,40,480,420,260,470,200,40,540][i]+(rnd()*20-10);
 gsap.set(d,{x,y,rotation:rnd()*60-30});slips.push({d,x,y})}
const tl=gsap.timeline({paused:true});
// text 1
tl.from("#h1 span",{yPercent:110,duration:.5,ease:"power3.out",stagger:.08},.0);
slips.forEach((s,i)=>{tl.from(s.d,{scale:.4,opacity:0,y:s.y+60,duration:.5,ease:"back.out(1.6)"},.02+i*.04);
 tl.to(s.d,{rotation:"+="+(rnd()*16-8),y:s.y-14,duration:1,ease:"sine.inOut"},.4);
 // fly into phone
 tl.to(s.d,{x:830,y:300,rotation:rnd()*40-20,scale:.35,opacity:0,duration:.55,ease:"power3.in"},1.05+i*.05)});
tl.to("#h1 span",{yPercent:-110,duration:.35,ease:"power2.in",stagger:.05},1.0);
tl.set("#h1",{opacity:0},1.5);
tl.fromTo("#h2 span",{yPercent:110},{yPercent:0,duration:.55,ease:"power3.out",stagger:.1},1.35);
// phone
tl.from("#phone",{y:720,rotation:6,duration:.8,ease:"power3.out"},.25);
tl.to("#blob",{scale:1.08,duration:5,ease:"none"},0);
// scene sequencing
const prog={f:0,h:0,u:0,tot:0,fb:0};
const C=2*Math.PI*80;
function upd(){[["r1",0,prog.f],["r2",.4,prog.h],["r3",.75,prog.u]].forEach(([id,start,len])=>{const e=document.getElementById(id);const L=len*C;e.setAttribute("stroke-dasharray",L+" "+(C-L));e.setAttribute("stroke-dashoffset",-start*C)});
 document.getElementById("tot").textContent="$"+Math.round(prog.tot)}
upd();
tl.fromTo(prog,{f:0,h:0,u:0,tot:0},{f:.36,h:.34,u:.24,tot:1180,duration:1.1,ease:"power2.out",onUpdate:upd},1.55);
["#a1","#a2","#a3"].forEach((id,i)=>tl.from(id,{x:80,opacity:0,duration:.4,ease:"back.out(1.5)"},1.65+i*.12));
["#b1","#b2","#b3"].forEach((id,i)=>tl.from(id,{scaleX:0,duration:.5,ease:"power3.out"},1.9+i*.12));
tl.set("#n0",{opacity:0,y:-10},0);
// cursor
gsap.set("#cur",{x:1180,y:760});
tl.to("#cur",{x:1038,y:620,duration:.8,ease:"power3.out"},2.15);
tl.to("#cur",{scale:.82,duration:.08,yoyo:true,repeat:1,transformOrigin:"10px 6px"},3.0);
tl.fromTo("#pulse",{scale:.6,opacity:.9},{scale:1.9,opacity:0,duration:.5,ease:"power2.out"},3.0);
tl.to("#plus",{scale:.88,duration:.08,yoyo:true,repeat:1},3.0);
// add expense: rows shift down, new row in
tl.to("#a1",{y:64,duration:.35,ease:"power3.out"},3.1).to("#a2",{y:64,duration:.35,ease:"power3.out"},3.12).to("#a3",{y:64,duration:.35,ease:"power3.out"},3.14);
tl.to("#n0",{opacity:1,y:0,duration:.4,ease:"back.out(1.7)"},3.15);
tl.to("#cur",{x:1180,y:780,duration:.7,ease:"power2.in"},3.4);
tl.fromTo(prog,{f:.36},{f:.41,h:.31,u:.22,tot:1184,duration:.6,ease:"power2.inOut",onUpdate:upd,immediateRender:false},3.3);
tl.fromTo("#b1",{scaleX:1},{scaleX:1,duration:.1},0);
tl.to("#scr h4",{color:"#e5483b",duration:.3},3.4);
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;
</script></body></html>
