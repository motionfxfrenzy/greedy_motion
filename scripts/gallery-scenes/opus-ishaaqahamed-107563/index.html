<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=720, height=720">
<title>Why we are best loop</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 720px; height: 720px; overflow: hidden; background: #ff4b1f; }
  #root { position: relative; width: 720px; height: 720px; overflow: hidden; background: #ff4b1f; }
  svg { position: absolute; inset: 0; font-family: "Archivo Black", "Inter", sans-serif; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="720" data-height="720" data-fps="30">
<svg id="s" width="720" height="720" viewBox="0 0 720 720"></svg>
</div>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg", s = document.getElementById("s");
  function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); (p || s).appendChild(e); return e; }
  var INK = "#1a1210", CREAM = "#fff1d6", DRED = "#d63a12", BG = "#ff4b1f";
  var tl = gsap.timeline({ paused: true });
  el("rect", { width: 720, height: 720, fill: BG });

  // gear (behind dots)
  var gear = el("g", {});
  var gpos = el("g", { transform: "translate(360 330)" }, gear);
  var gi = el("g", {}, gpos);
  var pts = [], n = 14, i;
  for (i = 0; i < n * 2; i++) { var a0 = (i / (n * 2)) * Math.PI * 2, a1 = ((i + .5) / (n * 2)) * Math.PI * 2, r = i % 2 ? 150 : 188; pts.push((Math.cos(a0) * r).toFixed(1) + "," + (Math.sin(a0) * r).toFixed(1), (Math.cos(a1) * r).toFixed(1) + "," + (Math.sin(a1) * r).toFixed(1)); }
  el("polygon", { points: pts.join(" "), fill: CREAM, stroke: INK, "stroke-width": 10, "stroke-linejoin": "round" }, gi);
  el("circle", { r: 118, fill: "none", stroke: INK, "stroke-width": 8 }, gi);
  el("circle", { r: 58, fill: INK }, gi);
  for (i = 0; i < 6; i++) { var aa = i * Math.PI / 3; el("circle", { cx: Math.cos(aa) * 88, cy: Math.sin(aa) * 88, r: 9, fill: INK }, gi); }
  tl.set(gear, { scale: 0, svgOrigin: "360 330" }, 0);

  // grid dots
  var dots = [];
  for (i = 0; i < 49; i++) { var c = el("circle", { r: 22, fill: DRED }); dots.push({ e: c, gx: 90 * (i % 7 + 1), gy: 90 * (Math.floor(i / 7) + 1) }); tl.set(c, { x: dots[i].gx, y: dots[i].gy }, 0); }

  var tag = el("text", { x: 48, y: 74, "font-size": 30, fill: INK, "letter-spacing": 8 }); tag.textContent = "KERNEL";
  var big = el("text", { x: 360, y: 440, "font-size": 230, fill: CREAM, "text-anchor": "middle", textLength: 600, lengthAdjust: "spacingAndGlyphs", stroke: INK, "stroke-width": 0 }); big.textContent = "EVEN.";
  var bigShadow = el("text", { x: 366, y: 446, "font-size": 230, fill: INK, "text-anchor": "middle", textLength: 600, lengthAdjust: "spacingAndGlyphs" }); bigShadow.textContent = "EVEN.";
  s.insertBefore(bigShadow, big);
  var them = el("text", { x: 48, y: 180, "font-size": 92, fill: INK, opacity: 0 }); them.textContent = "THEM";
  var us = el("text", { x: 48, y: 560, "font-size": 92, fill: CREAM, opacity: 0 }); us.textContent = "US";
  var one = el("text", { x: 360, y: 120, "font-size": 96, fill: INK, "text-anchor": "middle", opacity: 0 }); one.textContent = "ONE SIZE.";

  // ---- hold, then the hook leaves (0 - 0.8)
  tl.to([big, bigShadow], { y: -700, duration: .35, ease: "power3.in" }, .75);
  tl.to(tag, { opacity: 0, duration: .15 }, .75);
  tl.set([big, bigShadow], { y: 0, opacity: 0 }, 1.12);

  // ---- proof 1 (0.9 - 2.2): uneven row vs even row
  var sizes = [14, 40, 22, 50, 18, 34, 28], jit = [10, -14, 6, -4, 16, -10, 4];
  dots.forEach(function (d, k) {
    if (k < 7) {
      tl.to(d.e, { x: 90 * (k + 1), y: 290 + jit[k], scale: sizes[k] / 22, fill: INK, duration: .5, ease: "back.out(1.6)" }, .9 + k * .03);
    } else if (k < 14) {
      tl.to(d.e, { x: 90 * (k - 6), y: 450, scale: 30 / 22, fill: CREAM, duration: .5, ease: "back.out(1.6)" }, .95 + (k - 7) * .03);
    } else {
      tl.to(d.e, { scale: 0, duration: .3, ease: "power2.in" }, .85 + (k % 7) * .02);
    }
  });
  tl.to(them, { opacity: 1, duration: .01 }, 1.1); tl.fromTo(them, { y: 30 }, { y: 0, duration: .3, ease: "power3.out" }, 1.1);
  tl.to(us, { opacity: 1, duration: .01 }, 1.25); tl.fromTo(us, { y: 30 }, { y: 0, duration: .3, ease: "power3.out" }, 1.25);
  tl.to([them, us], { opacity: 0, duration: .15 }, 2.05);

  // ---- proof 2 (2.2 - 3.6): the burr evens everything out
  tl.to(gear, { scale: 1, duration: .45, ease: "back.out(1.5)" }, 2.1);
  tl.to(gi, { rotation: 220, svgOrigin: "0 0", duration: 1.6, ease: "none" }, 2.1);
  tl.to(one, { opacity: 1, duration: .01 }, 2.3); tl.fromTo(one, { y: 40 }, { y: 0, duration: .3, ease: "power3.out" }, 2.3);
  dots.forEach(function (d, k) {
    if (k < 14) tl.to(d.e, { x: 360, y: 330, scale: 0.15, duration: .4, ease: "power2.in" }, 2.3 + (k % 7) * .07);
  });
  tl.set(dots.slice(0, 14).map(function (d) { return d.e; }), { opacity: 0 }, 2.9);
  for (i = 0; i < 7; i++) {
    var d2 = dots[7 + i].e;
    tl.set(d2, { opacity: 1, fill: CREAM, x: 360, y: 440, scale: 0 }, 2.75 + i * .07);
    tl.to(d2, { x: 90 * (i + 1), y: 620, scale: 30 / 22, duration: .5, ease: "back.out(1.7)" }, 2.75 + i * .07);
  }

  // ---- back to the opening frame (3.6 - 5): the loop
  tl.to(gear, { scale: 0, duration: .3, ease: "power3.in" }, 3.55);
  tl.to(one, { opacity: 0, duration: .15 }, 3.55);
  dots.forEach(function (d, k) {
    var r = Math.floor(k / 7), c = k % 7, delay = 3.65 + (r + c) * .035;
    tl.set(d.e, { opacity: 1 }, 3.6);
    tl.to(d.e, { x: d.gx, y: d.gy, scale: 1, fill: DRED, duration: .45, ease: "power3.inOut" }, delay);
  });
  tl.set([big, bigShadow], { opacity: 1, y: -700 }, 3.6);
  tl.to([big, bigShadow], { y: 0, duration: .45, ease: "back.out(1.4)" }, 4.0);
  tl.to(tag, { opacity: 1, duration: .15 }, 4.3);

  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
  tl.set({}, {}, 5);
})();
</script>
</body>
</html>
