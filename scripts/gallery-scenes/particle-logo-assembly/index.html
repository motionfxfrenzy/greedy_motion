<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Particle logo assembly</title>
<script src="vendor/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#060714}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:#060714;font-family:'Space Grotesk',Arial,sans-serif}
canvas{position:absolute;inset:0;width:1280px;height:720px;display:block}
#cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;color:#fff;font-weight:700;font-size:84px;letter-spacing:-2px;text-shadow:0 0 30px rgba(120,140,255,.7);opacity:0}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720">
<canvas id="c"></canvas>
<div id="cap">Meet Lumio</div>
</div>
<script type="module">
import * as THREE from "./vendor/three/three.module.js";
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("c"),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(1280,720,false);renderer.setClearColor(0x060714,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1280/720,0.1,100);
function sprite(){const c=document.createElement("canvas");c.width=c.height=64;const g=c.getContext("2d");
 const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(.25,"rgba(255,255,255,.8)");gr.addColorStop(1,"rgba(255,255,255,0)");
 g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
const tex=sprite();
const N=9000;
const target=new Float32Array(N*3),start=new Float32Array(N*3),delay=new Float32Array(N),spin=new Float32Array(N),col=new Float32Array(N*3);
const c1=new THREE.Color(0x35e0ff),c2=new THREE.Color(0xb05cff),c3=new THREE.Color(0xff5fa8);
const tri=[[-0.8,-1.05],[-0.8,1.05],[1.15,0]];
for(let i=0;i<N;i++){
 let x,y;
 if(i<N*0.62){const a=R()*Math.PI*2,r=2.45+(R()+R()-1)*0.16;x=Math.cos(a)*r;y=Math.sin(a)*r}
 else{let u=R(),v=R();if(u+v>1){u=1-u;v=1-v}
  x=tri[0][0]+u*(tri[1][0]-tri[0][0])+v*(tri[2][0]-tri[0][0]);y=tri[0][1]+u*(tri[1][1]-tri[0][1])+v*(tri[2][1]-tri[0][1])}
 target[i*3]=x;target[i*3+1]=y;target[i*3+2]=(R()-.5)*0.25;
 const a=R()*Math.PI*2,r=3+R()*7,z=(R()-.5)*8;
 start[i*3]=Math.cos(a)*r*1.5;start[i*3+1]=Math.sin(a)*r*.9;start[i*3+2]=z;
 delay[i]=R()*0.9;spin[i]=(R()<.5?-1:1)*(1.5+R()*2.5);
 const t=Math.abs(Math.atan2(y,x))/Math.PI;const c=new THREE.Color();
 if(t<.5)c.copy(c1).lerp(c2,t*2);else c.copy(c2).lerp(c3,(t-.5)*2);
 col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}
const pos=new Float32Array(N*3);
const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(pos,3));geo.setAttribute("color",new THREE.BufferAttribute(col,3));
const mk=(size,op)=>new THREE.Points(geo,new THREE.PointsMaterial({size,map:tex,vertexColors:true,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
const glow=mk(0.3,.14),core=mk(0.11,.9);
const group=new THREE.Group();group.add(glow,core);scene.add(group);
const e=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function draw(t){
 for(let i=0;i<N;i++){
  let p=Math.min(1,Math.max(0,(t-0.2-delay[i])/3.0));p=e(p);
  const ix=i*3;
  let sx=start[ix],sy=start[ix+1],sz=start[ix+2];
  const ang=(1-p)*spin[i]+t*0.35*(1-p);
  const ca=Math.cos(ang),sa=Math.sin(ang);
  let bx=sx*(1-p)+target[ix]*p,by=sy*(1-p)+target[ix+1]*p,bz=sz*(1-p)+target[ix+2]*p;
  pos[ix]=bx*ca-by*sa;pos[ix+1]=bx*sa+by*ca;pos[ix+2]=bz;
 }
 geo.attributes.position.needsUpdate=true;
 const hold=Math.min(1,Math.max(0,(t-3.2)/1.2));
 const pulse=1+0.25*Math.sin(Math.min(1,Math.max(0,(t-3.2)/0.8))*Math.PI);
 glow.material.size=0.3*pulse+0.08*hold;glow.material.opacity=.12+.05*hold;
 group.rotation.y=Math.sin(t*0.5)*0.25*(1-hold*.6);
 group.rotation.x=Math.sin(t*0.4)*0.08;
 camera.position.set(0,-0.6+0.0*t,11.5-t*0.25);camera.lookAt(0,-0.7,0);
 renderer.render(scene,camera);
}
window.addEventListener("hf-seek",e=>draw(e.detail.time));
draw(window.__hfThreeTime||0);
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.to("#cap",{opacity:1,y:0,duration:.5,ease:"power2.out"},2.9).from("#cap",{y:30,duration:.5,ease:"power2.out"},2.9).to({},{duration:5},0);
window.__timelines["main"]=tl;
</script></body></html>
