<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Poster breaks frame</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #17120f; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #17120f; font-family: "Archivo Black", "Inter", sans-serif; color: #17120f; }
  .abs { position: absolute; }
  #paper { left: 40px; top: 40px; width: 1200px; height: 640px; background: #f4ead6; }
  #frame { left: 62px; top: 62px; width: 1156px; height: 596px; border: 7px solid #17120f; }
  #circle { left: 810px; top: 130px; width: 300px; height: 300px; border-radius: 50%; background: #ff3d7f; }
  #sun { left: 880px; top: 200px; width: 160px; height: 160px; border-radius: 50%; background: #17120f; }
  #head { left: 110px; top: 110px; font-size: 150px; line-height: .86; letter-spacing: -0.045em; transform-origin: 0 0; white-space: nowrap; }
  #bars { left: 110px; top: 470px; transform-origin: 0 0; }
  #bars i { display: block; width: 300px; height: 14px; background: #17120f; margin-bottom: 12px; }
  #info { left: 110px; top: 600px; font-size: 30px; letter-spacing: .06em; white-space: nowrap; transform-origin: 0 0; }
  #strip { left: 0; top: 610px; width: 1280px; height: 110px; background: #17120f; transform-origin: 0 100%; }
  #crack { left: 0; top: 0; }
  #flash { inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
  <div class="abs" id="paper"></div>
  <div class="abs" id="strip"></div>
  <div class="abs" id="circle"></div>
  <div class="abs" id="sun"></div>
  <div class="abs" id="bars"><i></i><i></i><i></i></div>
  <div class="abs" id="head">NIGHT<br>SHIFT</div>
  <div class="abs" id="info">LIVE MUSIC · FRI 14 NOV · DOORS 8PM</div>
  <div class="abs" id="frame"></div>
  <svg class="abs" id="crack" width="1280" height="720" viewBox="0 0 1280 720"></svg>
  <div class="abs" id="flash"></div>
</div>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg", s = document.getElementById("crack");
  function el(tag, a) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); s.appendChild(e); return e; }
  var tl = gsap.timeline({ paused: true });
  // poster pushes: elements swell against the frame and shudder
  tl.to(["#head", "#circle", "#sun", "#bars", "#info"], { scale: 1.07, duration: 0.7, ease: "power2.in" }, 0.5);
  tl.to("#frame", { x: 0, duration: 0.01 }, 0);
  for (var i = 0; i < 12; i++) tl.set("#frame", { x: (i % 2 ? 1 : -1) * (2 + i * 0.5), y: (i % 3 - 1) * (1.5 + i * 0.4) }, 0.7 + i * 0.055);
  // cracks race across the border
  var cr = [
    "M62 150 L110 168 L96 200 L150 214", "M1218 520 L1168 506 L1180 470 L1126 458",
    "M420 62 L436 106 L402 128 L430 176", "M820 658 L800 612 L842 596 L824 548",
    "M62 480 L98 470 L90 440", "M1218 230 L1180 246 L1196 280"
  ];
  cr.forEach(function (d, j) {
    var p = el("path", { d: d, fill: "none", stroke: "#17120f", "stroke-width": 8, "stroke-linejoin": "miter", "stroke-linecap": "butt" });
    var L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    tl.to(p, { strokeDashoffset: 0, duration: 0.18, ease: "none" }, 1.05 + j * 0.07);
    tl.to(p, { opacity: 0, duration: 0.01 }, 1.95);
  });
  // break: flash, frame flies off, paper floods to full bleed
  tl.to("#flash", { opacity: 0.85, duration: 0.05 }, 1.62).to("#flash", { opacity: 0, duration: 0.18 }, 1.67);
  tl.to("#frame", { scale: 1.5, opacity: 0, duration: 0.35, ease: "power3.out" }, 1.65);
  tl.to("#paper", { left: 0, top: 0, width: 1280, height: 720, backgroundColor: "#ffd400", duration: 0.45, ease: "expo.out" }, 1.65);
  tl.set("body", {}, 0);
  // elements burst out past the edges into the final lockup
  tl.to("#head", { scale: 2, x: -50, y: -92, duration: 0.7, ease: "expo.out" }, 1.7);
  tl.to("#circle", { scale: 2.3, x: 330, y: -120, duration: 0.8, ease: "expo.out" }, 1.68);
  tl.to("#sun", { scale: 0.001, opacity: 0, duration: 0.2 }, 1.65);
  tl.to("#bars", { scaleX: 4.6, scaleY: 0.8, x: -110, y: 62, duration: 0.7, ease: "expo.out" }, 1.75);
  tl.to("#strip", { top: 600, height: 120, duration: 0.01 }, 0);
  tl.fromTo("#strip", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power4.out" }, 2.05);
  tl.to("#info", { scale: 1.5, x: 30, y: 6, color: "#ffd400", duration: 0.5, ease: "expo.out" }, 2.1);
  // after the break: a hard punch on the headline and held lockup
  tl.fromTo("#head", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 2.4);
  tl.to("#head", { scale: 2.06, duration: 0.25, ease: "power3.out" }, 2.5);
  tl.to("#head", { scale: 2, duration: 0.5, ease: "power2.inOut" }, 2.75);
  tl.to("#circle", { x: 300, y: -140, duration: 1.2, ease: "power1.inOut" }, 2.5);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
