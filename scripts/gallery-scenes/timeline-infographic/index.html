<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Timeline infographic</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f4f7fb; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: linear-gradient(180deg, #f7f9fc 0%, #e6edf7 100%); font-family: "Inter", sans-serif; }
  svg { position: absolute; inset: 0; }
  .cap { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 64px; fill: #12233d; }
  .lab { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 46px; fill: #12233d; }
  .yr { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 34px; fill: #2f6fed; }
  .tag { font-family: "Inter", sans-serif; font-size: 22px; fill: #6b7c96; letter-spacing: 3px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
<svg id="s" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="cam">
    <path id="track" d="M-100 420 H1400" stroke="#cdd8e8" stroke-width="12" stroke-linecap="round"/>
    <path id="prog" d="M-100 420 H1400" stroke="#2f6fed" stroke-width="12" stroke-linecap="round"/>
    <g id="nodes"></g>
  </g>
  <text class="cap" x="70" y="110">Four steps forward</text>
  <text class="tag" x="72" y="150">EXAMPLE TIMELINE</text>
</svg>
</div>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }
  var M = [
    { x: 200, yr: "2021", lab: ["Idea", "Sketch"], col: "#2f6fed", ico: "M0 -16 A12 12 0 1 1 0.1 -16 M-7 6 H7 M-5 13 H5 M-9 -4 C-14 -10 -8 -24 0 -24 C8 -24 14 -10 9 -4 C7 -1 7 2 7 6 H-7 C-7 2 -7 -1 -9 -4" },
    { x: 490, yr: "2022", lab: ["First", "Build"], col: "#14b8a6", ico: "M-14 14 L-14 -6 L0 -16 L14 -6 L14 14 Z M-5 14 V2 H5 V14" },
    { x: 780, yr: "2023", lab: ["Public", "Launch"], col: "#f59e0b", ico: "M0 -20 C10 -12 12 0 8 10 L-8 10 C-12 0 -10 -12 0 -20 Z M-8 10 L-14 18 L-6 14 M8 10 L14 18 L6 14 M0 -6 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0" },
    { x: 1070, yr: "2024", lab: ["Global", "Growth"], col: "#ec4899", ico: "M-16 14 L-5 2 L2 8 L16 -10 M6 -10 H16 V0" }
  ];
  var ng = document.getElementById("nodes"), items = [];
  M.forEach(function (m, i) {
    var g = el("g", { transform: "translate(" + m.x + " 420) scale(1.12)", opacity: 0.35 }, ng);
    var up = i % 2 === 0;
    var stem = el("line", { x1: 0, y1: 0, x2: 0, y2: up ? -95 : 95, stroke: m.col, "stroke-width": 5, "stroke-linecap": "round", opacity: 0 }, g);
    var halo = el("circle", { r: 54, fill: m.col, opacity: 0 }, g);
    var c = el("circle", { r: 50, fill: "#ffffff", stroke: m.col, "stroke-width": 8 }, g);
    var ic = el("g", {}, g);
    el("path", { d: m.ico, fill: "none", stroke: m.col, "stroke-width": 5, "stroke-linecap": "round", "stroke-linejoin": "round" }, ic);
    var tg = el("g", { opacity: 0 }, g);
    var ty = up ? -125 : 155;
    var y = el("text", { class: "yr", x: 0, y: ty - 8, "text-anchor": "middle" }, tg); y.textContent = m.yr;
    var l1 = el("text", { class: "lab", x: 0, y: ty + 32, "text-anchor": "middle" }, tg); l1.textContent = m.lab[0] + " " + m.lab[1];
    items.push({ g: g, stem: stem, halo: halo, c: c, ic: ic, tg: tg, m: m, ty: ty });
  });
  var prog = document.getElementById("prog");
  var PL = prog.getTotalLength();
  prog.setAttribute("stroke-dasharray", PL); prog.setAttribute("stroke-dashoffset", PL);
  function dash(x) { prog.setAttribute("stroke-dashoffset", PL - (x + 100)); }
  var st = { x: -100 };
  dash(-100);
  var tl = gsap.timeline({ paused: true });
  tl.fromTo("#cam", { x: 40, scale: 1.04, transformOrigin: "640px 400px" }, { x: -40, scale: 1, duration: 4.8, ease: "power1.inOut" }, 0.1);
  tl.to(st, { x: 1070, duration: 4.0, ease: "none", onUpdate: function () { dash(st.x); } }, 0.2);
  items.forEach(function (it, i) {
    // line reaches node x at: 0.2 + 4.2 * (x+100)/1660
    var at = 0.2 + 4.0 * (it.m.x + 100) / 1170 - 0.15;
    if (i === 0) at = 0.35;
    var o = it.m.x + " 400";
    tl.to(it.g, { opacity: 1, duration: 0.25 }, at);
    tl.fromTo(it.c, { attr: { r: 30 } }, { attr: { r: 50 }, duration: 0.45, ease: "back.out(3)" }, at);
    tl.fromTo(it.halo, { opacity: 0.55, attr: { r: 44 } }, { opacity: 0, attr: { r: 86 }, duration: 0.7, ease: "power2.out" }, at);
    tl.to(it.c, { fill: it.m.col, duration: 0.25 }, at);
    tl.to(it.ic.firstChild, { stroke: "#ffffff", duration: 0.25 }, at);
    tl.to(it.stem, { opacity: 1, duration: 0.3 }, at + 0.1);
    tl.fromTo(it.tg, { opacity: 0, y: it.ty < 0 ? 18 : -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at + 0.15);
  });
  tl.set({}, {}, 5);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
