<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>About us story</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f4efe4; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #e3e9ee; font-family: "Inter", sans-serif; }
  #shake, #cam { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  .it { position: absolute; will-change: transform; }
  .ab { font-family: "Archivo Black", "Inter", sans-serif; }
  .sk { display: inline-block; transform: skewX(-9deg); }
  #grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .22; }
  .o * { fill: #fff !important; stroke: #fff !important; stroke-width: 17px !important; stroke-linejoin: round; }
  .ppl { filter: drop-shadow(0 7px 7px rgba(40,40,60,.35)); }
  .paper { filter: drop-shadow(2px 5px 5px rgba(40,40,60,.28)); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1280" data-height="720" data-fps="30">
<div id="shake"><div id="cam"></div></div>
<svg id="grain" width="1280" height="720" viewBox="0 0 1280 720"><filter id="gf" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="4"/><feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .33  0 0 0 1.1 -.3"/></filter><rect width="1280" height="720" filter="url(#gf)"/></svg>
</div>
<script>
(function () {
  var cam = document.getElementById("cam");
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var R = rng(77);
  function mk(html, st, cls) {
    var d = document.createElement("div");
    d.className = "it " + (cls || "");
    d.style.cssText = st || "";
    d.innerHTML = html || "";
    cam.appendChild(d);
    return d;
  }
  function jag(w, h, step, amp, top, bot) { // torn edge polygon
    var p = [], x, i;
    for (x = 0; x <= w; x += step) p.push((x).toFixed(0) + "px " + (top ? (R() * amp).toFixed(1) : 0) + "px");
    for (x = w; x >= 0; x -= step) p.push((x).toFixed(0) + "px " + (h - (bot ? R() * amp : 0)).toFixed(1) + "px");
    return "polygon(" + p.join(",") + ")";
  }
  var INK = "#2a2723", MUST = "#f2c230", ORG = "#e8641e", GREEN = "#3fae6a", BLUE = "#2b8fd0";

  /* ---------- map backdrop ---------- */
  var mapSvg = '<svg width="1500" height="860" viewBox="0 0 1500 860"><rect width="1500" height="860" fill="#e2e9ee"/>';
  var gx, gy;
  for (gx = 40; gx < 1500; gx += 110) mapSvg += '<line x1="' + (gx + R() * 8) + '" y1="0" x2="' + (gx - 30 + R() * 8) + '" y2="860" stroke="#f3f6f8" stroke-width="' + (R() > .6 ? 9 : 5) + '"/>';
  for (gy = 30; gy < 860; gy += 95) mapSvg += '<line x1="0" y1="' + (gy + R() * 8) + '" x2="1500" y2="' + (gy + 22 + R() * 8) + '" stroke="#f3f6f8" stroke-width="' + (R() > .6 ? 9 : 5) + '"/>';
  mapSvg += '<rect x="900" y="560" width="260" height="170" rx="30" fill="#d4e4da"/><rect x="190" y="520" width="190" height="130" rx="26" fill="#d4e4da"/>';
  mapSvg += '<path d="M-20 130 C150 100 290 120 380 200 C470 280 640 250 760 330 C860 400 980 470 1100 560 C1220 650 1340 690 1540 700" fill="none" stroke="#b9ccdc" stroke-width="34" stroke-linecap="round"/>';
  mapSvg += '<path d="M-20 130 C150 100 290 120 380 200 C470 280 640 250 760 330 C860 400 980 470 1100 560 C1220 650 1340 690 1540 700" fill="none" stroke="#cfdce7" stroke-width="22" stroke-linecap="round"/>';
  [[300, 150], [820, 365], [1180, 590]].forEach(function (b) { mapSvg += '<rect x="' + (b[0] - 6) + '" y="' + (b[1] - 40) + '" width="12" height="80" fill="#f7f9fa" transform="rotate(35 ' + b[0] + ' ' + b[1] + ')"/>'; });
  for (gx = 0; gx < 70; gx++) mapSvg += '<circle cx="' + (R() * 1500).toFixed(0) + '" cy="' + (R() * 860).toFixed(0) + '" r="' + (1 + R() * 2.4).toFixed(1) + '" fill="#9fb0bd" opacity=".45"/>';
  mapSvg += '</svg>';
  var map = mk(mapSvg, "left:-110px;top:-70px;width:1500px;height:860px;");

  /* ---------- drawing helpers ---------- */
  function person(o) {
    function shapes() {
      var s = '';
      s += '<path d="M8 300 C8 218 52 188 110 188 C168 188 212 218 212 300 Z" fill="' + o.shirt + '" stroke="#1f1d1a" stroke-width="3"/>';
      if (o.apron) s += '<path d="M70 196 L150 196 L160 300 L60 300 Z" fill="' + o.apron + '" stroke="#1f1d1a" stroke-width="3"/><path d="M78 196 L96 168 M142 196 L124 168" stroke="' + o.apron + '" stroke-width="7"/><rect x="88" y="244" width="44" height="30" rx="6" fill="rgba(255,255,255,.4)" stroke="#1f1d1a" stroke-width="2"/>';
      s += '<rect x="94" y="150" width="32" height="48" rx="12" fill="' + o.skin + '" stroke="#1f1d1a" stroke-width="3"/>';
      if (o.hairBack) s += o.hairBack;
      s += '<ellipse cx="110" cy="108" rx="52" ry="58" fill="' + o.skin + '" stroke="#1f1d1a" stroke-width="3"/>';
      s += '<ellipse cx="58" cy="116" rx="8" ry="12" fill="' + o.skin + '" stroke="#1f1d1a" stroke-width="3"/><ellipse cx="162" cy="116" rx="8" ry="12" fill="' + o.skin + '" stroke="#1f1d1a" stroke-width="3"/>';
      s += o.hair || '';
      s += '<circle cx="90" cy="112" r="5.5" fill="#1f1d1a"/><circle cx="130" cy="112" r="5.5" fill="#1f1d1a"/>';
      s += '<path d="M90 136 Q110 154 130 136" fill="none" stroke="#1f1d1a" stroke-width="4" stroke-linecap="round"/>';
      s += '<circle cx="76" cy="130" r="8" fill="#f08a7a" opacity=".5"/><circle cx="144" cy="130" r="8" fill="#f08a7a" opacity=".5"/>';
      s += o.hat || '';
      return s;
    }
    return '<svg class="ppl" width="' + (o.w || 220) + '" height="' + ((o.w || 220) * 300 / 220 | 0) + '" viewBox="-10 -30 240 340" overflow="visible"><g class="o">' + shapes() + '</g><g>' + shapes() + '</g></svg>';
  }
  var chef = '<path d="M62 62 C40 58 38 22 66 22 C70 -6 108 -10 112 14 C130 -8 164 6 158 30 C184 34 176 66 152 64 L152 76 L68 76 Z" fill="#fffdf7" stroke="#1f1d1a" stroke-width="3"/><rect x="66" y="64" width="88" height="14" fill="#fffdf7" stroke="#1f1d1a" stroke-width="3"/>';
  var pA = person({ skin: "#eab48b", shirt: "#fffaf0", apron: "#e9a23b", hair: '<path d="M60 90 C62 72 90 62 110 66 C132 62 160 74 160 90 C140 80 120 82 110 78 C96 84 74 84 60 90Z" fill="#6a4228" stroke="#1f1d1a" stroke-width="3"/>', hat: chef });
  var pB = person({ skin: "#8f5b3a", shirt: "#4fa3d9", apron: "#fffaf0", hair: '<g fill="#25201c" stroke="#1f1d1a" stroke-width="3"><circle cx="70" cy="70" r="17"/><circle cx="96" cy="58" r="18"/><circle cx="126" cy="58" r="18"/><circle cx="152" cy="72" r="17"/></g>', hat: '<path d="M54 76 C60 36 160 36 166 76 Z" fill="#3fae6a" stroke="#1f1d1a" stroke-width="3"/><path d="M160 74 L206 82 C204 92 170 92 156 84 Z" fill="#2f9159" stroke="#1f1d1a" stroke-width="3"/>' });
  var pM = person({ skin: "#cb8b62", shirt: "#f0793a", apron: "#fffaf0", hairBack: '<circle cx="110" cy="38" r="22" fill="#1d1a18" stroke="#1f1d1a" stroke-width="3"/>', hair: '<path d="M56 100 C52 56 168 56 164 100 C150 78 128 74 110 76 C92 74 70 78 56 100Z" fill="#1d1a18" stroke="#1f1d1a" stroke-width="3"/>', hat: '<rect x="58" y="70" width="104" height="12" rx="6" fill="#e8d44a" stroke="#1f1d1a" stroke-width="3"/>' });
  var pT = person({ skin: "#f1c9a5", shirt: "#e9566b", apron: "#6b4aa8", hair: '<path d="M54 106 C46 52 174 52 166 106 C158 80 140 72 110 74 C80 72 62 80 54 106Z" fill="#c75a2a" stroke="#1f1d1a" stroke-width="3"/>', hat: '<path d="M56 74 C60 30 160 30 164 74 Z" fill="#2b8fd0" stroke="#1f1d1a" stroke-width="3"/><circle cx="110" cy="26" r="11" fill="#fffaf0" stroke="#1f1d1a" stroke-width="3"/>' });

  function croissant(w) {
    var seg = [[-62, 14, 20, 16, -62], [-34, -10, 24, 21, -35], [0, -20, 28, 25, 0], [34, -10, 24, 21, 35], [62, 14, 20, 16, 62]], s = '';
    seg.forEach(function (g) { s += '<ellipse cx="' + (100 + g[0]) + '" cy="' + (70 + g[1] + (Math.abs(g[0]) > 30 ? 8 : 0)) + '" rx="' + (g[2] + 10) + '" ry="' + g[3] + '" transform="rotate(' + g[4] + ' ' + (100 + g[0]) + ' ' + (70 + g[1]) + ')" fill="#e39a3f" stroke="#7a4317" stroke-width="5"/>'; });
    s += '<path d="M72 52 Q100 40 128 52" fill="none" stroke="#f6c576" stroke-width="5" stroke-linecap="round"/>';
    return '<svg width="' + w + '" height="' + (w * .7) + '" viewBox="0 0 200 140">' + s + '</svg>';
  }
  function loaf(w) {
    return '<svg width="' + w + '" height="' + (w * .62) + '" viewBox="0 0 200 124"><path d="M14 100 C0 50 40 14 100 14 C160 14 200 50 186 100 Z" fill="#d9903c" stroke="#7a4317" stroke-width="5"/><path d="M60 30 L76 66 M100 26 L112 68 M138 32 L146 68" stroke="#f1c27a" stroke-width="7" stroke-linecap="round"/></svg>';
  }

  /* ---------- elements, in z-order ---------- */
  // sec1 bakery shop
  var shopSvg = (function () {
    function parts() {
      var s = '<rect x="30" y="110" width="270" height="220" fill="#fbf0d8" stroke="#6b4a2a" stroke-width="4"/>';
      s += '<rect x="60" y="190" width="100" height="100" fill="#cfe6f2" stroke="#6b4a2a" stroke-width="4"/><rect x="195" y="170" width="70" height="160" fill="#b4743a" stroke="#6b4a2a" stroke-width="4"/>';
      var i; for (i = 0; i < 6; i++) s += '<rect x="' + (14 + i * 47) + '" y="70" width="47" height="60" fill="' + (i % 2 ? '#fffaf0' : '#e8641e') + '" stroke="#6b4a2a" stroke-width="3"/>';
      s += '<rect x="60" y="20" width="210" height="44" rx="8" fill="#f2c230" stroke="#6b4a2a" stroke-width="4"/>';
      return s;
    }
    return '<svg width="330" height="350" viewBox="0 0 330 350" overflow="visible"><g class="o">' + parts() + '</g>' + parts() + '<text x="165" y="53" text-anchor="middle" font-family="Archivo Black" font-size="30" fill="#2a2723">CRUMB</text><path d="M70 270 q20 -30 40 0 M95 262 l0 14" stroke="#c07a30" stroke-width="5" fill="none"/>' + '<ellipse cx="85" cy="272" rx="20" ry="9" fill="#e39a3f" stroke="#7a4317" stroke-width="3"/><ellipse cx="130" cy="272" rx="20" ry="9" fill="#e39a3f" stroke="#7a4317" stroke-width="3"/></svg>';
  })();
  var shop = mk(shopSvg, "left:790px;top:215px;width:330px;height:350px;", "ppl");

  // sec2 scraps
  var scrapTxt = ["2 baguettes?", "pickup 8am", "where's mine", "+3 rolls pls", "order #41??", "cake for Fri", "did u get my msg", "9 buns, ASAP", "msg me back!", "late again?"];
  var scraps = [];
  var si;
  for (si = 0; si < 10; si++) {
    var sw = 200 + R() * 40, sh = 100 + R() * 20, pts = [], k, nP = 9;
    for (k = 0; k < nP; k++) { var an = k / nP * Math.PI * 2, rx = sw / 2 * (.9 + R() * .1), ry = sh / 2 * (.9 + R() * .1); pts.push((sw / 2 + Math.cos(an) * rx).toFixed(0) + 'px ' + (sh / 2 + Math.sin(an) * ry).toFixed(0) + 'px'); }
    var col = ["#fffdf6", "#f8f1dc", "#fbf6e8", "#eef3f6"][si % 4];
    var ex = '<div style="position:absolute;inset:0;clip-path:polygon(' + pts.join(",") + ');background:' + col + ';"><div style="position:absolute;left:26px;top:20px;right:22px;font:700 24px/1.1 Quicksand,sans-serif;color:' + (si % 3 ? '#3b6fb0' : '#2a2723') + ';">' + scrapTxt[si] + '</div><div style="position:absolute;left:0;top:' + (sh * .5) + 'px;width:100%;height:2px;background:rgba(0,0,0,.08)"></div><div style="position:absolute;left:' + (sw * .45) + 'px;top:0;width:2px;height:100%;background:rgba(0,0,0,.06)"></div></div>';
    var sc = mk(ex, "width:" + sw + "px;height:" + sh + "px;", "paper");
    scraps.push({ el: sc, w: sw, h: sh });
  }

  // notebook
  var nb = mk(
    '<div style="position:absolute;inset:0;background:#fffefa;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#a9c8e6 33px,#a9c8e6 35px);background-position:0 24px;border-radius:4px;"></div>' +
    '<div style="position:absolute;left:62px;top:0;bottom:0;width:3px;background:#e8695f;"></div>' +
    '<div id="nlogo" style="position:absolute;left:84px;top:50px;width:190px;text-align:center;">' + croissant(160) + '<div class="ab" style="font-size:38px;color:#2a2723;margin-top:-2px;letter-spacing:1px;"><span class="sk">CRUMB</span></div></div>' +
    '<div id="nurl" style="position:absolute;left:300px;top:112px;font:800 38px Inter,sans-serif;color:' + BLUE + ';white-space:nowrap;clip-path:inset(0 100% 0 0);">crumb.example</div>',
    "left:395px;top:115px;width:610px;height:280px;", "paper");

  // people
  var A = mk(pA, "left:52px;top:372px;width:220px;");
  var B = mk(pB, "left:262px;top:384px;width:220px;");
  var M = mk(pM, "left:490px;top:376px;width:220px;");
  var T = mk(pT, "left:990px;top:372px;width:230px;");

  // bread stickers (sec4)
  var st1 = mk(croissant(110), "left:620px;top:300px;", "ppl");
  var st2 = mk(loaf(120), "left:640px;top:495px;", "ppl");
  var st3 = mk(croissant(90), "left:1110px;top:250px;", "ppl");

  // stamp
  var stamp = mk(
    '<svg width="290" height="290" viewBox="0 0 290 290" style="overflow:visible"><defs><filter id="rf" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter></defs><g filter="url(#rf)" fill="none" stroke="' + ORG + '"><circle cx="145" cy="145" r="128" stroke-width="10"/><circle cx="145" cy="145" r="106" stroke-width="3.5"/></g><g filter="url(#rf)"><text x="145" y="152" text-anchor="middle" font-family="Archivo Black" font-size="50" fill="' + ORG + '">10,000</text><text x="145" y="198" text-anchor="middle" font-family="Archivo Black" font-size="36" fill="' + ORG + '">loaves</text><path d="M80 98 L210 98 M90 218 L200 218" stroke="' + ORG + '" stroke-width="4"/></g></svg>',
    "left:760px;top:285px;width:290px;height:290px;");

  // labels
  function label(txt, w) {
    return mk('<div class="ab" style="position:absolute;inset:0;background:' + MUST + ';clip-path:' + jag(w, 112, 14, 9, false, false).replace(/(\d+)px 0px/g, function (m, a) { return a + "px " + (R() * 8).toFixed(0) + "px"; }) + ';"></div><div class="ab" style="position:absolute;left:0;right:0;top:14px;text-align:center;font-size:72px;line-height:84px;color:' + INK + ';"><span class="sk">' + txt + '</span></div>', "left:48px;top:34px;width:" + w + "px;height:112px;", "paper");
  }
  var L1 = label("2019", 250), L2 = label("2021", 250), L3 = label("2023", 250), L4 = label("Today", 300);

  // sticky notes
  function sticky(txt, extra) {
    return mk('<div style="position:absolute;inset:0;background:#f7e9a8;"></div><div style="position:absolute;left:0;right:0;top:0;height:14px;background:rgba(240,200,80,.55)"></div><div class="ab" style="position:absolute;left:16px;right:16px;top:30px;font-size:36px;line-height:42px;color:' + INK + ';text-align:center;"><span class="sk">' + txt + '</span></div>', "left:470px;top:32px;width:300px;height:132px;", "paper");
  }
  var S1 = sticky("First oven"), S2 = sticky("Orders by message"), S3 = sticky('Ordering app live <span style="color:' + GREEN + '">&#10003;</span>');

  // name tag
  var nt = mk('<div style="position:absolute;inset:0;background:#fffefb;"></div><div style="position:absolute;left:100px;top:-14px;width:100px;height:30px;background:rgba(80,200,110,.85);transform:rotate(-4deg)"></div><div class="ab" style="position:absolute;left:0;right:0;top:20px;text-align:center;font-size:52px;line-height:60px;color:' + INK + ';"><span class="sk">Maya</span></div><div style="position:absolute;left:0;right:0;top:82px;text-align:center;font:700 26px Inter,sans-serif;color:#3a3732;">Head baker</div>', "left:925px;top:40px;width:300px;height:124px;", "paper");

  // captions
  function caption(txt) {
    var h = jag(1200, 96, 16, 9, true, true);
    return mk('<div style="position:absolute;inset:0;background:#fffefb;clip-path:' + h + ';"></div><div style="position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;justify-content:center;font:800 38px Inter,sans-serif;color:#1f1d1a;">' + txt + '</div>', "left:40px;top:590px;width:1200px;height:96px;", "paper");
  }
  var C1 = caption("Two friends open a tiny bakery."), C2 = caption("Too many orders, too many messages."), C3 = caption("So we built the fix."), C4 = caption("Still baking. Still hand made.");

  /* ---------- timeline ---------- */
  var tl = gsap.timeline({ paused: true });
  function hide(e, extra) { tl.set(e, Object.assign({ autoAlpha: 0 }, extra || {}), 0); }
  [L1, L2, L3, L4, S1, S2, S3, nt, nb, A, B, M, T, st1, st2, st3, stamp, C1, C2, C3, C4, shop].forEach(function (e) { hide(e); });
  scraps.forEach(function (s) { hide(s.el); });

  function slap(e, t, rot, o) { o = o || {};
    tl.fromTo(e, { autoAlpha: 0, scale: o.s || 1.55, y: o.y === undefined ? -60 : o.y, x: o.x || 0, rotation: rot + (o.dr === undefined ? 9 : o.dr) }, { autoAlpha: 1, scale: 1, y: 0, x: 0, rotation: rot, duration: o.d || .38, ease: "back.out(2.2)" }, t); }
  function slide(e, t, fx, fy, rot, d, ease) {
    tl.fromTo(e, { autoAlpha: 0, x: fx, y: fy, rotation: rot + (fx < 0 ? -8 : 8) }, { autoAlpha: 1, x: 0, y: 0, rotation: rot, duration: d || .55, ease: ease || "back.out(1.3)" }, t); }
  function out(e, t, tx, ty, rot, d) { tl.to(e, { x: tx, y: ty, rotation: "+=" + rot, autoAlpha: 0, duration: d || .4, ease: "power2.in" }, t); }
  function pop(e, t, rot, y0) {
    tl.fromTo(e, { autoAlpha: 0, y: y0 || 200, scale: .7, rotation: rot - 6, transformOrigin: "50% 100%" }, { autoAlpha: 1, y: 0, scale: 1, rotation: rot, duration: .55, ease: "back.out(2.4)" }, t); }
  function hop(e, t, rot) { tl.to(e, { y: -16, duration: .13, ease: "power2.out" }, t).to(e, { y: 0, duration: .2, ease: "bounce.out" }, t + .13); }

  // camera
  tl.set(cam, { scale: 1.045, transformOrigin: "50% 50%" }, 0);
  tl.fromTo(cam, { x: 12, y: 6, rotation: -.35 }, { x: -22, y: -10, rotation: .45, duration: 16, ease: "none" }, 0);
  // map pans
  tl.set(map, { x: 0, y: 0 }, 0);
  tl.to(map, { x: -55, y: -18, duration: 4, ease: "none" }, 0);
  tl.to(map, { x: -150, y: -34, duration: 1, ease: "power2.inOut" }, 3.9);
  tl.to(map, { x: -170, y: -26, duration: 3, ease: "none" }, 4.9);
  tl.to(map, { x: -260, y: 10, duration: 1, ease: "power2.inOut" }, 7.9);
  tl.to(map, { x: -285, y: 12, duration: 3, ease: "none" }, 8.9);
  tl.to(map, { x: -380, y: -20, duration: 1, ease: "power2.inOut" }, 11.9);
  tl.to(map, { x: -400, y: -22, duration: 3.1, ease: "none" }, 12.9);

  /* sec 1 : 0-4 */
  slide(L1, 0, -420, 0, -4, .5);
  pop(A, 0, -2, 160); pop(B, .2, 2, 160);
  slide(shop, .3, 460, 40, 2, .7);
  slap(S1, 1.0, -3);
  slide(C1, 1.5, 0, 160, 0, .55, "power3.out");
  hop(A, 2.2); hop(B, 2.45);
  out(L1, 3.7, -420, -20, -8, .4); out(S1, 3.7, 0, -220, -10, .4); out(shop, 3.7, 500, 40, 6, .45); out(C1, 3.75, -1300, 0, -2, .4);

  /* sec 2 : 4-8 */
  slide(L2, 4.0, -420, 0, -3, .6);
  pop(M, 4.35, 1.5, 160);
  slap(S2, 4.55, 2.5, { dr: -9 });
  slide(nt, 5.0, 0, -260, 3, .6);
  var scrapPos = [[640, 190, -12], [820, 170, 7], [990, 200, -6], [700, 290, 9], [880, 300, -10], [1010, 330, 5], [650, 400, 4], [780, 410, -8], [940, 420, 11], [860, 240, -3]];
  var starts = [[-260, 80], [1500, 100], [-240, 420], [1520, 300], [500, -160], [1500, 500], [-260, 560], [900, -180], [1480, 40], [300, -170]];
