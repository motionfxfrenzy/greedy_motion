<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Storybook raindrop journey</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f4e8cf; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #f4e8cf; }
  svg { position: absolute; inset: 0; }
  text { font-family: "Fredoka", "Quicksand", sans-serif; }
  .serif { font-family: "EB Garamond", "Newsreader", serif; font-style: italic; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
<svg id="s" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <filter id="rough" x="0" y="0" width="1280" height="720" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <filter id="grain" x="0" y="0" width="1280" height="720" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.33  0 0 0 0 0.18  0 0 0 0.16 0"/>
    </filter>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd8f5"/><stop offset="1" stop-color="#4aa3dd"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fc4e6"/><stop offset="1" stop-color="#3f8fc9"/></linearGradient>
    <clipPath id="rclip"><rect x="0" y="470" width="940" height="250"/></clipPath>
  </defs>
  <rect width="1280" height="720" fill="#f4e8cf"/>
  <g id="art" filter="url(#rough)">
    <!-- watercolour washes -->
    <ellipse cx="260" cy="130" rx="330" ry="150" fill="#cfe6f0" opacity=".55"/>
    <ellipse cx="760" cy="260" rx="260" ry="130" fill="#f6dcae" opacity=".6"/>
    <!-- hills -->
    <path d="M0 470 C120 380 260 400 380 450 L380 480 L0 480Z" fill="#a9c97d"/>
    <path d="M520 470 C660 400 800 410 940 440 L940 480 L520 480Z" fill="#bcd68c"/>
    <!-- trees -->
    <g id="trees">
      <rect x="92" y="400" width="10" height="46" fill="#8a5e3b"/><circle cx="97" cy="388" r="34" fill="#6fa55a"/>
      <rect x="196" y="418" width="9" height="34" fill="#8a5e3b"/><circle cx="200" cy="408" r="26" fill="#7db564"/>
      <rect x="720" y="408" width="9" height="40" fill="#8a5e3b"/><circle cx="724" cy="396" r="30" fill="#6fa55a"/>
    </g>
    <!-- river -->
    <g clip-path="url(#rclip)">
      <rect x="0" y="470" width="940" height="250" fill="url(#river)"/>
      <g id="waves" stroke="#e9f6fc" stroke-width="5" fill="none" stroke-linecap="round"></g>
    </g>
    <!-- cloud -->
    <g id="cloud" fill="#d9dfe8" stroke="#9aa7bb" stroke-width="4">
      <ellipse cx="300" cy="130" rx="150" ry="52"/><circle cx="215" cy="102" r="52"/><circle cx="305" cy="78" r="64"/><circle cx="395" cy="108" r="50"/>
    </g>
    <g id="cloudface" fill="none" stroke="#6b7a92" stroke-width="4" stroke-linecap="round">
      <path d="M262 150 q18 14 36 0" /><circle cx="274" cy="126" r="3" fill="#6b7a92"/><circle cx="324" cy="126" r="3" fill="#6b7a92"/>
    </g>
    <!-- ripples -->
    <ellipse id="rip1" cx="470" cy="520" rx="10" ry="4" fill="none" stroke="#f1fbff" stroke-width="5" opacity="0"/>
    <ellipse id="rip2" cx="470" cy="520" rx="10" ry="4" fill="none" stroke="#f1fbff" stroke-width="5" opacity="0"/>
    <!-- the raindrop -->
    <g id="dropPos">
      <g id="dropSq">
        <path d="M0 -50 C14 -24 38 -8 38 16 A38 38 0 0 1 -38 16 C-38 -8 -14 -24 0 -50Z" fill="url(#drop)" stroke="#2c6fa5" stroke-width="4" stroke-linejoin="round"/>
        <ellipse cx="-14" cy="6" rx="6" ry="12" fill="#fff" opacity=".55" transform="rotate(20 -14 6)"/>
        <g id="eyes">
          <ellipse cx="-13" cy="12" rx="9" ry="11" fill="#fff" stroke="#23405c" stroke-width="2.5"/><ellipse cx="13" cy="12" rx="9" ry="11" fill="#fff" stroke="#23405c" stroke-width="2.5"/>
          <circle id="pl" cx="-11" cy="14" r="5" fill="#23405c"/><circle id="pr" cx="15" cy="14" r="5" fill="#23405c"/>
        </g>
        <path id="mouth" d="M-12 34 q12 12 24 0" fill="#ffb3b3" stroke="#23405c" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-27" cy="30" r="5" fill="#ff9aa8" opacity=".7"/><circle cx="27" cy="30" r="5" fill="#ff9aa8" opacity=".7"/>
      </g>
    </g>
    <!-- speed lines -->
    <g id="speed" stroke="#8fb9d6" stroke-width="5" stroke-linecap="round" opacity="0">
      <line x1="380" y1="170" x2="380" y2="215"/><line x1="450" y1="150" x2="450" y2="210"/><line x1="520" y1="175" x2="520" y2="220"/>
    </g>
  </g>
  <!-- onomatopoeia -->
  <text id="wheee" x="560" y="250" font-size="64" font-weight="700" fill="#e0603a" stroke="#fff6e2" stroke-width="8" paint-order="stroke" transform="rotate(-8 560 250)" opacity="0">WHEEE!</text>
  <text id="plip" x="350" y="440" font-size="76" font-weight="700" fill="#2c6fa5" stroke="#fff6e2" stroke-width="9" paint-order="stroke" transform="rotate(-6 350 440)" opacity="0">PLIP!</text>
  <!-- chapter label -->
  <g id="chap1"><text x="40" y="52" font-size="30" font-weight="600" fill="#6b4f2c" opacity=".85">CHAPTER 1</text><text class="serif" x="40" y="96" font-size="44" fill="#3e2c14">Up in the cloud</text></g>
  <g id="chap2" opacity="0"><text x="40" y="52" font-size="30" font-weight="600" fill="#6b4f2c" opacity=".85">CHAPTER 2</text><text class="serif" x="40" y="96" font-size="44" fill="#3e2c14">Down the river</text></g>
  <!-- fact -->
  <g id="fact" opacity="0">
    <rect x="40" y="610" width="860" height="78" rx="18" fill="#fff8e8" stroke="#c9ad7a" stroke-width="3"/>
    <text id="factTxt" class="serif" x="68" y="660" font-size="38" fill="#3e2c14">Rain falls when cloud droplets grow heavy.</text>
  </g>
  <g id="fact2" opacity="0">
    <rect x="40" y="610" width="860" height="78" rx="18" fill="#fff8e8" stroke="#c9ad7a" stroke-width="3"/>
    <text class="serif" x="68" y="660" font-size="38" fill="#3e2c14">Rivers carry it on, all the way to the sea.</text>
  </g>
  <!-- side timeline -->
  <g>
    <rect x="960" y="30" width="290" height="660" rx="22" fill="#fff8e8" stroke="#c9ad7a" stroke-width="3"/>
    <text x="1105" y="86" font-size="30" font-weight="600" fill="#6b4f2c" text-anchor="middle">THE JOURNEY</text>
    <line x1="1010" y1="150" x2="1010" y2="610" stroke="#c9ad7a" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/>
    <g font-size="44" font-weight="600" fill="#3e2c14">
      <circle cx="1010" cy="180" r="14" fill="#e8d3a6" stroke="#8a6a35" stroke-width="3"/><text x="1050" y="194">Cloud</text>
      <circle cx="1010" cy="380" r="14" fill="#e8d3a6" stroke="#8a6a35" stroke-width="3"/><text x="1050" y="394">River</text>
      <circle cx="1010" cy="580" r="14" fill="#e8d3a6" stroke="#8a6a35" stroke-width="3"/><text x="1050" y="594">Sea</text>
    </g>
    <g id="mini">
      <path d="M0 -26 C8 -12 20 -4 20 8 A20 20 0 0 1 -20 8 C-20 -4 -8 -12 0 -26Z" fill="url(#drop)" stroke="#2c6fa5" stroke-width="3"/>
      <circle cx="-6" cy="6" r="3" fill="#23405c"/><circle cx="7" cy="6" r="3" fill="#23405c"/>
    </g>
  </g>
  <rect width="1280" height="720" filter="url(#grain)"/>
</svg>
</div>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var waves = document.getElementById("waves");
  // wave tiles, 120 px period, wider than the river so a slow slide never shows an edge
  [520, 580, 640, 690].forEach(function (y, row) {
    for (var x = -240; x < 1100; x += 120) {
      var p = document.createElementNS(NS, "path");
      var ox = x + row * 47;
      p.setAttribute("d", "M" + ox + " " + y + " q15 -14 30 0 t30 0");
      waves.appendChild(p);
    }
  });
  var tl = gsap.timeline({ paused: true });
  gsap.set("#dropPos", { x: 300, y: 140 });
  gsap.set("#dropSq", { scaleX: 0.2, scaleY: 0.2 });
  gsap.set("#mini", { x: 1010, y: 180 });
  gsap.set(["#rip1", "#rip2"], { transformOrigin: "50% 50%" });
  // 0 - 0.5: the drop pops out of the cloud, wide-eyed
  tl.to("#dropSq", { scaleX: 1, scaleY: 1, duration: 0.45, ease: "back.out(2.4)" }, 0);
  tl.to("#dropPos", { y: 175, duration: 0.45, ease: "power2.out" }, 0);
  tl.to("#cloud", { y: 4, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.1);
  // the fact card
  tl.to("#fact", { opacity: 1, duration: 0.3 }, 0.5);
  // 0.5 - 1.9: the fall, with a wobble and speed lines
  tl.to("#dropPos", { y: 500, x: 470, duration: 1.3, ease: "power2.in" }, 0.6);
  tl.to("#dropPos", { rotation: -14, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0.6);
  tl.to("#dropSq", { scaleX: 0.86, scaleY: 1.2, duration: 0.7, ease: "sine.in" }, 0.9);
  tl.to("#speed", { opacity: 1, y: 40, duration: 0.5, ease: "none" }, 0.9);
  tl.to("#speed", { opacity: 0, duration: 0.2 }, 1.7);
  tl.to("#wheee", { opacity: 1, duration: 0.15 }, 0.95);
  tl.fromTo("#wheee", { scale: 0.6, transformOrigin: "560px 250px" }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.95);
  tl.to("#wheee", { opacity: 0, duration: 0.2 }, 1.75);
  tl.to("#pl", { y: -3, duration: 0.5 }, 0.6); tl.to("#pr", { y: -3, duration: 0.5 }, 0.6);
  tl.to("#mouth", { scaleY: 1.6, transformOrigin: "0px 34px", duration: 0.4 }, 0.9);
  tl.to("#mini", { y: 380, x: 1010, duration: 1.2, ease: "power2.inOut" }, 0.7);
  // 1.9: impact. squash, splash, PLIP!, ripples
  tl.to("#dropSq", { scaleX: 1.45, scaleY: 0.6, duration: 0.1, ease: "power2.out" }, 1.9);
  tl.to("#dropPos", { rotation: 0, y: 512, duration: 0.1 }, 1.9);
  tl.to("#dropSq", { scaleX: 1, scaleY: 1, duration: 0.45, ease: "elastic.out(1,0.4)" }, 2.0);
  tl.to("#dropPos", { y: 500, duration: 0.35, ease: "power2.out" }, 2.0);
  tl.to("#plip", { opacity: 1, duration: 0.1 }, 1.95);
  tl.fromTo("#plip", { scale: 0.5, transformOrigin: "350px 440px" }, { scale: 1.08, duration: 0.3, ease: "back.out(3)" }, 1.95);
  tl.to("#plip", { opacity: 0, duration: 0.25 }, 2.7);
  [["#rip1", 1.95], ["#rip2", 2.15]].forEach(function (r) {
    tl.fromTo(r[0], { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 7, duration: 0.9, ease: "power1.out" }, r[1]);
  });
  tl.to("#chap1", { opacity: 0, duration: 0.2 }, 1.9);
  tl.to("#chap2", { opacity: 1, duration: 0.3 }, 2.1);
  tl.to("#fact", { opacity: 0, duration: 0.2 }, 2.4);
  // 2.1 - 5: float down the river, bobbing, while the waves slide past
  tl.to("#dropPos", { x: 760, duration: 2.9, ease: "sine.inOut" }, 2.1);
  tl.to("#dropPos", { y: 488, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 5 }, 2.1);
  tl.to("#dropPos", { rotation: 7, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.1);
  tl.to("#waves", { x: -120, duration: 5, ease: "none" }, 0);
  tl.to("#mouth", { scaleY: 1, duration: 0.3 }, 2.0);
  tl.to("#eyes", { scaleY: 0.1, transformOrigin: "0px 12px", duration: 0.08, yoyo: true, repeat: 1 }, 1.3);
  tl.to("#eyes", { scaleY: 0.1, transformOrigin: "0px 12px", duration: 0.08, yoyo: true, repeat: 1 }, 3.4);
  tl.to("#mini", { y: 580, duration: 1.6, ease: "power2.inOut" }, 3.0);
  // closing line holds the last second
  tl.to("#fact2", { opacity: 1, duration: 0.3 }, 3.5);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
