<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Paper-cut assembly</title>
<script src="vendor/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: #0b0d12; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #10163f; }
  #c { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
<canvas id="c" class="clip" width="1280" height="720" data-start="0" data-duration="5" data-track-index="0"></canvas>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const W = 1280, H = 720;
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");

  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = mulberry32(20240611);
  const R = (a, b) => a + (b - a) * rnd();
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, f) => { const A = hex(a), B = hex(b); return A.map((v, i) => v + (B[i] - v) * f); };
  const css = (rgb, k) => { k = k || 1; const c = rgb.map(v => Math.max(0, Math.min(255, Math.round(v * k)))); return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; };
  const tone = (a, b, f, j) => css(mix(a, b, Math.max(0, Math.min(1, f))), 1 + R(-(j || .06), (j || .06)));
  const cen = pts => { let x = 0, y = 0; pts.forEach(p => { x += p[0]; y += p[1]; }); return [x / pts.length, y / pts.length]; };
  const scaleAbout = (pts, k) => { const c = cen(pts); return pts.map(p => [c[0] + (p[0] - c[0]) * k, c[1] + (p[1] - c[1]) * k]); };

  function rough(pts, step, amp) {
    const out = [], n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
      const m = Math.max(1, Math.round(len / step)), nx = -dy / len, ny = dx / len;
      for (let j = 0; j < m; j++) {
        const f = j / m; let o = (rnd() * 2 - 1) * (j === 0 ? amp * .6 : amp);
        if (rnd() < .06) o *= 2.2;
        out.push([a[0] + dx * f + nx * o, a[1] + dy * f + ny * o]);
      }
    }
    return out;
  }
  const mkPath = a => { const p = new Path2D(); a.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); p.closePath(); return p; };
  const EDGE = ["#ece3cd", "#d9d4c9", "#f3ecd8", "#e2d8c0"];
  const pieces = [];

  function add(pts, fill, o) {
    o = o || {};
    const c = cen(pts);
    const body = rough(pts, o.step || 16, o.amp || 1.3);
    let edge = null;
    if (o.edge !== false) {
      const e2 = rough(pts, 12, 1.2);
      edge = e2.map(p => { const dx = p[0] - c[0], dy = p[1] - c[1], l = Math.hypot(dx, dy) || 1; const d = Math.max(0, R(-1.4, 3.4)) * (o.sliver == null ? .5 : o.sliver); return [p[0] + dx / l * d, p[1] + dy / l * d]; });
    }
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    body.forEach(p => { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); });
    let from = o.from || "near", d;
    if (from === "near") {
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      const ds = [[cx, [-1, 0]], [W - cx, [1, 0]], [cy, [0, -1]], [H - cy, [0, 1]]].sort((a, b) => a[0] - b[0]);
      d = ds[0][1].slice();
    } else if (from === "top") d = [0, -1]; else if (from === "bottom") d = [0, 1]; else if (from === "left") d = [-1, 0]; else d = [1, 0];
    d[0] += R(-.3, .3); d[1] += R(-.3, .3);
    const dl = Math.hypot(d[0], d[1]); d = [d[0] / dl, d[1] / dl];
    const kx = d[0] > .001 ? (W - minX) / d[0] : d[0] < -.001 ? maxX / -d[0] : 1e9;
    const ky = d[1] > .001 ? (H - minY) / d[1] : d[1] < -.001 ? maxY / -d[1] : 1e9;
    const k = Math.max(40, Math.min(kx, ky)) + 30;
    pieces.push({
      body: mkPath(body), edge: edge ? mkPath(edge) : null, fill, edgeCol: EDGE[(rnd() * 4) | 0],
      c, sh: o.sh || [3, 4], sa: o.sa == null ? .5 : o.sa, t0: o.t0, dur: o.dur || .55,
      vx: d[0] * k, vy: d[1] * k, rot0: R(-.12, .12)
    });
  }

  // ---------------- sky mosaic ----------------
  const skyStops = [[0, "#090e33"], [300, "#18235f"], [520, "#2a4285"], [700, "#386098"]];
  function skyCol(y) {
    for (let i = 1; i < skyStops.length; i++) if (y <= skyStops[i][0]) { const a = skyStops[i - 1], b = skyStops[i]; return mix(a[1], b[1], (y - a[0]) / (b[0] - a[0])); }
    return hex(skyStops[skyStops.length - 1][1]);
  }
  {
    const C = 17, Rr = 9, gx = [], gy = [];
    for (let r = 0; r <= Rr; r++) { gx.push([]); for (let i = 0; i <= C; i++) {
      const edgeX = i === 0 || i === C, edgeY = r === 0 || r === Rr;
      let x = -20 + i * (W + 40) / C + (edgeX ? 0 : R(-24, 24));
      let y = -20 + r * (H + 40) / Rr + (edgeY ? 0 : R(-22, 22));
      gx[r].push([x, y]);
    } }
    for (let r = 0; r < Rr; r++) for (let i = 0; i < C; i++) {
      const a = gx[r][i], b = gx[r][i + 1], c2 = gx[r + 1][i + 1], d2 = gx[r + 1][i];
      const tris = rnd() < .5 ? [[a, b, c2], [a, c2, d2]] : [[a, b, d2], [b, c2, d2]];
      tris.forEach(t => {
        const cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
        const rgb = skyCol(cy);
        const early = rnd() < .8;
        add(scaleAbout(t, 1.1), css(rgb, 1 + R(-.1, .14)), { t0: early ? -1 : R(0, .12), dur: .3, sliver: .12, from: ["top", "left", "right"][(rnd() * 3) | 0], sh: [1.5, 2], sa: .28, step: 30, amp: 1.6 });
      });
    }
  }

  // ---------------- stars and moon ----------------
  for (let i = 0; i < 38; i++) {
    const x = R(30, 1250), y = R(24, 330);
    if (Math.hypot(x - 1010, y - 150) < 105) continue;
    const s = R(4, 11);
    add([[x, y - s * 1.3], [x + s * .5, y], [x, y + s * 1.3], [x - s * .5, y]], i % 3 ? "#f6edc8" : "#cfdcff", { t0: R(.3, .8), dur: .45, from: "top", sh: [1, 1.5], sa: .3, edge: false, step: 30, amp: .3 });
  }
  const disc = (cx, cy, r, n) => { const a = []; for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2; a.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r]); } return a; };
  add(disc(1010, 150, 92, 30), "#6b77b8", { t0: .35, dur: .6, from: "top", sh: [3, 4], sa: .3, step: 20 });
  add(disc(1010, 150, 60, 26), "#f4eacb", { t0: .45, dur: .6, from: "top", sh: [3, 4], step: 18 });
  add([[985, 128], [1003, 122], [1012, 138], [996, 148]], "#dccfa8", { t0: .55, dur: .5, from: "top", sh: [1, 2], edge: false });
  add([[1022, 165], [1038, 160], [1042, 176], [1026, 182]], "#d8cba4", { t0: .6, dur: .5, from: "top", sh: [1, 2], edge: false });
  add([[1000, 172], [1010, 170], [1012, 180], [1002, 183]], "#dccfa8", { t0: .62, dur: .5, from: "top", sh: [1, 1], edge: false });

  // ---------------- mountains ----------------
  function mountain(px, py, hw, baseY, lit, dark, snowL, snowR, t0) {
    const n = 5, bx = [];
    for (let i = 0; i <= n; i++) bx.push([px - hw + 2 * hw * i / n + (i > 0 && i < n ? R(-hw * .07, hw * .07) : 0), baseY]);
    const P = [px, py];
    const mid = bx.map(b => [b[0] + (P[0] - b[0]) * .5 + R(-10, 10), b[1] + (P[1] - b[1]) * .5 + R(-10, 10)]);
    for (let i = 0; i < n; i++) {
      const f = i / (n - 1) + R(-.2, .2);
      const stag = t0 + R(0, .35);
      add(scaleAbout([P, mid[i], mid[i + 1]], 1.06), tone(lit, dark, f - .1, .05), { t0: stag, from: "top", sh: [3, 4], sa: .4, step: 22 });
      add(scaleAbout([mid[i], bx[i], bx[i + 1]], 1.06), tone(lit, dark, f + .08, .05), { t0: stag + .05, from: "bottom", sh: [3, 4], sa: .4, step: 22 });
      add(scaleAbout([mid[i], bx[i + 1], mid[i + 1]], 1.06), tone(lit, dark, f + .02, .05), { t0: stag + .08, from: "bottom", sh: [3, 4], sa: .4, step: 22 });
    }
    const lq = [P[0] + (bx[0][0] - P[0]) * .3, P[1] + (baseY - P[1]) * .3];
    const rq = [P[0] + (bx[n][0] - P[0]) * .3, P[1] + (baseY - P[1]) * .3];
    const h = baseY - P[1];
    const zig = [[P[0] - hw * .12, P[1] + h * .16], [P[0] - hw * .03, P[1] + h * .3], [P[0] + hw * .06, P[1] + h * .18], [P[0] + hw * .15, P[1] + h * .31]];
    add([P, lq, zig[0], zig[1], [P[0], P[1] + h * .22]], snowL, { t0: t0 + .35, from: "top", sh: [2, 3], sa: .35 });
    add([P, [P[0], P[1] + h * .22], zig[2], zig[3], rq], snowR, { t0: t0 + .38, from: "top", sh: [2, 3], sa: .35 });
  }
  [[110, 330, 200], [340, 250, 210], [580, 350, 190], [830, 240, 230], [1060, 320, 220], [1250, 260, 190]].forEach(m =>
    mountain(m[0], m[1], m[2], 610, "#6b62a8", "#3c3478", "#e4e8f8", "#b4bce0", .3));
  [[40, 440, 200], [280, 400, 190], [520, 450, 170], [780, 410, 200], [1010, 440, 190], [1230, 390, 200]].forEach(m =>
    mountain(m[0], m[1], m[2], 620, "#34468f", "#1a2358", "#cdd7f1", "#98a6d2", .85));

  // ---------------- snowy ground ----------------
  const ridge = x => 566 + 16 * Math.sin(x / 170 + 1) + 8 * Math.sin(x / 53);
  {
    const xs = []; for (let x = -60; x <= 1340; x += 100) xs.push(x + (x > 0 && x < 1280 ? R(-18, 18) : 0));
    const rows = [xs.map(x => [x, ridge(x) + R(-4, 4)]), xs.map(x => [x, 640 + R(-14, 14)]), xs.map(x => [x, 780])];
    for (let r = 0; r < 2; r++) for (let i = 0; i < xs.length - 1; i++) {
      const a = rows[r][i], b = rows[r][i + 1], c2 = rows[r + 1][i + 1], d2 = rows[r + 1][i];
      const tris = rnd() < .5 ? [[a, b, c2], [a, c2, d2]] : [[a, b, d2], [b, c2, d2]];
      tris.forEach(t => {
        const lit = r === 0 ? ["#a3b5e0", "#7a8fc6"] : ["#6d82bb", "#4d5f9d"];
        add(scaleAbout(t, 1.07), tone(lit[0], lit[1], rnd(), .05), { t0: 1.25 + i * .02 + r * .12 + R(0, .2), from: ["left", "right", "bottom"][(rnd() * 3) | 0], sh: [4, 5], sa: .38, step: 24 });
      });
    }
  }

  // ---------------- trees ----------------
  function pine(x, by, h, lit, dark, t0) {
    const w = h * .52, tw = w * .07;
    const side = x < 640 ? "left" : "right";
    add([[x - tw, by], [x + tw, by], [x + tw, by - h * .16], [x - tw, by - h * .16]], "#5a3a26", { t0, from: "bottom", sh: [3, 4], sa: .4 });
    let baseY = by - h * .1;
    for (let i = 0; i < 4; i++) {
      const hw = w * .5 * (1 - i * .2), th = h * .28, tt = t0 + i * .1;
      const ap = [x + R(-2, 2), baseY - th];
      const bl = [x - hw, baseY], br = [x + hw, baseY], bm = [x + R(-hw * .1, hw * .1), baseY + R(-2, 7)];
      add([ap, bl, bm], tone(lit, dark, .1, .06), { t0: tt, from: i % 2 ? "bottom" : side, sh: [4, 5], sa: .45 });
      add([ap, bm, br], tone(lit, dark, .85, .06), { t0: tt + .03, from: i % 2 ? side : "bottom", sh: [4, 5], sa: .45 });
      add([ap, [ap[0] - hw * .5, ap[1] + th * .42], [ap[0] - hw * .2, ap[1] + th * .33], [ap[0] + hw * .08, ap[1] + th * .46], [ap[0] + hw * .5, ap[1] + th * .4]], "#d9e3f5", { t0: tt + .06, from: "top", sh: [2, 3], sa: .35 });
      baseY = ap[1] + th * .3;
    }
  }
  [[300, 618, 118, 1.7], [858, 614, 126, 1.78], [1046, 600, 130, 1.82]].forEach(t => pine(t[0], t[1], t[2], "#1f5d72", "#14384f", t[3]));
  [[60, 668, 230, 1.95], [150, 650, 178, 2.1], [236, 640, 142, 2.25], [915, 650, 196, 2.05], [1000, 668, 238, 2.2], [1100, 640, 184, 2.35], [1196, 662, 218, 2.45]].forEach(t => pine(t[0], t[1], t[2], "#23735f", "#134a46", t[3]));

  // ---------------- cabin ----------------
  const X0 = 520, X1 = 790, BASE = 612;
  for (let r = 0; r < 7; r++) {
    const y1 = BASE - r * 22, y0 = y1 - 22; let x = X0, k = 0;
    while (x < X1 - 4) {
      const w = Math.min(X1 - x, R(70, 125)); const b = x + w > X1 - 40 ? X1 : x + w;
      add([[x - 1, y0], [b + 1, y0], [b + 1, y1], [x - 1, y1]], css(mix("#b06f42", "#6a4025", R(0, 1)), R(.92, 1.06)), { t0: 2.6 + r * .045 + k * .02, from: r % 2 ? "left" : "right", sh: [3, 4], sa: .5, step: 20, amp: 1 });
      x = b; k++;
    }
  }
  add([[733, 430], [777, 430], [777, 372], [733, 372]], "#85879f", { t0: 3.0, from: "top", sh: [3, 4] });
  add([[755, 430], [777, 430], [777, 372], [755, 372]], "#6c6e8c", { t0: 3.04, from: "top", sh: [3, 4] });
  add([[728, 376], [783, 376], [780, 364], [756, 368], [731, 364]], "#e1e8f7", { t0: 3.1, from: "top", sh: [2, 3] });
  for (let k = 0; k < 5; k++) {
    const yb = 464 - k * 24, yt = yb - 26;
    const hb = 165 * (yb - 358) / 106, ht = 165 * Math.max(0, yt - 358) / 106;
    const u = [0, R(.28, .4), R(.6, .72), 1];
    for (let s = 0; s < 3; s++) {
      const pb = f => 655 - hb + 2 * hb * f, pt = f => 655 - ht + 2 * ht * f;
      const poly = [[pb(u[s]), yb], [pb(u[s + 1]), yb], [pt(u[s + 1]), yt], [pt(u[s]), yt]];
      const mid = (u[s] + u[s + 1]) / 2;
      add(scaleAbout(poly, 1.04), tone("#b8483f", "#7e2b35", mid, .05), { t0: 3.0 + k * .05 + s * .02, from: ["top", "left", "right"][(s + k) % 3], sh: [4, 5], sa: .5, step: 20 });
    }
  }
  add([[655, 358], [625, 380], [643, 388], [661, 378], [684, 391], [686, 380]], "#e2e9f8", { t0: 3.3, from: "top", sh: [3, 4] });
  [[498, 458, 40], [548, 462, 34], [722, 460, 44], [782, 456, 38]].forEach((l, i) =>
    add([[l[0], l[1]], [l[0] + l[2], l[1] - 3], [l[0] + l[2] - 4, l[1] + 9], [l[0] + 3, l[1] + 10]], "#dde6f6", { t0: 3.28 + i * .03, from: "top", sh: [2, 3] }));
  add([[690, 545], [752, 545], [752, 612], [690, 612]], "#4a2b1d", { t0: 3.35, from: "left", sh: [3, 4] });
  add([[690, 545], [724, 545], [724, 612], [690, 612]], "#5f3a25", { t0: 3.4, from: "left", sh: [2, 3], sa: .35 });
  add([[740, 580], [747, 580], [747, 588], [740, 588]], "#e8b94f", { t0: 3.5, from: "right", sh: [1, 1.5], edge: false });
  add([[683, 612], [760, 612], [758, 622], [685, 622]], "#9ea2bf", { t0: 3.42, from: "bottom", sh: [2, 3] });
  add([[553, 480], [637, 480], [637, 552], [553, 552]], "#3b2418", { t0: 3.4, from: "left", sh: [3, 4] });
  [[560, 487, 593, 514, "#ffd56a"], [597, 487, 630, 514, "#ffc95a"], [560, 518, 593, 545, "#ffe08a"], [597, 518, 630, 545, "#ffcf63"]].forEach((p, i) =>
    add([[p[0], p[1]], [p[2], p[1]], [p[2], p[3]], [p[0], p[3]]], p[4], { t0: 3.5 + i * .03, from: "top", sh: [1, 1.5], sa: .3, edge: false, step: 30, amp: .6 }));
  add([[547, 552], [643, 552], [641, 560], [549, 560]], "#e0e8f6", { t0: 3.55, from: "left", sh: [2, 3] });

  // ---------------- foreground drifts ----------------
  for (let i = 0; i < 10; i++) {
    const x = i * 140 - 40;
    add(scaleAbout([[x, 760], [x + R(50, 90), R(676, 704)], [x + 190, 760]], 1.05), tone("#c3d0ee", "#8b9dd0", rnd(), .04), { t0: 3.45 + i * .035, from: "bottom", sh: [5, 6], sa: .4, step: 24 });
  }

  // ---------------- hero with lantern ----------------
  {
    const T = 3.7; let n = 0;
    const hp = (pts, fill, o) => { pts = pts.map(p => [397 + (p[0] - 397) * 1.3, 653 + (p[1] - 653) * 1.3]); add(pts, fill, Object.assign({ t0: T + (n++) * .018, dur: .55, from: "left", sh: [4, 5], sa: .5, step: 12, amp: .8, sliver: .5 }, o || {})); };
    hp([[383, 640], [395, 640], [396, 653], [380, 653]], "#2f2424");
    hp([[399, 640], [411, 640], [414, 653], [398, 653]], "#2f2424");
    hp([[384, 612], [395, 612], [395, 642], [384, 642]], "#2c386a");
    hp([[399, 612], [410, 612], [410, 642], [399, 642]], "#232d58");
    hp([[377, 562], [397, 562], [393, 628], [370, 628]], "#f28a4a");
    hp([[397, 562], [418, 562], [425, 628], [393, 628]], "#d9672f");
    hp([[378, 552], [417, 552], [419, 567], [376, 567]], "#33b3a6");
    hp([[412, 569], [424, 573], [438, 598], [430, 604], [416, 587]], "#cc5f2c");
    hp(disc(397, 538, 15, 10), "#f3c7a0");
    hp([[380, 538], [397, 508], [397, 541], [388, 546]], "#f6cb57");
    hp([[397, 508], [414, 538], [406, 546], [397, 541]], "#dba63a");
    hp(disc(397, 507, 6, 7), "#fdf3d2", { edge: false });
    hp([[395, 538], [399, 538], [399, 542], [395, 542]], "#3a2a2a", { edge: false });
    hp(disc(434, 603, 5, 6), "#f3c7a0", { edge: false });
    hp([[433, 604], [435, 604], [447, 616], [445, 618]], "#2f2424", { edge: false });
    hp([[437, 608], [453, 608], [452, 612], [438, 612]], "#3a2a2a");
    hp([[438, 612], [452, 612], [451, 632], [439, 632]], "#ffe08a", { sh: [1, 2], sa: .25 });
    hp([[437, 632], [453, 632], [451, 637], [439, 637]], "#3a2a2a");
  }

  // ---------------- grain + fibres ----------------
  const grain = document.createElement("canvas"); grain.width = grain.height = 256;
  {
    const g = grain.getContext("2d"), id = g.createImageData(256, 256);
    for (let i = 0; i < 256 * 256; i++) { const v = 128 + (rnd() * 2 - 1) * 70 + (rnd() < .02 ? 40 : 0); id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
    g.putImageData(id, 0, 0);
  }
  const fibre = document.createElement("canvas"); fibre.width = fibre.height = 320;
  {
    const g = fibre.getContext("2d");
    for (let i = 0; i < 900; i++) {
      const x = R(0, 320), y = R(0, 320), a = R(-.5, .5), l = R(3, 11);
      g.strokeStyle = rnd() < .5 ? "rgba(255,248,230,.07)" : "rgba(10,12,40,.14)"; g.lineWidth = R(.5, 1.1);

    }
  }
  const grainPat = ctx.createPattern(grain, "repeat"), fibrePat = ctx.createPattern(fibre, "repeat");
  const sm = (a, b, t) => { const x = Math.max(0, Math.min(1, (t - a) / (b - a))); return x * x * (3 - 2 * x); };

  function glow(x, y, r, a, g1, g2) {
    if (a <= 0) return;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, "rgba(" + g1 + "," + (.55 * a) + ")"); gr.addColorStop(.45, "rgba(" + g2 + "," + (.18 * a) + ")"); gr.addColorStop(1, "rgba(" + g2 + ",0)");
    ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    ctx.fillStyle = "#10163f"; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < pieces.length; i++) {
      const p = pieces[i];
      if (t <= p.t0) continue;
      const q = Math.min(1, (t - p.t0) / p.dur), e = 1 - Math.pow(1 - q, 3);
      const ox = p.vx * (1 - e), oy = p.vy * (1 - e), rr = p.rot0 * (1 - e), lift = 1 + (1 - e) * 2.4;
      ctx.save();
      ctx.translate(ox + p.sh[0] * lift, oy + p.sh[1] * lift); ctx.translate(p.c[0], p.c[1]); ctx.rotate(rr); ctx.translate(-p.c[0], -p.c[1]);
      ctx.fillStyle = "rgba(4,6,26," + (p.sa * (.6 + .4 * e)) + ")"; ctx.fill(p.body);
      ctx.restore();
      ctx.save();
      ctx.translate(ox, oy); ctx.translate(p.c[0], p.c[1]); ctx.rotate(rr); ctx.translate(-p.c[0], -p.c[1]);
      if (p.edge) { ctx.fillStyle = p.edgeCol; ctx.fill(p.edge); }
      ctx.fillStyle = p.fill; ctx.fill(p.body);
      ctx.restore();
    }
    // light: moon halo, window, lantern
    ctx.globalCompositeOperation = "lighter";
    glow(1010, 150, 230, sm(.8, 1.2, t) * .55, "200,210,255", "140,160,230");
    const wa = sm(3.75, 4.1, t);
    if (wa > 0) {
      glow(595, 516, 190, wa, "255,200,100", "255,160,70");
      ctx.fillStyle = "rgba(255,196,96," + (.2 * wa) + ")";
      ctx.beginPath(); ctx.moveTo(555, 614); ctx.lineTo(642, 614); ctx.lineTo(720, 668); ctx.lineTo(480, 668); ctx.closePath(); ctx.fill();
    }
    const la = sm(4.1, 4.45, t);
    if (la > 0) {
      glow(459, 610, 170, la, "255,210,120", "255,170,80");
      ctx.fillStyle = "rgba(255,200,110," + (.18 * la) + ")";
      ctx.beginPath(); ctx.ellipse(440, 660, 130, 24, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    // vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 780);
    vg.addColorStop(0, "rgba(5,7,25,0)"); vg.addColorStop(1, "rgba(5,7,25,.5)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    // paper grain
    ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = .4; ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.fillStyle = fibrePat; ctx.fillRect(0, 0, W, H);
  }

  const state = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(state, { t: 5, duration: 5, ease: "none", onUpdate: () => draw(state.t) }, 0);
  window.__timelines["main"] = tl;
  window.addEventListener("hf-seek", e => draw(e.detail.time));
  draw(0);
</script>
