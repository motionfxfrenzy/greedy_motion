<!doctype html>

<script>
(function () {
var CFG = { paper: "#fff3d6", ink: "#2d2a4a", font: "Fredoka, Quicksand, sans-serif", rough: [0.04, 3], seed: 31, bg: function () {

});

// agent sparkle

var spp = el("path", { d: "M" + spk.map(function (p) { return p.join(" "); }).join("L") + "Z", fill: VIO, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, sp);
