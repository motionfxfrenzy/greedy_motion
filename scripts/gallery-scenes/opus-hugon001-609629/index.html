<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=720, height=1280">
<title>Mentis lancement</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 720px; height: 1280px; overflow: hidden; background: #2e0716; }
  #root { position: relative; width: 720px; height: 1280px; overflow: hidden; background: #2e0716; }
  svg { position: absolute; inset: 0; }
  text { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
  .serif { font-family: "Instrument Serif", "Playfair Display", Georgia, serif; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="720" data-height="1280" data-fps="30">
<svg id="s" width="720" height="1280" viewBox="0 0 720 1280"></svg>
</div>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg", s = document.getElementById("s");
  function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); (p || s).appendChild(e); return e; }
  function T(str, x, y, size, w, fill, p, anchor, cls) {
    var t = el("text", { x: x, y: y, "font-size": size, "font-weight": w, fill: fill, "text-anchor": anchor || "start" }, p);
    if (cls) t.setAttribute("class", cls);
    t.textContent = str; return t;
  }
  var CREAM = "#f8ecd8", GOLD = "#f4b98a", WINE = "#4a0e24", INK = "#3b0a1d";
  var NB = " ";
  function fmt(v) { return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, NB); }
  var tl = gsap.timeline({ paused: true });

  // ---------- background ----------
  var defs = el("defs", {});
  var bg = el("radialGradient", { id: "bg", cx: 360, cy: 640, r: 900, gradientUnits: "userSpaceOnUse" }, defs);
  el("stop", { offset: 0, "stop-color": "#7a1a3a" }, bg); el("stop", { offset: 1, "stop-color": "#2a0614" }, bg);
  var rg = el("radialGradient", { id: "rays", cx: 360, cy: 640, r: 820, gradientUnits: "userSpaceOnUse" }, defs);
  el("stop", { offset: 0, "stop-color": "#ffd9b0", "stop-opacity": .34 }, rg);
  el("stop", { offset: 1, "stop-color": "#ffd9b0", "stop-opacity": 0 }, rg);
  el("rect", { width: 720, height: 1280, fill: "url(#bg)" });
  var burstPulse = el("g", {}), burst = el("g", {}, burstPulse);
  for (var i = 0; i < 24; i++) {
    var a0 = i * 15 * Math.PI / 180, a1 = (i * 15 + 7.5) * Math.PI / 180, R = 1500;
    el("path", { d: "M360 640 L" + (360 + R * Math.cos(a0)).toFixed(1) + " " + (640 + R * Math.sin(a0)).toFixed(1) + " L" + (360 + R * Math.cos(a1)).toFixed(1) + " " + (640 + R * Math.sin(a1)).toFixed(1) + " Z", fill: "url(#rays)" }, burst);
  }
  tl.fromTo(burst, { rotation: -6 }, { rotation: 22, duration: 5, ease: "none", svgOrigin: "360 640" }, 0);
  [0.05, 1.6, 3.2].forEach(function (t) {
    tl.fromTo(burstPulse, { scale: 1.09 }, { scale: 1, duration: .5, ease: "power3.out", svgOrigin: "360 640" }, t);
  });
  // soft vignette
  var vg = el("radialGradient", { id: "vg", cx: 360, cy: 640, r: 760, gradientUnits: "userSpaceOnUse" }, defs);
  el("stop", { offset: .55, "stop-color": "#1c040d", "stop-opacity": 0 }, vg); el("stop", { offset: 1, "stop-color": "#1c040d", "stop-opacity": .7 }, vg);
  el("rect", { width: 720, height: 1280, fill: "url(#vg)" });

  // ---------- helpers ----------
  function headline(parent, l1, l2) {
    var g = el("g", {});
    var a = T(l1, 360, 175, 112, 400, CREAM, g, "middle", "serif");
    var b = T(l2, 360, 300, 112, 400, GOLD, g, "middle", "serif"); b.setAttribute("font-style", "italic");
    return { g: g, a: a, b: b };
  }
  function card(x, y, w, h) {
    var g = el("g", {});
    el("rect", { x: x + 4, y: y + 24, width: w, height: h, rx: 44, fill: "#12030a", opacity: .5 }, g);
    el("rect", { x: x, y: y, width: w, height: h, rx: 44, fill: "#fffaf2" }, g);
    return g;
  }
  // beat timeline: in at t, out at t+1.6 ; cut feeling by quick exit
  function beatIn(h, c, t, tiltFrom, tiltTo) {
    tl.fromTo(h.a, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: "power4.out" }, t);
    tl.fromTo(h.b, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: "power4.out" }, t + .1);
    tl.fromTo(c, { y: 900, rotation: tiltFrom, svgOrigin: "360 800" }, { y: 0, rotation: tiltTo, duration: .75, ease: "back.out(1.25)", svgOrigin: "360 800" }, t + .05);
    tl.to(c, { rotation: tiltTo + 2, duration: 1.6, ease: "sine.inOut", svgOrigin: "360 800" }, t + .8);
  }
  function beatOut(h, c, t) {
    tl.to([h.a, h.b], { y: -50, opacity: 0, duration: .2, ease: "power2.in", stagger: .03 }, t);
    tl.to(c, { y: -80, opacity: 0, duration: .22, ease: "power2.in" }, t);
  }
  var CX = 100, CY = 440, CW = 520, CH = 740;

  // ---------- Beat 1: leaderboard ----------
  var h1 = headline(s, "Chaque jour,", "une compétition.");
  h1.a.setAttribute("font-size", 118); h1.b.setAttribute("font-size", 104);
  var c1 = card(CX, CY, CW, CH);
  T("Classement", CX + 44, CY + 82, 40, 700, INK, c1);
  var tag = el("g", {}, c1);
  el("rect", { x: CX + CW - 232, y: CY + 40, width: 188, height: 54, rx: 27, fill: "#fbe3cf" }, tag);
  T("Aujourd’hui", CX + CW - 138, CY + 77, 24, 700, "#a24a3a", tag, "middle");
  var people = [
    { n: "Léa", c: "#d9487a", from: 4120, to: 4500, slot: 1 },
    { n: "Noé", c: "#e8963a", from: 3980, to: 4780, slot: 0 },
    { n: "Inès", c: "#4aa38c", from: 3510, to: 3890, slot: 2 },
    { n: "Malo", c: "#6a6fd6", from: 3200, to: 3460, slot: 3 }
  ];
  var RH = 134, RY = CY + 126;
  people.forEach(function (p, i) {
    var startSlot = i;
    var row = el("g", {}, c1);
    var y = RY + startSlot * RH;
    var hi = el("rect", { x: CX + 22, y: y, width: CW - 44, height: RH - 14, rx: 30, fill: i === 0 ? "#fde7d3" : "#f6efe6" }, row);
    var hiTop = el("rect", { x: CX + 22, y: y, width: CW - 44, height: RH - 14, rx: 30, fill: "#fbd2a8", opacity: 0 }, row);
    var rank = T(String(startSlot + 1), CX + 60, y + 78, 40, 800, "#a24a3a", row, "middle");
    el("circle", { cx: CX + 140, cy: y + 60, r: 40, fill: p.c }, row);
    T(p.n.charAt(0), CX + 140, y + 75, 42, 700, "#fff", row, "middle");
    T(p.n, CX + 200, y + 74, 38, 700, INK, row);
    var sc = T(fmt(p.from), CX + CW - 48, y + 76, 40, 800, INK, row, "end");
    var o = { v: p.from };
    tl.to(o, { v: p.to, duration: 1.0, ease: "power2.out", onUpdate: function () { sc.textContent = fmt(o.v); } }, .35);
    var dy = (p.slot - startSlot) * RH;
    if (dy) {
      tl.to(row, { y: dy, duration: .45, ease: "power3.inOut" }, .85);
      tl.to(rank, { scale: 1.0, duration: .01, onStart: function () {}, }, .85);
    }
    if (p.slot === 0) { tl.to(hiTop, { opacity: 1, duration: .3 }, 1.05); tl.fromTo(row, { scale: 1 }, { scale: 1.035, duration: .2, yoyo: true, repeat: 1, ease: "power2.out", svgOrigin: "360 " + (RY + 60) }, 1.05); }
    // rank numbers follow slot
    var rk = rank, from = String(startSlot + 1), to = String(p.slot + 1);
    if (from !== to) { tl.call(function () { rk.textContent = to; }, null, 1.05); tl.call(function () { rk.textContent = from; }, null, .84); }
  });
  beatIn(h1, c1, 0, -9, -5);
  beatOut(h1, c1, 1.38);

  // ---------- Beat 2: streak ----------
  var h2 = headline(s, "Ta série", "ne s’arrête plus.");
  h2.a.setAttribute("font-size", 118); h2.b.setAttribute("font-size", 104);
  var c2 = card(CX, CY, CW, CH);
  var fl = el("g", { transform: "translate(" + (CX + CW / 2) + " " + (CY + 240) + ")" }, c2);
  el("circle", { r: 150, fill: "#fde7d3" }, fl);
  var flame = el("g", {}, fl);
  el("path", { d: "M0 -120 C 30 -70 82 -50 82 12 C 82 62 46 98 0 98 C -46 98 -82 62 -82 12 C -82 -22 -60 -40 -44 -70 C -30 -50 -20 -44 -12 -52 C -10 -80 -8 -100 0 -120 Z", fill: "#e8573a" }, flame);
  el("path", { d: "M0 -30 C 18 -2 50 8 50 44 C 50 72 28 92 0 92 C -28 92 -50 72 -50 44 C -50 14 -20 4 0 -30 Z", fill: "#ffb347" }, flame);
  var streak = T("0", CX + CW / 2, CY + 500, 190, 400, INK, c2, "middle", "serif");
  T("jours d’affilée", CX + CW / 2, CY + 568, 40, 600, "#a24a3a", c2, "middle");
  var days = ["L", "M", "M", "J", "V", "S", "D"], dots = [];
  days.forEach(function (d, i) {
    var x = CX + 58 + i * 67.3, y = CY + 650;
    var cg = el("g", {}, c2);
    el("circle", { cx: x, cy: y, r: 28, fill: "#f1e6d8" }, cg);
    var on = el("circle", { cx: x, cy: y, r: 28, fill: "#e8573a" }, cg);
    T(d, x, y + 10, 26, 800, "#fff", cg, "middle");
    tl.fromTo(on, { scale: 0, svgOrigin: x + " " + y }, { scale: 1, duration: .2, ease: "back.out(3)", svgOrigin: x + " " + y }, 1.9 + i * .07);
  });
  var so = { v: 0 };
  tl.to(so, { v: 12, duration: .9, ease: "power2.out", onUpdate: function () { streak.textContent = Math.round(so.v); } }, 1.8);
  tl.fromTo(flame, { scale: .7, svgOrigin: "0 98" }, { scale: 1, duration: .5, ease: "back.out(2.5)", svgOrigin: "0 98" }, 1.75);
  tl.to(flame, { scale: 1.06, duration: .3, yoyo: true, repeat: 3, ease: "sine.inOut", svgOrigin: "0 98" }, 2.3);
  beatIn(h2, c2, 1.6, 8, 4.5);
  beatOut(h2, c2, 2.98);
  // make beat 2 invisible before it enters
  gsap.set([h2.g, c2], { opacity: 0 });
  tl.set([h2.g, c2], { opacity: 1 }, 1.6);

  // ---------- Beat 3: finale ----------
  var h3 = headline(s, "Prêt à jouer ?", "Rejoins Mentis.");
  h3.a.setAttribute("font-size", 118); h3.b.setAttribute("font-size", 104);
  var c3 = card(CX, CY, CW, CH - 40);
  var ic = el("g", { transform: "translate(" + (CX + CW / 2) + " " + (CY + 190) + ")" }, c3);
  el("rect", { x: -100, y: -100, width: 200, height: 200, rx: 52, fill: "#5a1230" }, ic);
  el("rect", { x: -100, y: -100, width: 200, height: 200, rx: 52, fill: "none", stroke: GOLD, "stroke-width": 4, opacity: .6 }, ic);
  var m = T("M", 0, 46, 150, 400, GOLD, ic, "middle", "serif"); m.setAttribute("font-style", "italic");
  T("Mentis", CX + CW / 2, CY + 400, 120, 400, INK, c3, "middle", "serif");
  T("Le défi quotidien du cerveau", CX + CW / 2, CY + 464, 32, 500, "#8a5a58", c3, "middle");
  var pill = el("g", {}, c3);
  el("rect", { x: CX + 36, y: CY + 520, width: CW - 72, height: 100, rx: 50, fill: "#5a1230" }, pill);
  T("Télécharge maintenant", CX + CW / 2, CY + 584, 38, 700, CREAM, pill, "middle");
  beatIn(h3, c3, 3.2, -8, -3);
  tl.to(c3, { rotation: -2, duration: 1.2, ease: "sine.inOut", svgOrigin: "360 800" }, 4.0);
  gsap.set([h3.g, c3], { opacity: 0 });
  tl.set([h3.g, c3], { opacity: 1 }, 3.2);
  tl.fromTo(pill, { scale: .85, svgOrigin: (CX + CW / 2) + " " + (CY + 570) }, { scale: 1, duration: .45, ease: "back.out(3)", svgOrigin: (CX + CW / 2) + " " + (CY + 570) }, 3.75);
  tl.fromTo(ic, { scale: .6, rotation: -20 }, { scale: 1, rotation: 0, duration: .6, ease: "back.out(2.2)", svgOrigin: (CX + CW / 2) + " " + (CY + 190) }, 3.45);
  tl.to(pill, { scale: 1.04, duration: .35, yoyo: true, repeat: 1, ease: "sine.inOut", svgOrigin: (CX + CW / 2) + " " + (CY + 570) }, 4.2);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
