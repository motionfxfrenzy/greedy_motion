<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Terminal typing</title>
<script src="vendor/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0a0f1a}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(900px 500px at 70% 20%,#16233f,#0a0f1a);font-family:'JetBrains Mono',monospace;color:#e2e8f0}
#win{position:absolute;left:90px;top:70px;width:1100px;height:580px;background:#0f1626;border-radius:20px;border:2px solid #263248;box-shadow:0 40px 90px rgba(0,0,0,.55);overflow:hidden}
#bar{height:62px;background:#161f33;display:flex;align-items:center;padding-left:26px;gap:12px}
#bar i{width:18px;height:18px;border-radius:9px;display:block}
#bar b{margin-left:24px;font-size:22px;color:#7f8ca6;font-weight:500}
#gut{position:absolute;left:0;top:62px;bottom:0;width:80px;background:#0c1220;border-right:2px solid #1c2740}
.row{position:absolute;left:0;right:0;height:64px;font-size:34px;line-height:64px}
.num{position:absolute;left:0;width:60px;text-align:right;color:#4a5878}
.txt{position:absolute;left:112px;white-space:pre}
.c{opacity:0}
#cur{position:absolute;width:19px;height:40px;background:#7dd3fc;opacity:1}
#hlb{position:absolute;left:80px;right:0;height:64px;background:rgba(74,222,128,.16);border-left:5px solid #4ade80;opacity:0;transform-origin:0 50%}
#badge{position:absolute;right:56px;width:70px;height:70px;border-radius:35px;background:#22c55e;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(34,197,94,.5)}
.g{color:#4ade80}.b{color:#7dd3fc}.d{color:#8b98b4}.p{color:#f0abfc}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720">
<div id="win">
<div id="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><b>~/project  -  terminal</b></div>
<div id="gut"></div>
<div id="hlb"></div>
<div id="rows"></div>
<div id="cur"></div>
<div id="badge"><svg width="40" height="40" viewBox="0 0 40 40"><path id="ck" d="M9 21 L17 29 L31 12" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="40"/></svg></div>
</div>
</div>
<script>
const CH=34*0.6, TOP=84, LH=64, TX=112;
const lines=[
 {t:"$ npm run build",type:1,cls:["g","","",""]},
 {t:"> compiling modules...",d:1},
 {t:"> optimising assets...",d:1},
 {t:"  compiled successfully",key:1},
 {t:"> ready to deploy",d:1}
];
const rows=document.getElementById("rows");
lines.forEach((l,i)=>{
  const r=document.createElement("div");r.className="row";r.style.top=(TOP+i*LH-62+62)+"px";
  r.innerHTML='<span class="num">'+(i+1)+'</span><span class="txt"></span>';
  const tx=r.querySelector(".txt");
  [...l.t].forEach((ch,k)=>{
    const s=document.createElement("span");s.className="c";s.textContent=ch;
    let col="#e2e8f0";
    if(i==0){col=k==0?"#4ade80":(k<6?"#7dd3fc":"#e2e8f0")}
    else if(l.d)col="#8b98b4";
    else if(l.key)col="#4ade80";
    s.style.color=col;tx.appendChild(s);
  });
  r.style.opacity=i==0?1:1;l.el=r;rows.appendChild(r);
});
// key line prefix checkmark char
const tl=gsap.timeline({paused:true});
const cur=document.getElementById("cur");
function curAt(i,n,t){tl.set(cur,{left:TX+n*CH,top:TOP+i*LH+12-0},t);}
// line numbers always visible; first line numbers
lines.forEach((l,i)=>{ /* rows visible; chars hidden */ });
curAt(0,0,0);
// cursor blink while idle (steps from time)
for(let t=0;t<5;t+=0.5){tl.set(cur,{opacity:(Math.floor(t/0.5)%2==0)?1:0},t);}
// typing line 0: starts 0.3, 0.07s per char
const t0=0.3,dt=0.075;
const line0=lines[0].el.querySelectorAll(".c");
line0.forEach((c,k)=>{const t=t0+k*dt;tl.set(c,{opacity:1},t);tl.set(cur,{left:TX+(k+1)*CH,opacity:1},t);});
const tEnd=t0+line0.length*dt; // ~1.43
// hide numbers of lines not yet shown
lines.forEach((l,i)=>{ if(i>0){tl.set(l.el,{opacity:0},0);} });
const times=[1.7,2.05,2.4,2.8];
for(let i=1;i<5;i++){
  const t=times[i-1];
  tl.set(lines[i].el,{opacity:1},t);
  const cs=lines[i].el.querySelectorAll(".c");
  tl.fromTo(lines[i].el.querySelector(".txt"),{x:-14},{x:0,duration:.25,ease:"power3.out",immediateRender:false},t);
  cs.forEach(c=>tl.set(c,{opacity:1},t));
  tl.fromTo(lines[i].el,{opacity:0},{opacity:1,duration:.15,immediateRender:false},t);
}
// cursor jumps to the next prompt row
tl.set(cur,{left:TX,top:TOP+5*LH+12,opacity:1},3.0);
// highlight key line (row index 3)
const hb=document.getElementById("hlb");
tl.set(hb,{top:TOP+3*LH},0);
tl.fromTo(hb,{opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:.4,ease:"power3.out",immediateRender:false},3.2);
lines[3].el.querySelectorAll(".c").forEach(c=>tl.to(c,{color:"#d1fae5",duration:.2},3.3));
// badge
const bd=document.getElementById("badge");
tl.set(bd,{top:TOP+3*LH-3,scale:0,opacity:0},0);
tl.to(bd,{scale:1,opacity:1,duration:.4,ease:"back.out(3)"},3.55);
tl.to("#ck",{strokeDashoffset:0,duration:.3,ease:"power2.out"},3.7);
tl.fromTo(bd,{boxShadow:"0 0 0 0 rgba(34,197,94,.55)"},{boxShadow:"0 0 0 26px rgba(34,197,94,0)",duration:.6,ease:"power2.out",immediateRender:false},3.7);
tl.set({},{},5);
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;
</script></body></html>
