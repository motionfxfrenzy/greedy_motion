}
// closed shape: marker fill (misregistered) + outline drawn on

var cid = 0;
function write(str, x, y, size, color, t, dur, o) {

}

}
function grp(attrs, P) { return el("g", attrs || {}, P || art); }
var CX = 390, CY = 360, RR = 190, T0 = .3, TD = 4.0;
function P(a, r) { return [CX + Math.cos(a * Math.PI / 180) * r, CY + Math.sin(a * Math.PI / 180) * r]; }
// title
write("Life, on", 740, 290, 112, INK, .1, .6, { italic: true, weight: 500 });
write("a loop.", 740, 410, 112, VERM, .5, .6, { italic: true, weight: 500 });
stroke([[745, 440], [900, 436], [1080, 444], [1200, 438]], VERM, 5, 1.1, .5, { amp: 2 });
// ring
stroke(arc(CX, CY, RR, RR, -90, 268, 40), INK, 7, T0, TD, { amp: 1.2, ease: "none" });
// figure
var fig = grp({}), fa = { a: -90, s: .95, r: 0 };
shape(arc(0, -46, 11, 11, 0, 360, 10), { p: fig, fill: "#f2c9b0", t: 0, dur: .3, w: 4, amp: .6, dx: 2, dy: 2 });
stroke([[0, -35], [0, -12]], VERM, 5, .1, .2, { p: fig, single: true, amp: .5 });
stroke([[-14, -28], [0, -32], [14, -28]], VERM, 5, .15, .2, { p: fig, single: true, amp: .5 });
stroke([[-10, 0], [0, -12], [10, 0]], VERM, 5, .2, .2, { p: fig, single: true, amp: .5 });
var cane = stroke([[18, -26], [20, -10], [18, 0]], INK, 5, 0, .01, { p: fig, single: true, amp: .3 })[0];
tl.set(cane, { opacity: 0 }, 0); tl.set(cane, { opacity: 1 }, 3.9);
function place() {
  var p = P(fa.a, RR);

}
place();
tl.to(fa, { a: 270, duration: TD, ease: "none", onUpdate: place }, T0);
tl.to(fa, { s: 1.8, duration: 1.6, ease: "power1.inOut", onUpdate: place }, T0);
tl.to(fa, { s: 1.55, r: 12, duration: 1.2, ease: "power1.inOut", onUpdate: place }, 3.1);
tl.to(fa, { s: .95, r: 0, duration: .5, ease: "power1.inOut", onUpdate: place }, 4.3);
// stage icons at ring radius + 80, label inside
var stages = [["play", 0], ["school", 1], ["work", 2], ["family", 3], ["rest", 4]];

  var ang = -90 + 72 * k, t = T0 + TD * (72 * k / 360) + .05;
  if (k === 0) t = .6;
  var p = P(ang, RR + 92), g = grp({ transform: "translate(" + p[0].toFixed(0) + " " + p[1].toFixed(0) + ") scale(1.4)" });
  var ip = P(ang, RR), tick = stroke([[ip[0] + (p[0] - ip[0]) * .2, ip[1] + (p[1] - ip[1]) * .2], [ip[0] + (p[0] - ip[0]) * .52, ip[1] + (p[1] - ip[1]) * .52]], GREY, 3, t, .2, { single: true, amp: .8 });

    dr([[-26, -2], [-10, 2]], GREY, 3, .3); dr([[10, 2], [26, -2]], GREY, 3, .35);

});
// loop-back arrow head at the top
stroke([[CX + 24, CY - RR - 16], [CX + 2, CY - RR + 2], [CX + 26, CY - RR + 22]], VERM, 6, 4.3, .2, { single: true, amp: .6 });

stroke([[760, 560], [660, 430], [590, 270], [500, 190]], GREY, 5, 4.2, .45, { amp: 2.5 });
