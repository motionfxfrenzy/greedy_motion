<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Bold manifesto typography</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #0b0b0f; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0b0b0f; font-family: "Archivo Black", "Inter", sans-serif; }
  #flip { position: absolute; inset: 0; background: #ffd400; transform-origin: 0 50%; transform: scaleX(0); }
  #stage { position: absolute; inset: 0; }
  .w { position: absolute; left: 92px; white-space: nowrap; line-height: 1; color: #f5f1e8; transform-origin: 0 60%; opacity: 0; letter-spacing: -0.03em; }
  #bar { position: absolute; left: 0; width: 1280px; top: 468px; height: 150px; background: #0b0b0f; transform-origin: 0 50%; transform: scaleX(0); }
  #ev { color: #ffd400; }
  #side { position: absolute; left: 36px; top: 60px; width: 22px; height: 0; background: #ffd400; }
  #star { position: absolute; right: 110px; top: 210px; width: 230px; height: 230px; }
  #lab { position: absolute; left: 92px; bottom: 40px; font-size: 30px; letter-spacing: 0.18em; color: #0b0b0f; opacity: 0; display: flex; align-items: center; gap: 18px; }
  #lab i { display: block; width: 26px; height: 26px; border-radius: 50%; background: #0b0b0f; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
  <div id="flip"></div>
  <div id="bar"></div>
  <div id="side"></div>
  <svg id="star" viewBox="-50 -50 100 100"><g id="starg"><path d="M0 -46V46M-46 0H46M-33 -33L33 33M-33 33L33 -33" stroke="#ffd400" stroke-width="10" stroke-linecap="square" fill="none"/></g></svg>
  <div id="stage">
    <div class="w" id="w1" style="top:44px;font-size:152px">KNOWLEDGE</div>
    <div class="w" id="w2" style="top:176px;font-size:152px">SHOULD</div>
    <div class="w" id="w3" style="top:308px;font-size:152px">BELONG</div>
    <div class="w" id="w4" style="top:500px;font-size:96px;color:#ffd400">TO</div>
    <div class="w" id="w5" style="top:482px;left:270px;font-size:134px" ><span id="ev">EVERYONE</span></div>
  </div>
  <div id="lab"><i></i>THE OPEN LAB</div>
</div>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  var YEL = "#ffd400", INK = "#0b0b0f";
  function slam(id, t, big) {
    tl.fromTo(id, { scale: big || 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, t);
    tl.fromTo("#stage", { x: 0, y: 0 }, { x: 9, y: -6, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, t + 0.18);
  }
  slam("#w1", 0.0, 1.35);
  tl.to("#side", { height: 130, duration: 0.2, ease: "power4.out" }, 0.0);
  slam("#w2", 0.7);
  tl.to("#side", { height: 262, duration: 0.2, ease: "power4.out" }, 0.7);
  slam("#w3", 1.35);
  tl.to("#side", { height: 394, duration: 0.2, ease: "power4.out" }, 1.35);
  tl.to("#w3", { color: YEL, duration: 0.01 }, 1.55);
  tl.to("#starg", { rotation: 180, duration: 5, ease: "none", svgOrigin: "0 0" }, 0);
  // the cut: poster flips yellow
  tl.fromTo("#flip", { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "expo.out" }, 2.1);
  tl.set(["#w1","#w2","#w3"], { color: INK }, 2.18);
  tl.set("#side", { backgroundColor: INK }, 2.18);
  tl.set("#star path", { stroke: INK }, 2.18);
  slam("#w4", 2.25, 1.8);
  tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "expo.out" }, 2.55);
  tl.set("#w5", { opacity: 1 }, 2.55);
  tl.fromTo("#w5", { scale: 1.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.out" }, 2.62);
  tl.fromTo("#stage", { x: 0, y: 0 }, { x: -12, y: 8, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, 2.8);
  tl.to("#side", { height: 560, duration: 0.25, ease: "power4.out" }, 2.6);
  tl.fromTo("#lab", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.5);
  tl.to("#starg", { scale: 1.25, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", svgOrigin: "0 0" }, 2.62);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
