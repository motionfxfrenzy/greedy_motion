<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stop-motion puppet</title>
<script src="vendor/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: #120d0c; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #1b1412; }
  #cv { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
<canvas id="cv" class="clip" width="1280" height="720" data-start="0" data-duration="5" data-track-index="0"></canvas>
</div>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  const W = 1280, H = 720;
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  const mul = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const seg = (q, a, b) => clamp((q - a) / (b - a));
  const eio = (x) => x * x * (3 - 2 * x);
  const hexRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const sh = (c, k) => { const a = hexRgb(c), t = Math.abs(k), tg = k > 0 ? [255, 238, 205] : [18, 8, 16]; return "rgb(" + a.map((v, i) => Math.round(v + (tg[i] - v) * t)).join(",") + ")"; };
  const rgba = (c, al) => { const a = hexRgb(c); return "rgba(" + a[0] + "," + a[1] + "," + a[2] + "," + al + ")"; };

  // ---------- textures ----------
  let GRAIN, WEAVE;
  (function () {
    const n = 512, c = mk(n, n), g = c.getContext("2d"), r = mul(99);
    g.fillStyle = "#808080"; g.fillRect(0, 0, n, n);
    for (let i = 0; i < 520; i++) { // soft clay dents and lumps
      const x = r() * n, y = r() * n, rad = 6 + r() * 26, v = r() < .5 ? 40 : 215, a = .10 + r() * .16;
      for (const ox of [-n, 0, n]) for (const oy of [-n, 0, n]) {
        const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, rad);
        gr.addColorStop(0, "rgba(" + v + "," + v + "," + v + "," + a + ")"); gr.addColorStop(1, "rgba(" + v + "," + v + "," + v + ",0)");
        g.fillStyle = gr; g.fillRect(x + ox - rad, y + oy - rad, rad * 2, rad * 2);
      }
    }
    const id = g.getImageData(0, 0, n, n), d = id.data;
    for (let i = 0; i < d.length; i += 4) { const v = (r() - .5) * 78; d[i] = clamp(d[i] + v, 0, 255); d[i + 1] = clamp(d[i + 1] + v, 0, 255); d[i + 2] = clamp(d[i + 2] + v, 0, 255); }
    g.putImageData(id, 0, 0);
    GRAIN = ctx.createPattern(c, "repeat");
    const w = mk(6, 6), wg = w.getContext("2d");
    wg.strokeStyle = "rgba(0,0,0,.22)"; wg.lineWidth = 1.2;
    wg.beginPath(); wg.moveTo(0, 1.5); wg.lineTo(6, 1.5); wg.moveTo(1.5, 0); wg.lineTo(1.5, 6); wg.stroke();
    wg.strokeStyle = "rgba(255,255,255,.14)"; wg.beginPath(); wg.moveTo(0, 4.5); wg.lineTo(6, 4.5); wg.moveTo(4.5, 0); wg.lineTo(4.5, 6); wg.stroke();
    WEAVE = ctx.createPattern(w, "repeat");
  })();

  let GX = 0, GY = 0; // grain boil offset, changes every stop-motion frame

  // ---------- shape helpers ----------
  function blobFn(cx, cy, rx, ry, sd, wob) {
    wob = wob == null ? .035 : wob;
    const r = mul(sd), n = 20, p = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, k = 1 + (r() - .5) * 2 * wob; p.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
    return (g) => {
      const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const s = m(p[n - 1], p[0]); g.moveTo(s[0], s[1]);
      for (let i = 0; i < n; i++) { const e = m(p[i], p[(i + 1) % n]); g.quadraticCurveTo(p[i][0], p[i][1], e[0], e[1]); }
      g.closePath();
    };
  }
  function capFn(x1, y1, x2, y2, r) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    return (g) => { g.arc(x1, y1, r, a + Math.PI / 2, a + Math.PI * 1.5); g.arc(x2, y2, r, a - Math.PI / 2, a + Math.PI / 2); g.closePath(); };
  }
  const capBB = (x1, y1, x2, y2, r) => [Math.min(x1, x2) - r, Math.min(y1, y2) - r, Math.max(x1, x2) + r, Math.max(y1, y2) + r];

  // a lump of clay: lit from upper left, bevelled edge, grain that boils, soft inner shadow
  function clay(g, fn, c, bb, o) {
    o = o || {};
    const x0 = bb[0], y0 = bb[1], x1 = bb[2], y1 = bb[3], w = x1 - x0, h = y1 - y0, m = Math.max(w, h);
    g.save();
    g.beginPath(); fn(g);
    const gr = g.createRadialGradient(x0 + w * .3, y0 + h * .24, m * .02, x0 + w * .46, y0 + h * .5, m * .8);
    gr.addColorStop(0, sh(c, .32)); gr.addColorStop(.46, c); gr.addColorStop(1, sh(c, -.58));
    g.fillStyle = gr; g.fill();
    g.save(); g.clip();
    if (o.inside) o.inside(g);
    g.globalCompositeOperation = "soft-light"; g.globalAlpha = o.grain == null ? .9 : o.grain;
    g.save(); g.translate(GX, GY); g.fillStyle = GRAIN; g.fillRect(x0 - GX - 4, y0 - GY - 4, w + 8, h + 8); g.restore();
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
    const bev = o.bev == null ? 1 : o.bev, s = clamp(m / 90, .5, 1.6);
    g.save(); g.translate(-6 * s, -7 * s); g.beginPath(); g.rect(x0 - 70, y0 - 70, w + 140, h + 140); fn(g);
    g.filter = "blur(" + (6 * s) + "px)"; g.fillStyle = "rgba(24,6,10," + (.5 * bev) + ")"; g.fill("evenodd"); g.restore();
    g.save(); g.translate(4 * s, 5 * s); g.beginPath(); g.rect(x0 - 70, y0 - 70, w + 140, h + 140); fn(g);
    g.filter = "blur(" + (3.5 * s) + "px)"; g.fillStyle = "rgba(255,236,200," + (.34 * bev) + ")"; g.fill("evenodd"); g.restore();
    g.filter = "none";
    g.restore();
    g.beginPath(); fn(g); g.lineWidth = 1.4; g.strokeStyle = "rgba(30,10,12,.45)"; g.lineJoin = "round"; g.stroke();
    g.restore();
  }
  function weave(g, bb, a) { g.save(); g.globalAlpha = a == null ? .55 : a; g.fillStyle = WEAVE; g.fillRect(bb[0], bb[1], bb[2] - bb[0], bb[3] - bb[1]); g.restore(); }
  function stripes(g, bb, ang, period, wd, color, al) {
    g.save(); g.strokeStyle = color; g.lineWidth = wd; g.globalAlpha = al == null ? 1 : al;
    const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2, L = Math.hypot(bb[2] - bb[0], bb[3] - bb[1]);
    g.translate(cx, cy); g.rotate(ang);
    for (let x = -L; x < L; x += period) { g.beginPath(); g.moveTo(x, -L); g.lineTo(x, L); g.stroke(); }
    g.restore();
  }
  function stitch(g, fn, color, wd) {
    g.save(); g.beginPath(); fn(g); g.setLineDash([7, 6]); g.lineCap = "round"; g.lineWidth = wd || 2.2; g.strokeStyle = color || "#f3e6c8"; g.stroke();
    g.setLineDash([]); g.restore();
  }
  function button(g, x, y, r, c, rot, ink) {
    clay(g, (q) => q.arc(x, y, r, 0, Math.PI * 2), c || "#efe3c6", [x - r, y - r, x + r, y + r], { bev: 1.2, grain: .6 });
    g.save(); g.translate(x, y); g.rotate(rot || 0);
    g.beginPath(); g.arc(0, 0, r * .72, 0, Math.PI * 2); g.lineWidth = 1.6; g.strokeStyle = "rgba(60,30,20,.35)"; g.stroke();
    g.beginPath(); g.arc(0, 0, r * .72, Math.PI * .95, Math.PI * 1.6); g.lineWidth = 1.4; g.strokeStyle = "rgba(255,255,240,.55)"; g.stroke();
    const d = r * .3;
    g.strokeStyle = ink || "#24344a"; g.lineWidth = Math.max(1.6, r * .11); g.lineCap = "round";
    g.beginPath(); g.moveTo(-d, -d); g.lineTo(d, d); g.moveTo(d, -d); g.lineTo(-d, d); g.stroke();
    g.fillStyle = "#2a1a16";
    for (const [px, py] of [[-d, -d], [d, -d], [-d, d], [d, d]]) { g.beginPath(); g.arc(px, py, r * .13, 0, Math.PI * 2); g.fill(); }
    g.restore();
  }
  function star(g, cx, cy, R, r, rot) {
    for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r : R; g[i ? "lineTo" : "moveTo"](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
    g.closePath();
  }
  const mid = (a, b, t) => a + (b - a) * t;

  // ---------- static set (cached) ----------
  const BG = mk(W, H), CUR = mk(W + 40, H);
  const LAMP = { bx: 958, by: 596 };
  function buildBG() {
    const g = BG.getContext("2d");
    // back wall: dusk-painted clay board
    clay(g, (q) => q.rect(0, 0, W, 640), "#2f6678", [0, 0, W, 640], { bev: 0, grain: 1 });
    // painted sky glow
    g.save(); g.beginPath(); g.rect(0, 0, W, 640); g.clip();
    let gr = g.createRadialGradient(420, 170, 10, 420, 170, 560); gr.addColorStop(0, "rgba(255,206,140,.30)"); gr.addColorStop(1, "rgba(255,206,140,0)");
    g.fillStyle = gr; g.fillRect(0, 0, W, 640);
    g.restore();
    // clay stars
    const stars = [[470, 108, 17], [780, 96, 13], [1110, 190, 15], [330, 330, 12], [905, 232, 11], [640, 82, 10]];
    stars.forEach((s, i) => clay(g, (q) => star(q, s[0], s[1], s[2], s[2] * .5, i * .4), "#f1c85a", [s[0] - s[2], s[1] - s[2], s[0] + s[2], s[1] + s[2]], { bev: .9 }));
    // clay moon with thumb-pressed craters
    const mfn = blobFn(404, 196, 62, 62, 5, .02);
    clay(g, mfn, "#f3dca0", [342, 134, 466, 258], {
      inside: (q) => { [[384, 178, 13], [430, 214, 16], [412, 160, 8], [378, 230, 9]].forEach(([x, y, r]) => { q.fillStyle = "rgba(130,90,40,.30)"; q.beginPath(); q.arc(x, y, r, 0, 7); q.fill(); q.fillStyle = "rgba(255,245,210,.35)"; q.beginPath(); q.arc(x - 2, y - 2, r * .7, 0, 7); q.fill(); }); }
    });
    // sculpted hills
    const hill = (pts, c, sd) => { const fn = (q) => { q.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) q.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + (pts[i + 1] || pts[i])[0]) / 2, (pts[i][1] + (pts[i + 1] || pts[i])[1]) / 2); q.lineTo(W, 560); q.lineTo(0, 560); q.closePath(); }; clay(g, fn, c, [0, 380, W, 560], { bev: .9 }); };
    hill([[0, 470], [200, 400], [430, 450], [640, 430], [860, 380], [1100, 440], [W, 410], [W, 410]], "#3b7a67");
    hill([[0, 520], [260, 470], [520, 505], [800, 470], [1050, 500], [W, 480], [W, 480]], "#2a5c52");
    // stage: wooden top plane with perspective planks, front face, trim
    const top = (q) => { q.moveTo(150, 548); q.lineTo(1130, 548); q.lineTo(1330, 618); q.lineTo(-50, 618); q.closePath(); };
    clay(g, top, "#bb8355", [-50, 548, 1330, 618], {
      bev: .6, inside: (q) => {
        q.strokeStyle = "rgba(60,30,16,.42)"; q.lineWidth = 2.4;
        for (let i = -6; i <= 6; i++) { q.beginPath(); q.moveTo(640 + i * 140 * .82, 548); q.lineTo(640 + i * 210 * .82, 618); q.stroke(); }
        q.strokeStyle = "rgba(255,225,170,.16)"; q.lineWidth = 1.5;
        for (let i = -6; i <= 6; i++) { q.beginPath(); q.moveTo(642 + i * 140 * .82, 548); q.lineTo(642 + i * 210 * .82, 618); q.stroke(); }
        const r = mul(31); q.strokeStyle = "rgba(90,50,24,.22)"; q.lineWidth = 1.2;
        for (let i = 0; i < 60; i++) { const x = 60 + r() * 1160, y = 552 + r() * 60, l = 30 + r() * 80; q.beginPath(); q.moveTo(x, y); q.bezierCurveTo(x + l * .3, y - 2, x + l * .6, y + 2, x + l, y); q.stroke(); }
      }
    });
    const face = (q) => { q.moveTo(-50, 618); q.lineTo(1330, 618); q.lineTo(1350, 700); q.lineTo(-70, 700); q.closePath(); };
    clay(g, face, "#8a5638", [-70, 618, 1350, 700], { bev: .8, inside: (q) => { q.fillStyle = "rgba(0,0,0,.18)"; q.fillRect(0, 668, W, 40); } });
    g.fillStyle = "#150e0c"; g.fillRect(0, 700, W, 20);
    // stage lip highlight
    g.save(); g.beginPath(); g.moveTo(-50, 618); g.lineTo(1330, 618); g.lineWidth = 3; g.strokeStyle = "rgba(255,226,170,.5)"; g.stroke(); g.restore();
    // clay stage stars on the front face
    [[300, 660], [640, 660], [980, 660]].forEach((s, i) => clay(g, (q) => star(q, s[0], s[1], 17, 8, 0), i === 1 ? "#e0a82e" : "#d9774f", [s[0] - 17, s[1] - 17, s[0] + 17, s[1] + 17], { bev: .9 }));
    // lamp base (the wire and shade are animated)
    clay(g, blobFn(LAMP.bx, LAMP.by, 40, 11, 12, .02), "#3e6e72", [LAMP.bx - 40, LAMP.by - 11, LAMP.bx + 40, LAMP.by + 11], { bev: .8 });

    // curtains + valance in their own layer
    const c = CUR.getContext("2d");
    c.translate(20, 0);
    const edge = (y) => y < 340 ? 252 - 122 * Math.sin(Math.PI / 2 * y / 340) : 130 + 112 * Math.sin(Math.PI / 2 * clamp((y - 340) / 270, 0, 1));
    const curtain = (side) => {
      const fn = (q) => {
        const X = (x) => side < 0 ? x : W - x;
        q.moveTo(X(-30), -10);
        for (let y = 0; y <= 624; y += 12) q.lineTo(X(edge(y) + 8 * Math.sin(y * .045)), y);
        q.lineTo(X(-30), 624); q.closePath();
      };
      c.save(); c.shadowColor = "rgba(0,0,0,.55)"; c.shadowBlur = 26; c.shadowOffsetX = side < 0 ? 14 : -14; c.shadowOffsetY = 6;
      const bb = side < 0 ? [-30, 0, 260, 624] : [W - 260, 0, W + 30, 624];
      clay(c, fn, "#b23f30", bb, {
        bev: .5, grain: .9,
        inside: (q) => {
          // vertical folds: bands of light and shade that bunch toward the tie-back
          const X = (x) => side < 0 ? x : W - x;
          for (let k = 0; k < 24; k++) {
            const x0 = k * 15, ph = Math.sin(k * 1.9) * .5 + .5;
            q.beginPath();
            q.moveTo(X(x0 - 24), -10);
            for (let y = 0; y <= 624; y += 24) { const pinch = 1 - .55 * Math.exp(-Math.pow((y - 340) / 90, 2)); q.lineTo(X(x0 * pinch + 2 * Math.sin(y * .02 + k)), y); }
            for (let y = 624; y >= 0; y -= 24) { const pinch = 1 - .55 * Math.exp(-Math.pow((y - 340) / 90, 2)); q.lineTo(X((x0 + 9) * pinch + 2 * Math.sin(y * .02 + k)), y); }
            q.closePath();
            q.fillStyle = ph > .5 ? "rgba(255,190,150," + (.10 + .14 * ph) + ")" : "rgba(40,0,10," + (.12 + .22 * (1 - ph)) + ")"; q.fill();
          }
          weave(q, bb, .9);
          // darker side toward the wings, deep shadow in the folds
          const gg = q.createLinearGradient(side < 0 ? 0 : W, 0, side < 0 ? 260 : W - 260, 0);
          gg.addColorStop(0, "rgba(0,0,0,.45)"); gg.addColorStop(1, "rgba(0,0,0,0)"); q.fillStyle = gg; q.fillRect(bb[0], 0, 290, 624);
        }
      });
      c.restore();
      // sculpted hem and a stitched edge
      stitch(c, (q) => { for (let y = 12; y <= 610; y += 12) { const x = side < 0 ? edge(y) + 8 * Math.sin(y * .045) - 7 : W - edge(y) - 8 * Math.sin(y * .045) + 7; y === 12 ? q.moveTo(x, y) : q.lineTo(x, y); } }, "#f6dfa6", 2);
      // tie-back: clay cord with a wire loop and button
      const ty = 340, tx = side < 0 ? 124 : W - 124;
      clay(c, capFn(tx - 34 * (side < 0 ? 1 : -1) * .0 - 26, ty, tx + 26, ty + 4, 12), "#e0a82e", [tx - 40, ty - 14, tx + 40, ty + 20], { bev: 1 });
      c.save(); c.strokeStyle = "#cfd5d8"; c.lineWidth = 3; c.beginPath(); c.ellipse(tx, ty + 2, 30, 17, 0, 0, 7); c.stroke(); c.strokeStyle = "rgba(255,255,255,.7)"; c.lineWidth = 1; c.beginPath(); c.ellipse(tx - 1, ty, 30, 17, 0, Math.PI, Math.PI * 1.6); c.stroke(); c.restore();
      button(c, tx, ty + 2, 11, "#efe3c6", 0.3);
    };
    curtain(-1); curtain(1);
    // valance with scalloped edge, stitching and gold clay bobbles
    const val = (q) => { q.moveTo(-30, -10); q.lineTo(W + 30, -10); const n = 11, wv = (W + 60) / n; for (let i = n - 1; i >= 0; i--) { const x1 = -30 + i * wv, x2 = x1 + wv; q.lineTo(x2, 70); q.quadraticCurveTo((x1 + x2) / 2, 118, x1, 70); } q.closePath(); };
    c.save(); c.shadowColor = "rgba(0,0,0,.6)"; c.shadowBlur = 24; c.shadowOffsetY = 12;
    clay(c, val, "#8f2f2a", [-30, -10, W + 30, 118], { bev: .7, inside: (q) => { weave(q, [-30, -10, W + 30, 118], .9); stripes(q, [-30, -10, W + 30, 118], 0, 38, 14, "rgba(255,200,140,.10)"); } });
    c.restore();
    stitch(c, (q) => { const n = 11, wv = (W + 60) / n; q.moveTo(W + 30, 58); for (let i = n - 1; i >= 0; i--) { const x1 = -30 + i * wv, x2 = x1 + wv; q.lineTo(x2, 58); q.quadraticCurveTo((x1 + x2) / 2, 104, x1, 58); } }, "#f6dfa6", 2.2);
    for (let i = 0; i < 11; i++) { const x = -30 + (i + .5) * (W + 60) / 11, y = 91; clay(c, blobFn(x, y, 9, 9, 40 + i, .05), "#e0a82e", [x - 9, y - 9, x + 9, y + 9], { bev: 1 }); }
  }

  // ---------- puppet ----------
  const SKIN = "#e9a98b", AUB = "#a9461f", DRESS = "#e2a52b", TEAL = "#2d8a8c", CORAL = "#e0674a", CREAM = "#f2e6c9";
  const hairCols = ["#7c2f16", "#a9461f", "#c8622a", "#dd8a3a", "#8d3a1a", "#e9a24c"];

  function state(q) {
    const raise = eio(seg(q, .5, 1.6)) - eio(seg(q, 3.5, 4.5));
    const hAt = (u) => .9 * eio(seg(u, 1.0, 1.8)) - 1.7 * eio(seg(u, 2.6, 3.3)) + .8 * eio(seg(u, 3.7, 4.5));
    const env = seg(q, 1.8, 2.1) * (1 - seg(q, 3.2, 3.5));
    const wave = 25 * Math.sin((q - 2.0) * Math.PI * 2 * 1.9) * env;
    const sw = eio(seg(q, .6, 1.4)) - eio(seg(q, 3.4, 4.4));
    return { raise, h: hAt(q), hLag: hAt(q - .22), aU: 78 - 116 * raise, aF: 86 - 170 * raise + wave, aUL: 106 + 14 * sw, aFL: 101 + 9 * sw, smile: .35 + .65 * raise, lean: .022 * raise - .012 * (hAt(q)) };
  }

  function drawStrands(g, list, wd) {
    g.lineCap = "round";
    list.forEach((s) => {
      g.beginPath(); g.moveTo(s.x0, s.y0); g.bezierCurveTo(s.c1x, s.c1y, s.c2x, s.c2y, s.x1, s.y1);
      g.strokeStyle = s.col; g.lineWidth = wd * s.w; g.stroke();
      g.beginPath(); g.moveTo(s.x0 + 1, s.y0); g.bezierCurveTo(s.c1x + 1, s.c1y, s.c2x + 1, s.c2y, s.x1 + 1, s.y1);
      g.strokeStyle = "rgba(255,225,170,.30)"; g.lineWidth = wd * s.w * .35; g.stroke();
    });
  }

  function puppet(g, S, f) {
    const J = (k) => { const r = mul(f * 17 + k * 101 + 3); return [(r() - .5) * 2.6, (r() - .5) * 2.0, (r() - .5) * .014]; };
    g.save();
    g.translate(640 + 4 * S.raise, 582);
    g.rotate(S.lean);
    const jb = J(1); g.translate(jb[0] * .8, jb[1] * .6);

    // legs: striped fabric tights, clay boots with buttons
    [-1, 1].forEach((sd, i) => {
      const x = sd * 30, jl = J(10 + i);
      g.save(); g.translate(jl[0] * .5, 0);
      const fn = capFn(x, -72, x + sd * 2, -26, 14), bb = capBB(x, -72, x + sd * 2, -26, 14);

    // warm light spilling from the lamp over the wall and the puppet
    ctx.save(); ctx.globalCompositeOperation = "soft-light";
    gr = ctx.createRadialGradient(868, 330, 0, 868, 330, 420 * flick); gr.addColorStop(0, "rgba(255,190,100,.85)"); gr.addColorStop(1, "rgba(255,170,80,0)");
    ctx.fillStyle = gr; ctx.fillRect(400, 0, 880, 720); ctx.restore();

    // curtains hand-nudged each frame
    const jc = mul(f * 5 + 9), jx = (jc() - .5) * 2.2, jy = (jc() - .5) * 1.4;
    ctx.drawImage(CUR, -20 + jx, jy);

    // deep vignette: the dark around a lit miniature set
    gr = ctx.createRadialGradient(560, 330, 260, 640, 380, 860); gr.addColorStop(0, "rgba(10,3,4,0)"); gr.addColorStop(1, "rgba(10,3,4,.72)");
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    gr = ctx.createLinearGradient(0, 640, 0, 720); gr.addColorStop(0, "rgba(8,3,3,0)"); gr.addColorStop(1, "rgba(8,3,3,.55)"); ctx.fillStyle = gr; ctx.fillRect(0, 640, W, 80);
  }

  const PL = mk(W, H), puppetLayer = PL.getContext("2d");
  buildBG();
  let cur = 0;
  window.addEventListener("hf-seek", (e) => { cur = e.detail.time; draw(cur); });
  draw(0);
  const tl = gsap.timeline({ paused: true });
  const o = { t: 0 };
  tl.to(o, { t: 5, duration: 5, ease: "none", onUpdate: () => { cur = o.t; draw(cur); } }, 0);
  window.__timelines["main"] = tl;
})();
</script>
