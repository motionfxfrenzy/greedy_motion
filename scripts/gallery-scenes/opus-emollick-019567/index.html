<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Recursion explainer</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #6b4df0; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #6b4df0; font-family: "Fredoka", "Quicksand", sans-serif; }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
<svg id="s" width="1280" height="720" viewBox="0 0 1280 720"></svg>
</div>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg", s = document.getElementById("s");
  function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); (p || s).appendChild(e); return e; }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var R = rng(77);
  // wobbly rounded rectangle as a closed smooth path
  function wrect(x, y, w, h, r, amp) {
    var pts = [], k, n = 6, corners = [[x + w - r, y + r, -90], [x + w - r, y + h - r, 0], [x + r, y + h - r, 90], [x + r, y + r, 180]];
    corners.forEach(function (c) { for (k = 0; k <= 4; k++) { var a = (c[2] + k * 22.5) * Math.PI / 180; pts.push([c[0] + Math.cos(a) * r + (R() - .5) * amp, c[1] + Math.sin(a) * r + (R() - .5) * amp]); } });
    var d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1), i, m = pts.length;
    for (i = 0; i < m; i++) {
      var p0 = pts[(i + m - 1) % m], p1 = pts[i], p2 = pts[(i + 1) % m], p3 = pts[(i + 2) % m];
      d += " C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + " " + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + " " + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + " " + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
    }
    return d + "Z";
  }
  var W = 1100, H = 600, S = .72, CX = 154, CY = 142;
  var pops = [], own0 = [];
  function level(i, parent) {
    var g = el("g", {}, parent); pops.push(g);
    var st = i % 3;
    el("path", { d: wrect(10, 14, W, H, 40, 6), fill: "#2a1a74", opacity: .55 }, g);                       // hard shadow
    var fill = ["#fff6dc", "#1d1b2e", "#ffd84d"][st], stroke = ["#ff5a45", "#37e2a0", "#2a1a74"][st];
    el("path", { d: wrect(0, 0, W, H, 40, 6), fill: fill, stroke: stroke, "stroke-width": 9, "stroke-linejoin": "round" }, g);
    el("path", { d: wrect(24, 120, W - 48, H - 144, 26, 5), fill: "none", stroke: stroke, "stroke-width": 4, "stroke-dasharray": "2 14", "stroke-linecap": "round", opacity: .7 }, g);
    var t;
    if (st === 0) {
      t = el("text", { x: 54, y: 92, "font-size": 86, "font-weight": 700, fill: "#2a1a74" }, g); t.textContent = "Recursion";
      el("path", { d: "M58 108 C 200 98 300 118 430 104", stroke: "#ff5a45", "stroke-width": 8, fill: "none", "stroke-linecap": "round" }, g);
      el("path", { d: "M950 40 q 30 -26 50 0 q 20 26 50 0", stroke: "#6b4df0", "stroke-width": 8, fill: "none", "stroke-linecap": "round" }, g);
    } else if (st === 1) {
      [0, 1, 2].forEach(function (k) { el("circle", { cx: 56 + k * 40, cy: 36, r: 11, fill: ["#ff5a45", "#ffd84d", "#37e2a0"][k] }, g); });
      t = el("text", { x: 54, y: 100, "font-size": 56, "font-weight": 700, fill: "#37e2a0", "font-family": "JetBrains Mono, monospace" }, g); t.textContent = "f() { f(); }";
      el("rect", { x: 560, y: 56, width: 26, height: 46, fill: "#37e2a0" }, g);
    } else {
      t = el("text", { x: 54, y: 82, "font-size": 72, "font-weight": 700, fill: "#2a1a74" }, g); t.textContent = "recursion";
      t = el("text", { x: 560, y: 82, "font-size": 40, "font-weight": 500, fill: "#2a1a74" }, g); t.textContent = "n. see: recursion";
    }
    if (i === 0) { for (var q = 0; q < g.childNodes.length; q++) own0.push(g.childNodes[q]); }
    if (i < 5) { var c = el("g", { transform: "translate(" + CX + " " + CY + ") scale(" + S + ")" }, g); level(i + 1, c); }
  }
  // background doodles
  el("path", { d: "M70 120 l16 -34 l16 34 l-34 -22 h36 z", fill: "none", stroke: "#ffd84d", "stroke-width": 6, "stroke-linejoin": "round" });
  el("path", { d: "M1180 640 c 30 -30 60 30 90 0", fill: "none", stroke: "#ff9ec4", "stroke-width": 8, "stroke-linecap": "round" });
  el("circle", { cx: 1210, cy: 90, r: 22, fill: "none", stroke: "#37e2a0", "stroke-width": 7 });
  el("path", { d: "M40 660 l30 0 m-15 -15 l0 30", stroke: "#ff9ec4", "stroke-width": 8, "stroke-linecap": "round" });
  var cam = el("g", {});
  var root = el("g", { transform: "translate(90 62)" }, cam);
  level(0, root);
  var FX = 90 + CX / (1 - S), FY = 62 + CY / (1 - S);
  var tl = gsap.timeline({ paused: true });
  pops.forEach(function (g, i) {
    var t0 = i === 0 ? 0 : .2 + (i - 1) * .2;
    tl.fromTo(g, { scale: i ? .2 : .7, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: i ? .45 : .5, ease: "back.out(2.2)" }, t0);
  });
  tl.to(own0, { opacity: 0, duration: .9, ease: "power1.in" }, 3.3);
  tl.fromTo(cam, { scale: 1, svgOrigin: FX + " " + FY }, { scale: 1 / S, svgOrigin: FX + " " + FY, duration: 2.3, ease: "power3.inOut" }, 2.0);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
