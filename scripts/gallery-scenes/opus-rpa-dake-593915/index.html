<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Neon history timeline</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #08080b; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #08080b; font-family: "Fredoka", sans-serif; }
  svg { position: absolute; inset: 0; }
.yr{position:absolute;top:92px;width:340px;text-align:center;font:900 124px/1 "Playfair Display",serif;color:#ff3d9a;letter-spacing:-2px;text-shadow:0 0 6px #ff3d9a,0 0 26px rgba(255,61,154,.75),0 0 60px rgba(255,61,154,.45);opacity:0}
#next{position:absolute;left:0;right:0;top:250px;text-align:center;font:italic 700 150px/1 "Playfair Display",serif;color:#f2ead8;opacity:0}
#next span{color:#ff3d9a;display:inline-block;padding-right:24px;margin-right:-24px;text-shadow:0 0 8px #ff3d9a,0 0 34px rgba(255,61,154,.7)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
<svg id="s" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<div class="yr" id="y0" style="left:80px">1974</div>
<div class="yr" id="y1" style="left:480px">1996</div>
<div class="yr" id="y2" style="left:880px">2019</div>
<div id="next">Next: <span>the sky</span></div>
</div>
<script>
(function () {
var NS = "http://www.w3.org/2000/svg", s = document.getElementById("s");
function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); (p || s).appendChild(e); return e; }
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var R = rng(3);
var tl = gsap.timeline({ paused: true });
var defs = el("defs", {});
function wob(pts, amp, step) {
  var out = [pts[0]], i, k;
  for (i = 1; i < pts.length; i++) {
    var a = pts[i - 1], b = pts[i], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy), n = Math.max(1, Math.round(L / step));
    for (k = 1; k <= n; k++) { var f = k / n; out.push([a[0] + dx * f + (R() - .5) * 2 * amp, a[1] + dy * f + (R() - .5) * 2 * amp]); }
  }
  var d = "M" + out[0][0].toFixed(1) + " " + out[0][1].toFixed(1);
  for (i = 0; i < out.length - 1; i++) {
    var p0 = out[Math.max(0, i - 1)], p1 = out[i], p2 = out[i + 1], p3 = out[Math.min(out.length - 1, i + 2)];
    d += " C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + " " + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + " " + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + " " + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
  }
  return d;
}
function arc(cx, cy, rx, ry, a0, a1, n) { var p = []; for (var i = 0; i <= n; i++) { var t = (a0 + (a1 - a0) * i / n) * Math.PI / 180, q = 1 + (R() - .5) * .06; p.push([cx + Math.cos(t) * rx * q, cy + Math.sin(t) * ry * q]); } return p; }
function box(x, y, w, h) { return [[x - 6, y + 1], [x + w + 4, y - 1], [x + w + 1, y + h + 3], [x - 3, y + h - 1], [x + 1, y - 9]]; }
// draw-on stroke. o: parent, amp, single, raw(d string), ease, fill (fades in), op (opacity), cap
function stroke(pts, color, w, t, dur, o) {
  o = o || {}; var par = o.parent || art;
  var d = o.raw ? pts : wob(pts, o.amp == null ? 2.2 : o.amp, 34), made = [];
  var passes = o.single ? [[w, 1, d]] : [[w, 1, d], [w * .5, .75, o.raw ? pts : wob(pts, (o.amp == null ? 2.2 : o.amp) * 1.2, 30)]];
  passes.forEach(function (p, i) {
    var path = el("path", { d: p[2], fill: "none", stroke: color, "stroke-width": p[0], "stroke-linecap": "round", "stroke-linejoin": "round", opacity: (o.op == null ? 1 : o.op) * p[1] }, par);
    var L = path.getTotalLength();
    path.style.strokeDasharray = L + " " + (L + 30); path.style.strokeDashoffset = L + 4;
    tl.to(path, { strokeDashoffset: 0, duration: dur * (i ? 1.12 : 1), ease: o.ease || "power1.inOut" }, t + (i ? .05 : 0));
    made.push(path);
  });
  if (o.fill) {
    var f = el("path", { d: d, fill: o.fill, stroke: "none", opacity: 0 }, par);
    par.insertBefore(f, made[0]);
    tl.to(f, { opacity: o.fillOp == null ? 1 : o.fillOp, duration: Math.max(.15, dur * .5) }, t + dur * .55);
    made.push(f);
  }
  return made;
}
var cid = 0;
function write(str, x, y, size, color, t, dur, rot, weight, font, par, anchor) {
  par = par || art;
  var g = el("g", rot ? { transform: "rotate(" + rot + " " + x + " " + y + ")" } : {}, par);
  var id = "cl" + (cid++), cp = el("clipPath", { id: id }, defs);
  var w = str.length * size * .6 + 30, x0 = anchor === "middle" ? x - w / 2 : x;
  var rc = el("rect", { x: x0 - 10, y: y - size * 1.1, width: 0, height: size * 1.5 }, cp);
  var tx = el("text", { x: x, y: y, "font-size": size, "font-weight": weight || 600, fill: color, "clip-path": "url(#" + id + ")", "font-family": font || "Fredoka, Quicksand, sans-serif", "text-anchor": anchor || "start" }, g);
  tx.textContent = str;
  tl.to(rc, { attr: { width: w + 20 }, duration: dur, ease: "none" }, t);
  return g;
}
function pop(node, t, dur, ox, oy, ease, rot) {
  tl.fromTo(node, { scale: 0, rotation: rot == null ? -14 : rot, svgOrigin: ox + " " + oy }, { scale: 1, rotation: 0, svgOrigin: ox + " " + oy, duration: dur || .4, ease: ease || "back.out(2.6)" }, t);
}
function fadeIn(node, t, dur) { tl.fromTo(node, { opacity: 0 }, { opacity: 1, duration: dur || .3, ease: "power1.out" }, t); }
function finish() { window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.set({}, {}, 5); }

var IV = "#f2ead8", NEON = "#ff3d9a";
var art = el("g", {});
tl.timeScale(1);
function poly(pts, color, w, t, dur, closed, o) {
  var d = "M" + pts.map(function (p) { return p[0] + " " + p[1]; }).join(" L") + (closed ? " Z" : "");
  return stroke(d, color, w, t, dur, Object.assign({ raw: true, single: true, ease: "power2.inOut" }, o || {}));
}
// fine paper grid (blockframe)
var gd = "";
for (var gx = 0; gx <= 1280; gx += 40) gd += "M" + gx + " 0V720";
for (var gy = 0; gy <= 720; gy += 40) gd += "M0 " + gy + "H1280";
var grid = el("path", { d: gd, stroke: IV, "stroke-width": .6, opacity: .07, fill: "none" });
// frames for each column
var cols = [240, 640, 1040], FY = 70, FH = 520;
cols.forEach(function (cx, i) {
  poly([[cx - 170, FY], [cx + 170, FY], [cx + 170, FY + FH], [cx - 170, FY + FH]], IV, 1.5, .0 + i * .9, .5, true, { op: .85 });
  poly([[cx - 170, 250], [cx + 170, 250]], IV, 1, .2 + i * .9, .35, false, { op: .5 });
});
// timeline
poly([[0, 626], [1280, 626]], IV, 1.5, 0, 3.0, false, { ease: "none" });
cols.forEach(function (cx, i) {
  var tt = .35 + i * .9;
  var d = el("circle", { cx: cx, cy: 626, r: 11, fill: "#08080b", stroke: NEON, "stroke-width": 2.5 });
  tl.fromTo(d, { scale: 0, svgOrigin: cx + " 626" }, { scale: 1, svgOrigin: cx + " 626", duration: .3, ease: "back.out(3)" }, tt + .3);
  poly([[cx, 590], [cx, 615]], IV, 1.5, tt + .35, .2, false);
});
// line drawings (hairline, accent on one detail each)
function A(i) { return 0.55 + i * .9; }
// 1 workshop
var cx = 240, t0 = A(0), b = 540;
poly([[cx - 100, b], [cx - 100, 430], [cx + 100, 430], [cx + 100, b]], IV, 1.8, t0, .6, false);
poly([[cx - 120, 432], [cx, 350], [cx + 120, 432]], IV, 1.8, t0 + .15, .5, false);
poly([[cx - 32, b], [cx - 32, 470], [cx + 32, 470], [cx + 32, b]], IV, 1.5, t0 + .35, .35, false);
poly([[cx + 52, 450], [cx + 84, 450], [cx + 84, 482], [cx + 52, 482]], NEON, 1.8, t0 + .45, .3, true);
poly([[cx - 84, 450], [cx - 52, 450], [cx - 52, 482], [cx - 84, 482]], IV, 1.5, t0 + .45, .3, true);
poly([[cx + 62, 392], [cx + 62, 340], [cx + 84, 340], [cx + 84, 404]], IV, 1.5, t0 + .3, .3, false);
poly([[cx - 140, b], [cx + 140, b]], IV, 1.8, t0, .4, false);
// gear on gable
var gearPts = [];
for (var gi = 0; gi < 16; gi++) { var ga = gi * Math.PI / 8, gr = gi % 2 ? 17 : 24; gearPts.push([cx + Math.cos(ga) * gr, 410 + Math.sin(ga) * gr]); }
// 2 factory
cx = 640; t0 = A(1);
poly([[cx - 140, b], [cx - 140, 430], [cx - 80, 380], [cx - 80, 430], [cx - 20, 380], [cx - 20, 430], [cx + 40, 380], [cx + 40, b]], IV, 1.8, t0, .8, false);
poly([[cx + 70, b], [cx + 70, 330], [cx + 106, 330], [cx + 106, b]], IV, 1.8, t0 + .2, .5, false);
poly([[cx + 140, b], [cx - 160, b]], IV, 1.8, t0, .4, false);
[[-110, 470], [-50, 470], [10, 470]].forEach(function (w, i) { poly([[cx + w[0], w[1]], [cx + w[0] + 36, w[1]], [cx + w[0] + 36, w[1] + 34], [cx + w[0], w[1] + 34]], i === 1 ? NEON : IV, 1.6, t0 + .4 + i * .08, .3, true); });
poly(arcPts(cx + 88, 308, 14, 10), IV, 1.3, t0 + .7, .35, false, { op: .8 });
poly(arcPts(cx + 98, 270, 20, 14), IV, 1.3, t0 + .8, .35, false, { op: .6 });
poly(arcPts(cx + 114, 224, 26, 18), IV, 1.3, t0 + .9, .35, false, { op: .4 });
function arcPts(x, y, r, n) { var p = []; for (var k = 0; k <= 12; k++) { var a = k / 12 * Math.PI * 2; p.push([x + Math.cos(a) * r * (1 + k * .01), y - k * 2 + Math.sin(a) * r * .5]); } return p.slice(0, 9); }
// 3 campus
cx = 1040; t0 = A(2);
poly([[cx - 140, b], [cx + 140, b]], IV, 1.8, t0, .4, false);
poly([[cx - 130, b], [cx - 130, 410], [cx - 56, 410], [cx - 56, b]], IV, 1.8, t0 + .05, .5, false);
poly([[cx - 40, b], [cx - 40, 300], [cx + 40, 300], [cx + 40, b]], IV, 1.8, t0 + .15, .6, false);
poly([[cx + 56, b], [cx + 56, 430], [cx + 130, 430], [cx + 130, b]], IV, 1.8, t0 + .25, .5, false);
poly([[cx, 300], [cx, 262]], IV, 1.5, t0 + .6, .2, false);
poly(arcPts2(cx, 252, 10), NEON, 2, t0 + .7, .25, true);
function arcPts2(x, y, r) { var p = []; for (var k = 0; k < 10; k++) { var a = k / 10 * Math.PI * 2; p.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); } return p; }
for (var wr = 0; wr < 5; wr++) { poly([[cx - 28, 330 + wr * 40], [cx + 28, 330 + wr * 40]], wr === 2 ? NEON : IV, 1.2, t0 + .45 + wr * .05, .25, false, { op: .8 }); }
for (var wr2 = 0; wr2 < 3; wr2++) { poly([[cx - 112, 436 + wr2 * 30], [cx - 74, 436 + wr2 * 30]], IV, 1.2, t0 + .45 + wr2 * .05, .25, false, { op: .7 }); poly([[cx + 74, 456 + wr2 * 26], [cx + 112, 456 + wr2 * 26]], IV, 1.2, t0 + .5 + wr2 * .05, .25, false, { op: .7 }); }
// years: neon spin-in
[0, 1, 2].forEach(function (i) {
  var n = document.getElementById("y" + i), t = .15 + i * .9;
  tl.fromTo(n, { rotationY: -170, scale: 1.7, opacity: 0, transformPerspective: 900, y: -20 }, { rotationY: 0, scale: 1, opacity: 1, transformPerspective: 900, y: 0, duration: .55, ease: "back.out(1.5)" }, t);
  // landing shockwave
  var cxx = cols[i] , ring = el("ellipse", { cx: cxx, cy: 170, rx: 30, ry: 12, fill: "none", stroke: NEON, "stroke-width": 2, opacity: 0 });
  ring.setAttribute("opacity", 0);
  tl.fromTo(ring, { attr: { rx: 40, ry: 16 }, opacity: .9 }, { attr: { rx: 190, ry: 60 }, opacity: 0, duration: .5, ease: "power2.out", immediateRender: false }, t + .48);
});
// camera thump on each landing
[.63, 1.53, 2.43].forEach(function (t) {
  tl.fromTo("#root", { y: 0 }, { y: 7, duration: .06, ease: "power2.out" }, t);
  tl.to("#root", { y: 0, duration: .22, ease: "elastic.out(1,.4)" }, t + .06);
});
// final: columns recede, closing line
tl.to([art, grid], { opacity: .22, duration: .5, ease: "power2.inOut" }, 3.5);
tl.to(".yr", { opacity: .3, duration: .5, ease: "power2.inOut" }, 3.5);
tl.fromTo("#next", { opacity: 0, scale: .88, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: .6, ease: "power3.out" }, 3.6);
tl.fromTo("#next span", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: .6, ease: "power2.inOut" }, 3.9);

finish();
})();
</script>
</body>
</html>
