<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Article to lesson</title>
<script src="vendor/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#f8fafd}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:#f8fafd;font-family:'Inter',sans-serif}
svg{position:absolute;inset:0}
text{font-family:'Inter',sans-serif;font-weight:800}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720">
<svg id="s" width="1280" height="720" viewBox="0 0 1280 720"></svg>
</div>
<script>
(function(){
var NS="http://www.w3.org/2000/svg",s=document.getElementById("s");
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||s).appendChild(e);return e}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var R=rng(31),NAVY="#12233f",TEAL="#0ea5a4",ORG="#f97316",SKY="#dbeafe",GRID="#e4eaf4",GREY="#c5d0e2";
var d="",i;for(i=0;i<=1280;i+=40)d+="M"+i+" 0V720";for(i=0;i<=720;i+=40)d+="M0 "+i+"H1280";
el("path",{d:d,stroke:GRID,"stroke-width":1.2,fill:"none"});
// axes
el("path",{d:"M440 24V700M24 660H1260",stroke:"#aebbd3","stroke-width":2.5,fill:"none"});
var tk="";for(i=480;i<1260;i+=80)tk+="M"+i+" 654V666";for(i=100;i<660;i+=80)tk+="M434 "+i+"H446";
el("path",{d:tk,stroke:"#aebbd3","stroke-width":2.5,fill:"none"});
var tl=gsap.timeline({paused:true});
// ---- article sheet
var SH=el("g",{});
el("rect",{x:64,y:72,width:340,height:520,rx:16,fill:"#0b1b3a",opacity:.10,transform:"translate(8 12)"},SH);
el("rect",{x:64,y:72,width:340,height:520,rx:16,fill:"#fff",stroke:"#d3dcec","stroke-width":2.5},SH);
el("rect",{x:94,y:104,width:230,height:20,rx:10,fill:NAVY},SH);
el("rect",{x:94,y:134,width:140,height:12,rx:6,fill:ORG},SH);
var hl=[];
for(i=0;i<15;i++){var y=176+i*26,w=i%4==3?200:270+R()*0;
 if([2,5,8,11].indexOf(i)>=0){var h=el("rect",{x:90,y:y-9,width:280,height:22,rx:6,fill:"#fde68a"},SH);hl.push({el:h,y:y});}
 el("rect",{x:94,y:y,width:w-i%3*14,height:8,rx:4,fill:GREY},SH)}
// ---- cards
var cards=[],names=["Meet","Match","Remember","Defend"];
function spikes(g,cx,cy,r,col,n,len){for(var k=0;k<n;k++){var a=k/n*Math.PI*2;el("path",{d:"M"+(cx+Math.cos(a)*r)+" "+(cy+Math.sin(a)*r)+"L"+(cx+Math.cos(a)*(r+len))+" "+(cy+Math.sin(a)*(r+len)),stroke:col,"stroke-width":5,"stroke-linecap":"round"},g);el("circle",{cx:cx+Math.cos(a)*(r+len),cy:cy+Math.sin(a)*(r+len),r:5,fill:col},g)}}
function virus(g,cx,cy,sc){var v=el("g",{},g);el("circle",{cx:cx,cy:cy,r:30*sc,fill:ORG},v);spikes(v,cx,cy,30*sc,ORG,10,15*sc);el("circle",{cx:cx-8*sc,cy:cy-6*sc,r:5*sc,fill:"#fed7aa"},v);return v}
function yAb(g,cx,cy){var a=el("g",{},g);el("path",{d:"M"+cx+" "+(cy+22)+"V"+cy+"M"+cx+" "+cy+"L"+(cx-16)+" "+(cy-20)+"M"+cx+" "+cy+"L"+(cx+16)+" "+(cy-20),stroke:TEAL,"stroke-width":8,"stroke-linecap":"round",fill:"none"},a);return a}
var CW=365,CH=270,pos=[[470,64],[860,64],[470,350],[860,350]];
var diag=[];
pos.forEach(function(p,c){var x=p[0],y=p[1],g=el("g",{});
 el("rect",{x:x,y:y,width:CW,height:CH,rx:20,fill:"#0b1b3a",opacity:.08,transform:"translate(6 10)"},g);
 el("rect",{x:x,y:y,width:CW,height:CH,rx:20,fill:"#fff",stroke:"#d3dcec","stroke-width":2.5},g);
 el("circle",{cx:x+42,cy:y+44,r:22,fill:[ORG,TEAL,NAVY,ORG][c]},g);
 var n=el("text",{x:x+42,y:y+53,"font-size":26,fill:"#fff","text-anchor":"middle"},g);n.textContent=c+1;
 var t=el("text",{x:x+78,y:y+58,"font-size":42,fill:NAVY},g);t.textContent=names[c];
 var D=el("g",{},g),cx=x+CW/2,cy=y+170;
 if(c==0){var v=virus(D,cx,cy,1.5);diag.push({v:v,cx:cx,cy:cy})}
 if(c==1){virus(D,cx,cy,1.1);var ys=[];[[-72,-34,-1],[72,-34,1],[0,66,0]].forEach(function(q){var yy=yAb(D,cx+q[0],cy+q[1]);ys.push({g:yy,q:q})});diag.push({ys:ys,cx:cx,cy:cy})}
 if(c==2){var cs=[];[-90,0,90].forEach(function(dx,k){var m=el("g",{},D);el("circle",{cx:cx+dx,cy:cy,r:34,fill:TEAL},m);el("circle",{cx:cx+dx+8,cy:cy-6,r:12,fill:"#99f6e4"},m);cs.push({g:m,dx:dx})});diag.push({cs:cs,cx:cx,cy:cy})}
 if(c==3){var sh=el("g",{},D);el("path",{d:"M"+cx+" "+(cy-62)+"L"+(cx+50)+" "+(cy-42)+"V"+(cy+8)+"Q"+(cx+50)+" "+(cy+50)+" "+cx+" "+(cy+68)+"Q"+(cx-50)+" "+(cy+50)+" "+(cx-50)+" "+(cy+8)+"V"+(cy-42)+"Z",fill:NAVY},sh);
  var ck=el("path",{d:"M"+(cx-22)+" "+cy+"L"+(cx-6)+" "+(cy+18)+"L"+(cx+24)+" "+(cy-18),stroke:"#fff","stroke-width":10,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"},sh);
  var dots=[];[[-150,-20],[150,-30],[-130,50]].forEach(function(q){dots.push({e:el("circle",{cx:cx+q[0],cy:cy+q[1],r:12,fill:ORG},D),q:q})});diag.push({sh:sh,ck:ck,dots:dots,cx:cx,cy:cy})}
 cards.push({g:g,x:x,y:y,D:D})});
// ---- title
var T=el("text",{x:64,y:668,"font-size":66,fill:NAVY},s);T.textContent="4 ideas.";
var TU=el("path",{d:"M68 686H300",stroke:ORG,"stroke-width":8,"stroke-linecap":"round"},s);
// ---- timeline
tl.from(SH,{y:30,opacity:0,duration:.4,ease:"power3.out"},0);
hl.forEach(function(h,k){tl.from(h.el,{scaleX:0,transformOrigin:"0 50%",svgOrigin:"90 "+(h.y),duration:.35,ease:"power2.out"},.15+k*.12)});
var times=[1.0,1.7,2.4,3.1];
cards.forEach(function(c,k){
 var t0=times[k];
 tl.from(c.g,{opacity:0,scale:.9,svgOrigin:(c.x+CW/2)+" "+(c.y+CH/2),duration:.45,ease:"back.out(1.6)"},t0);
 // flying highlight pill
 var h=hl[k],pill=el("rect",{x:90,y:h.y-9,width:280,height:22,rx:6,fill:"#fde68a",opacity:0},s);
 tl.set(pill,{opacity:1},t0-.35).set(h.el,{opacity:.35},t0-.35);
 tl.to(pill,{attr:{x:c.x+60,y:c.y+30,width:80,height:28},duration:.4,ease:"power3.inOut"},t0-.35);
 tl.to(pill,{opacity:0,duration:.15},t0+.05);
 });
// diagram motion
var D0=diag[0];tl.fromTo(D0.v,{x:-150,opacity:0},{x:0,opacity:1,duration:.7,ease:"power3.out"},1.15);
tl.to(D0.v,{scale:1.12,svgOrigin:D0.cx+" "+D0.cy,duration:.5,yoyo:true,repeat:5,ease:"sine.inOut"},1.9);
var D1=diag[1];D1.ys.forEach(function(y,k){tl.from(y.g,{x:y.q[0]*1.9,y:y.q[1]*1.9-30,rotation:k*50-50,svgOrigin:(D1.cx+y.q[0])+" "+(D1.cy+y.q[1]),opacity:0,duration:.6,ease:"back.out(1.7)"},1.85+k*.12)});
var D2=diag[2];D2.cs.forEach(function(c,k){if(c.dx!==0)tl.from(c.g,{x:-c.dx,opacity:0,scale:.3,svgOrigin:(D2.cx+c.dx)+" "+D2.cy,duration:.6,ease:"back.out(1.8)"},2.75+(k?0.1:0))});
tl.from(D2.cs[1].g,{scale:.5,svgOrigin:D2.cx+" "+D2.cy,duration:.4,ease:"back.out(2)"},2.5);
var D3=diag[3];tl.from(D3.sh,{scale:0,svgOrigin:D3.cx+" "+D3.cy,duration:.45,ease:"back.out(2)"},3.2);
var ckL=D3.ck.getTotalLength();gsap.set(D3.ck,{strokeDasharray:ckL,strokeDashoffset:ckL});tl.to(D3.ck,{strokeDashoffset:0,duration:.35,ease:"power2.out"},3.55);
D3.dots.forEach(function(d,k){var s0=d.q[0]<0?1:-1;tl.from(d.e,{x:-s0*60,opacity:0,duration:.3},3.3+k*.1);tl.to(d.e,{x:s0*50,y:(k-1)*30,opacity:.0,duration:.6,ease:"power2.out"},3.9+k*.1)});
// title
tl.from(T,{x:-30,opacity:0,duration:.45,ease:"power3.out"},3.9);
var tul=TU.getTotalLength();gsap.set(TU,{strokeDasharray:tul,strokeDashoffset:tul});tl.to(TU,{strokeDashoffset:0,duration:.4,ease:"power2.out"},4.15);
tl.to(SH,{opacity:.55,duration:.4},3.9);
tl.to({},{duration:.01},4.99);
window.__timelines={main:tl};
})();
</script></body></html>
