<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Shard logo assembly</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #0f0f12; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0f0f12; font-family: "Playfair Display", serif; color: #f4efe6; }
  svg { position: absolute; inset: 0; }
  #name { position: absolute; left: 0; right: 0; top: 500px; text-align: center; font-size: 104px; letter-spacing: 0.22em; padding-left: 0.22em; font-weight: 400; white-space: nowrap; }
  #name i { font-style: normal; opacity: 0; display: inline-block; }
  #cur { display: inline-block; width: 4px; height: 84px; background: #ff5a3c; vertical-align: -8px; margin-left: 10px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
<svg id="s" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<div id="name"><i>F</i><i>A</i><i>C</i><i>E</i><i>T</i><i>L</i><i>Y</i></div>
</div>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg", s = document.getElementById("s");
  function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); (p || s).appendChild(e); return e; }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var R = rng(77), CORAL = "#ff5a3c";
  // faint dotted ground
  var d = "";
  for (var gx = 40; gx < 1280; gx += 80) for (var gy = 40; gy < 720; gy += 80) d += "M" + gx + " " + gy + "h1";
  el("path", { d: d, stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round", opacity: 0.12 });

  var og = el("g", { transform: "translate(640 270)" }); var g = el("g", {}, og);
  // icon background (hidden until the shards have landed)
  var icon = el("rect", { x: -190, y: -190, width: 380, height: 380, rx: 84, fill: CORAL }, g);
  // low-poly gem: outer ring + two inner points
  var C = [0, 14];
  var out = [], i;
  for (i = 0; i < 7; i++) { var a = -Math.PI / 2 + i * 2 * Math.PI / 7 + 0.0; var rr = (i % 2 ? 128 : 142); out.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.96]); }
  var inner = [[-34, -26], [40, -10], [6, 56]];
  var tris = [
    [out[0], out[1], inner[1]], [out[1], out[2], inner[1]], [out[2], out[3], inner[2]], [out[3], out[4], inner[2]],
    [out[4], out[5], inner[0]], [out[5], out[6], inner[0]], [out[6], out[0], inner[0]],
    [out[0], inner[1], inner[0]], [inner[1], out[2], inner[2]], [inner[2], out[4], inner[0]], [inner[0], inner[1], inner[2]]
  ];
  var tones = ["#f7f1e6", "#e8dfcc", "#fffaf0", "#d9cdb5", "#f1e8d6", "#cfc3aa", "#fffdf6", "#e2d8c1", "#f4ecdb", "#dcd0b9", "#ffffff"];
  var wire = el("g", { fill: "none", stroke: "#f4efe6", "stroke-width": 1.4, "stroke-linejoin": "round" }, g);
  var shards = [], tl = gsap.timeline({ paused: true });
  tris.forEach(function (t, j) {
    var pd = "M" + t.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("L") + "Z";
    var w = el("path", { d: pd }, wire);
    var L = 420; w.style.strokeDasharray = L; w.style.strokeDashoffset = L;
    tl.to(w, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut" }, 0 + j * 0.06);
    var sh = el("path", { d: pd, fill: tones[j], stroke: CORAL, "stroke-width": 0.8, "stroke-linejoin": "round" }, g);
    var ang = R() * Math.PI * 2, dist = 700 + R() * 300;
    var cx = (t[0][0] + t[1][0] + t[2][0]) / 3, cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
    
    var t0 = 1.0 + j * 0.15;
    tl.fromTo(sh, { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist * 0.7, rotation: (R() - .5) * 420, scale: 0.4, opacity: 0, svgOrigin: cx + " " + cy },
      { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, t0);
    tl.fromTo(sh, { scale: 1 }, { scale: 1, duration: 0.01 }, t0 + 0.5);
    // settle: a small overshoot rock
    tl.to(sh, { rotation: (j % 2 ? 1 : -1) * 3, duration: 0.09, ease: "sine.out" }, t0 + 0.5);
    tl.to(sh, { rotation: 0, duration: 0.18, ease: "elastic.out(1,0.45)" }, t0 + 0.59);
    shards.push(sh);
  });
  // wireframe fades once the shards are in
  tl.to(wire, { opacity: 0.0, duration: 0.5 }, 2.9);
  // icon background pops in behind, logo group scales to its lockup
  tl.set(icon, { opacity: 0 }, 0);
  tl.fromTo(icon, { scale: 0.2, opacity: 0, rotation: -12, svgOrigin: "0 0" }, { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(1.6)" }, 3.05);
  
  tl.fromTo(g, { scale: 1.25, y: 0, svgOrigin: "0 0" }, { scale: 0.9, duration: 0.7, ease: "power3.inOut" }, 3.0);
  // brand name types
  var lets = document.querySelectorAll("#name i");
  lets.forEach(function (l, j) { tl.fromTo(l, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.12 }, 3.55 + j * 0.13); });
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  // initial scale
  
})();
</script>
</body>
</html>
