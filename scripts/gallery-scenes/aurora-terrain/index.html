<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Aurora terrain</title>
<script src="vendor/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#f3c9d5}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:#f3c9d5;font-family:'Space Grotesk',Arial,sans-serif}
canvas{position:absolute;inset:0;width:1280px;height:720px;display:block}
#cap{position:absolute;left:0;right:0;bottom:52px;text-align:center;color:#fff;font-weight:700;font-size:88px;letter-spacing:-2px;text-shadow:0 4px 30px rgba(120,60,110,.55);opacity:0}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720">
<canvas id="c"></canvas>
<div id="cap">New world, new dawn</div>
</div>
<script type="module">
import * as THREE from "./vendor/three/three.module.js";
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(23);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("c"),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(1280,720,false);
const scene=new THREE.Scene();
const FOG=0xf4c6cf;
scene.fog=new THREE.Fog(FOG,45,150);
// sky gradient dome
const sky=new THREE.Mesh(new THREE.SphereGeometry(200,24,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 uniforms:{},vertexShader:"varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
 fragmentShader:"varying vec3 p;void main(){float h=clamp(p.y,0.,1.);vec3 a=vec3(.96,.78,.80),b=vec3(.97,.84,.74),c=vec3(.52,.55,.86);vec3 col=mix(a,b,smoothstep(0.,.12,h));col=mix(col,c,smoothstep(.1,.75,h));gl_FragColor=vec4(col,1.);}"}));
scene.add(sky);
const sunDisc=new THREE.Mesh(new THREE.CircleGeometry(14,40),new THREE.MeshBasicMaterial({color:0xfff0c8,fog:false}));
sunDisc.position.set(-35,30,-170);scene.add(sunDisc);
const halo=new THREE.Mesh(new THREE.CircleGeometry(38,40),new THREE.MeshBasicMaterial({color:0xffd6a8,transparent:true,opacity:.35,fog:false,depthWrite:false}));
halo.position.set(-35,30,-171);scene.add(halo);
// terrain
const ph=[0,1,2,3,4,5,6,7].map(()=>R()*6.28);
function H(x,z){
 let h=Math.sin(x*.09+ph[0])*Math.cos(z*.07+ph[1])*5.5+Math.sin(x*.18+z*.11+ph[2])*2.6+Math.cos(x*.31-z*.23+ph[3])*1.2+Math.sin(z*.05+ph[4])*3;
 const valley=Math.exp(-Math.pow(x/9,2));h*=1-.65*valley;
 return h+2;
}
const W=200,Dp=240,sx=120,sz=140;
const g=new THREE.PlaneGeometry(W,Dp,sx,sz);g.rotateX(-Math.PI/2);
const p=g.attributes.position;
for(let i=0;i<p.count;i++)p.setY(i,H(p.getX(i),p.getZ(i)-20));
let ng=g.toNonIndexed();ng.computeVertexNormals();
const pp=ng.attributes.position,cols=new Float32Array(pp.count*3);
const pal=[new THREE.Color(0xc9a5d8),new THREE.Color(0x9fd3b0),new THREE.Color(0xf3b79a),new THREE.Color(0xf8e1ad)];
for(let i=0;i<pp.count;i+=3){
 const cy=(pp.getY(i)+pp.getY(i+1)+pp.getY(i+2))/3,cx=(pp.getX(i)+pp.getX(i+1)+pp.getX(i+2))/3;
 const t=Math.min(1,Math.max(0,(cy+8)/20));
 const c=new THREE.Color();
 const pa=Math.sin(cx*.05+cy*.2)*.5+.5;if(t<.35)c.copy(pal[1]).lerp(pal[0],pa*.35);else if(t<.6)c.copy(pal[1]).lerp(pal[3],(t-.35)/.25);else if(t<.8)c.copy(pal[3]).lerp(pal[2],(t-.6)/.2);else c.copy(pal[2]).lerp(pal[0],(t-.8)/.2);
 const j=(R()-.5)*.07;c.offsetHSL(0,0,j);
 for(let k=0;k<3;k++){cols[(i+k)*3]=c.r;cols[(i+k)*3+1]=c.g;cols[(i+k)*3+2]=c.b}}
ng.setAttribute("color",new THREE.BufferAttribute(cols,3));
const terrain=new THREE.Mesh(ng,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true}));
terrain.position.z=-20;scene.add(terrain);
// lights
scene.add(new THREE.HemisphereLight(0xffe6e0,0xb9a0d0,1.55));
const sunL=new THREE.DirectionalLight(0xffcf9a,2.2);sunL.position.set(-35,20,-60);scene.add(sunL);
// clouds
const clouds=[];
const cm=new THREE.MeshLambertMaterial({color:0xfff3ef,flatShading:true,emissive:0xf6d2d6,emissiveIntensity:.35});
for(let i=0;i<14;i++){
 const gr=new THREE.Group();const n=3+Math.floor(R()*3);
 for(let k=0;k<n;k++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(2.5+R()*2.5,1),cm);m.position.set((k-n/2)*3.2+R()*1.5,R()*1.2,R()*2);m.scale.y=.55;gr.add(m)}
 gr.userData={x:(R()-.5)*160,y:22+R()*14,z:-90+R()*60-10,sp:.6+R()*.8};
 scene.add(gr);clouds.push(gr)}
// aurora ribbon
const rib=new THREE.PlaneGeometry(150,16,60,6);
const rc=new Float32Array(rib.attributes.position.count*3);rib.setAttribute("color",new THREE.BufferAttribute(rc,3));
const ribM=new THREE.Mesh(rib,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:.45,depthWrite:false,side:THREE.DoubleSide,fog:false}));
ribM.position.set(10,38,-120);scene.add(ribM);
const base=rib.attributes.position.array.slice();
function ribbon(t){const a=rib.attributes.position,c=rib.attributes.color;
 for(let i=0;i<a.count;i++){const x=base[i*3],y=base[i*3+1];
  a.setZ(i,Math.sin(x*.06+t*.7)*6);a.setY(i,y+Math.sin(x*.05+t*.5)*5);
  const v=(y+8)/16,f=Math.sin(x*.08+t*.4)*.5+.5;
  const al=.55+.45*Math.sin(v*Math.PI),r=(.45+.35*f)*al+(1-al)*.85,gg=(.85-.3*f)*al+(1-al)*.8,b=.85*al+(1-al)*.78;
  c.setXYZ(i,r,gg,b)}
 a.needsUpdate=true;c.needsUpdate=true}
const camera=new THREE.PerspectiveCamera(55,1280/720,.1,400);
const e=t=>t*t*(3-2*t);
function draw(t){
 const k=t/5;
 const cx=Math.sin(k*1.4)*4-1,cz=30-k*34;
 const cy=Math.max(H(cx,cz)+5,12)+Math.sin(k*3)*.4;
 camera.position.set(cx,cy,cz);
 camera.lookAt(cx+Math.sin(k*2)*3,cy-6.5,cz-30);
 clouds.forEach(c=>{const d=c.userData;c.position.set(((d.x+t*d.sp*2+110)%220)-110,d.y+Math.sin(t*.8+d.x)*.4,d.z)});
 ribbon(t);
 renderer.render(scene,camera);
}
window.addEventListener("hf-seek",ev=>draw(ev.detail.time));
draw(window.__hfThreeTime||0);
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.fromTo("#cap",{opacity:0,y:26},{opacity:1,y:0,duration:.7,ease:"power2.out"},1.6).to({},{duration:5},0);
window.__timelines["main"]=tl;
</script></body></html>
