<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Beat-locked briefing ad</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #e8341c; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #e8341c; font-family: "Archivo Black", "Inter", sans-serif; color: #111; }
  .abs { position: absolute; }
  #cream { left: -260px; top: -540px; width: 1800px; height: 1800px; border-radius: 50%; background: #f4efe6; transform: scale(0); }
  #safe { left: 438px; top: 14px; width: 404px; height: 660px; border: 3px dashed rgba(17,17,17,.45); border-radius: 26px; }
  #cap { left: 438px; width: 404px; top: 40px; text-align: center; font-size: 66px; line-height: .98; letter-spacing: -.03em; text-transform: uppercase; color: #fff; }
  #cap2 { left: 438px; width: 404px; top: 40px; text-align: center; font-size: 66px; line-height: .98; letter-spacing: -.03em; text-transform: uppercase; color: #111; }
  #cap2 b { color: #e8341c; font-weight: 400; }
  .chip { position: absolute; left: 470px; top: 0; width: 340px; height: 88px; background: #fff; border: 4px solid #111; border-radius: 18px; box-shadow: 6px 6px 0 #111; }
  .chip i { position: absolute; left: 14px; top: 14px; width: 48px; height: 48px; border-radius: 10px; }
  .chip u { position: absolute; left: 78px; height: 14px; border-radius: 7px; background: #111; }
  .chip u + u { background: #bdb6a6; height: 10px; }
  #stack { left: 0; top: 0; width: 1280px; height: 720px; }
  #ring { left: 70px; top: 190px; width: 320px; height: 320px; }
  .rg { left: 70px; top: 190px; width: 320px; height: 320px; border-radius: 50%; border: 8px solid #111; }
  #bpm { left: 70px; top: 270px; width: 320px; text-align: center; font-size: 120px; letter-spacing: -.04em; line-height: 1; color: #111; }
  #bpm small { display: block; font-size: 34px; letter-spacing: .08em; margin-top: 4px; }
  .dur { left: 890px; height: 84px; }
  .dur b { position: absolute; left: 0; top: 0; font-size: 70px; line-height: 84px; font-weight: 400; letter-spacing: -.04em; }
  .dur span { position: absolute; left: 112px; top: 18px; height: 48px; border-radius: 10px; background: #111; transform-origin: 0 50%; }
  #tick { left: 60px; top: 690px; width: 1160px; height: 14px; }
  #tick i { position: absolute; top: 0; width: 6px; height: 14px; border-radius: 3px; background: #111; }
  #name { left: 438px; width: 404px; top: 390px; text-align: center; font-size: 140px; letter-spacing: -.05em; line-height: 1; }
  #name em { font-style: normal; color: #e8341c; }
  #tag { left: 438px; width: 404px; top: 535px; text-align: center; font-size: 30px; letter-spacing: -.01em; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
  <div class="abs" id="cream"></div>
  <div class="abs" id="safe"></div>
  <div class="abs rg" id="g1"></div><div class="abs rg" id="g2"></div>
  <div class="abs" id="bpm">120<small>BPM</small></div>
  <div class="abs dur" id="d1" style="top:200px"><b>30</b><span style="width:260px"></span></div>
  <div class="abs dur" id="d2" style="top:310px"><b>15</b><span style="width:130px;background:#e8341c"></span></div>
  <div class="abs dur" id="d3" style="top:420px"><b>6</b><span style="width:52px"></span></div>
  <div class="abs" id="stack"></div>
  <div class="abs" id="cap">Too many<br>headlines</div>
  <div class="abs" id="cap2">One calm<br><b>briefing</b></div>
  <div class="abs" id="name">brief<em>.</em></div>
  <div class="abs" id="tag">Your news, sorted.</div>
  <div class="abs" id="tick"></div>
</div>
<script>
(function () {
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var R = rng(120), stack = document.getElementById("stack"), tick = document.getElementById("tick");
  var cols = ["#e8341c", "#ffc21a", "#111", "#3b6cff", "#ffc21a"];
  var chips = [], N = 16;
  for (var i = 0; i < N; i++) {
    var c = document.createElement("div"); c.className = "chip";
    c.innerHTML = '<i style="background:' + cols[i % 5] + '"></i><u style="top:16px;width:' + (130 + R() * 120 | 0) + 'px"></u><u style="top:44px;width:' + (90 + R() * 130 | 0) + 'px"></u>';
    stack.appendChild(c); chips.push(c);
  }
  for (i = 0; i < 10; i++) { var tk = document.createElement("i"); tk.style.left = (i * 1160 / 10) + "px"; tick.appendChild(tk); }
  var tl = gsap.timeline({ paused: true });
  var ticks = tick.children;
  tl.set(["#cap2", "#name", "#tag", "#d1", "#d2", "#d3", "#g1", "#g2"], { opacity: 0 }, 0);
  // headlines pile up on each beat
  chips.forEach(function (c, i) {
    var ty = 220 + R() * 360, tx = (R() - .5) * 60, rot = (R() - .5) * 20, t = i * .15;
    tl.set(c, { y: -140, x: tx, rotation: rot * 2 }, 0);
    tl.to(c, { y: ty, rotation: rot, duration: .32, ease: "power3.out" }, t);
  });
  // beat pulses on the 120 bpm grid
  for (i = 0; i < 10; i++) {
    var b = i * .5;
    tl.fromTo(ticks[i], { backgroundColor: "#111", scaleY: 1 }, { backgroundColor: "#111", scaleY: 1, duration: .01 }, 0);
    tl.fromTo(ticks[i], { scaleY: 3, height: 14, y: -6, backgroundColor: "#fff" }, { scaleY: 1, y: 0, backgroundColor: "#111", duration: .35, ease: "power3.out" }, b + .01);
    if (b < 2.5) {
      tl.fromTo("#g" + (i % 2 + 1), { opacity: 1, scale: .6 }, { opacity: 0, scale: 1.25, duration: .5, ease: "power2.out" }, b);
      tl.fromTo("#stack", { scale: 1.035 }, { scale: 1, duration: .3, ease: "power2.out", transformOrigin: "640px 360px" }, b);
    }
    tl.fromTo("#bpm", { scale: 1.08 }, { scale: 1, duration: .3, ease: "power2.out" }, b);
  }
  tl.set(ticks[0], { opacity: 1 }, 0);
  // 2.5 s: the calm reveal
  tl.to("#cream", { scale: 1, duration: .5, ease: "power3.in" }, 2.0);
  tl.set("#cap", { opacity: 0 }, 2.35); tl.set("#cap2", { opacity: 1 }, 2.35);
  tl.fromTo("#cap2", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .4, ease: "power4.out" }, 2.4);
  chips.forEach(function (c, i) {
    if (i < 3) {
      tl.to(c, { y: 190 + i * 112, x: 0, rotation: 0, duration: .55, ease: "power4.inOut" }, 2.5 + i * .06);
    } else {
      tl.to(c, { y: 330, x: 0, scale: .2, opacity: 0, rotation: 0, duration: .45, ease: "power3.in" }, 2.45 + (i % 5) * .03);
    }
  });
  tl.set("#stack", { scale: 1 }, 2.5);
  tl.to("#bpm", { color: "#111" }, 2.5);
  [["#d1", 2.5], ["#d2", 3.0], ["#d3", 3.5]].forEach(function (d) {
    tl.fromTo(d[0], { opacity: 1, x: 80 }, { opacity: 1, x: 0, duration: .35, ease: "back.out(2)" }, d[1] + .05);
    tl.fromTo(d[0] + " span", { scaleX: 0 }, { scaleX: 1, duration: .35, ease: "power3.out" }, d[1] + .1);
  });
  // final: briefing becomes the name
  tl.to("#cap2", { y: -80, opacity: 0, duration: .25, ease: "power2.in" }, 3.95);
  [0, 1, 2].forEach(function (i) { var c = chips[i]; tl.to(c, { y: 66 + i * 98, scale: .9, duration: .4, ease: "power3.inOut" }, 4.0); });
  tl.fromTo("#name", { opacity: 1, scale: 1.4, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: .45, ease: "power4.out" }, 4.0);
  tl.fromTo("#tag", { opacity: 1, y: 20 }, { opacity: 1, y: 0, duration: .35, ease: "power3.out" }, 4.25);
  tl.set("#stack", { clipPath: "inset(150px 0px 0px 0px)" }, 0); tl.set("#stack", { clipPath: "inset(0px 0px 0px 0px)" }, 3.9);
  tl.set({}, {}, 5);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
