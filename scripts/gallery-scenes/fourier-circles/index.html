<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fourier circles</title>
<script src="vendor/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0b0d12}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:linear-gradient(180deg,#0b0d12,#101420)}
svg{position:absolute;inset:0}
text{font-family:"Source Serif 4","EB Garamond",serif;fill:#e8ecf4}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720">
<svg id="stage" class="clip" data-start="0" data-duration="5" data-track-index="1" width="1280" height="720" viewBox="0 0 1280 720"></svg>
</div>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("stage");
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
const CX=300,CY=310,K=[1,3,5,7],R=K.map(k=>150*4/(Math.PI*k)),WX=690,SPD=130,COL=["#58C4DD","#83C167","#FFD166","#B189C6"];
// wave axis
const ax=el("line",{x1:WX-30,y1:CY,x2:1250,y2:CY,stroke:"#4d5568","stroke-width":2,pathLength:1,"stroke-dasharray":"1 1","stroke-dashoffset":1});
const tk=el("g",{opacity:0});
for(let i=0;i<=4;i++){el("line",{x1:WX+i*130,y1:CY-7,x2:WX+i*130,y2:CY+7,stroke:"#4d5568","stroke-width":2},tk)}
const guide=el("line",{stroke:"#7d8598","stroke-width":2,"stroke-dasharray":"5 7",opacity:0});
const circs=R.map((r,i)=>{
 const c=el("circle",{r:r,fill:"none",stroke:COL[i],"stroke-width":3,opacity:0.9,pathLength:1,"stroke-dasharray":"1 1","stroke-dashoffset":1,transform:"rotate(-90 0 0)"});
 const ln=el("line",{stroke:COL[i],"stroke-width":3.5,"stroke-linecap":"round",opacity:0});
 const d=el("circle",{r:5,fill:COL[i],opacity:0});
 return {c,ln,d}});
const wave=el("path",{fill:"none",stroke:"#FFD166","stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round"});
const tip=el("circle",{r:10,fill:"#FC6255",opacity:0});
const cap1=el("text",{x:80,y:630,"font-size":58,opacity:0});cap1.textContent="Circles add up";
const cap2=el("text",{x:80,y:690,"font-size":58,opacity:0,"font-style":"italic"});cap2.textContent="to any wave";
function pos(th){let x=CX,y=CY;const p=[[x,y]];
 for(let i=0;i<K.length;i++){x+=R[i]*Math.cos(K[i]*th);y-=R[i]*Math.sin(K[i]*th);p.push([x,y])}return p}
const S={T:0,vis:0,spin:0};
const W=2*Math.PI*0.42;
function render(){
 const th=S.T*W,p=pos(th);
 circs.forEach((o,i)=>{
  o.c.setAttribute("cx",p[i][0]);o.c.setAttribute("cy",p[i][1]);
  o.c.setAttribute("transform","rotate(-90 "+p[i][0]+" "+p[i][1]+")");
  o.ln.setAttribute("x1",p[i][0]);o.ln.setAttribute("y1",p[i][1]);o.ln.setAttribute("x2",p[i+1][0]);o.ln.setAttribute("y2",p[i+1][1]);
  o.d.setAttribute("cx",p[i+1][0]);o.d.setAttribute("cy",p[i+1][1])});
 const t=p[K.length];
 tip.setAttribute("cx",WX);tip.setAttribute("cy",t[1]);
 guide.setAttribute("x1",t[0]);guide.setAttribute("y1",t[1]);guide.setAttribute("x2",WX);guide.setAttribute("y2",t[1]);
 let d="";const n=Math.round(S.T*60);
 const lim=Math.min(n,Math.round(4.6*60));
 for(let i=0;i<=n;i++){const u=i/60,age=S.T-u;if(age*SPD>560)continue;
  const q=pos(u*W)[K.length];d+=(d?"L":"M")+(WX+age*SPD).toFixed(1)+" "+q[1].toFixed(1)}
 wave.setAttribute("d",d||"M0 0");
}
render();
const tl=gsap.timeline({paused:true,defaults:{ease:"power2.inOut"}});
tl.to(ax,{attr:{"stroke-dashoffset":0},duration:0.8},0)
  .to(tk,{opacity:1,duration:0.4},0.5)
  .to(circs.map(o=>o.c),{attr:{"stroke-dashoffset":0},duration:0.9,stagger:0.2},0)
  .to(circs.map(o=>o.ln),{opacity:1,duration:0.3,stagger:0.2},0.5)
  .to(circs.map(o=>o.d),{opacity:1,duration:0.3,stagger:0.2},0.5)
  .to([tip,guide],{opacity:1,duration:0.3},1.0)
  .to([cap1,cap2],{opacity:1,duration:0.5,stagger:0.15},0.3)
  .to(S,{T:4.9,duration:4.9,ease:"none",onUpdate:render},0.1);
tl.eventCallback&&0;
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;
</script></body></html>
