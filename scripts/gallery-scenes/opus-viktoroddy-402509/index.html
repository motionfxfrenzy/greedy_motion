<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Milestone launch announcement</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #0f0d1a; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0f0d1a; font-family: "Inter", sans-serif; color: #fff; }
  #rays, #burst { position: absolute; inset: 0; }
  #num { position: absolute; left: 0; right: 0; top: 40px; display: flex; justify-content: center; align-items: flex-start; font-family: "Archivo Black", "Inter", sans-serif; font-size: 290px; line-height: 290px; color: #ffd21f; transform-origin: 50% 50%; }
  .col { width: 196px; height: 290px; overflow: hidden; }
  .strip > div { height: 290px; text-align: center; }
  #k { margin-left: 6px; color: #ff4d8d; }
  #thanks { position: absolute; left: 0; right: 0; top: 345px; text-align: center; font-weight: 800; font-size: 62px; letter-spacing: -0.03em; }
  #thanks span { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 8px; }
  #thanks i { display: inline-block; font-style: normal; }
  .tile { position: absolute; top: 450px; width: 300px; height: 170px; border-radius: 26px; overflow: hidden; }
  .tile svg { position: absolute; inset: 0; }
  #cta { position: absolute; left: 50%; top: 636px; margin-left: -260px; width: 520px; height: 70px; border-radius: 35px; background: #ffd21f; color: #0f0d1a; font-weight: 800; font-size: 34px; display: flex; align-items: center; justify-content: center; letter-spacing: -0.02em; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
  <svg id="rays" width="1280" height="720" viewBox="0 0 1280 720"></svg>
  <svg id="burst" width="1280" height="720" viewBox="0 0 1280 720"></svg>
  <div id="num">
    <div class="col"><div class="strip" id="c1"></div></div>
    <div class="col"><div class="strip" id="c2"></div></div>
    <div class="col"><div class="strip" id="c3"></div></div>
    <div class="col" style="width:230px"><div id="k">K</div></div>
  </div>
  <div id="thanks"><span><i>Thank you, creators</i></span></div>
  <div class="tile" id="t1" style="left:100px;background:#ff4d8d"></div>
  <div class="tile" id="t2" style="left:490px;background:#3d5afe"></div>
  <div class="tile" id="t3" style="left:880px;background:#14d9b0"></div>
  <div id="cta">Try Brushwork free &rarr;</div>
</div>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var R = rng(77);
  function mk(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }
  // odometer strips
  function fill(id, n) { var h = ""; for (var i = 0; i <= n; i++) h += "<div>" + (i % 10) + "</div>"; document.getElementById(id).innerHTML = h; }
  fill("c1", 3); fill("c2", 20); fill("c3", 30);
  // rays
  var rays = document.getElementById("rays"), cx = 640, cy = 190, gr = mk("g", { transform: "translate(" + cx + " " + cy + ")" }, rays), i;
  var cols = ["#2a2150", "#1b1535"];
  for (i = 0; i < 20; i++) { var a0 = i * 18 * Math.PI / 180, a1 = (i * 18 + 9) * Math.PI / 180; mk("path", { d: "M0 0L" + (Math.cos(a0) * 1500) + " " + (Math.sin(a0) * 1500) + "L" + (Math.cos(a1) * 1500) + " " + (Math.sin(a1) * 1500) + "Z", fill: "#241b4d" }, gr); }
  // confetti
  var burst = document.getElementById("burst"), pal = ["#ffd21f", "#ff4d8d", "#3d5afe", "#14d9b0", "#ffffff"], pieces = [];
  for (i = 0; i < 46; i++) {
    var r = mk("rect", { x: -9, y: -5, width: 18, height: 10, rx: 2, fill: pal[i % 5], opacity: 0 }, burst); pieces.push(r);
  }
  // tile art
  var T1 = '<svg width="300" height="170" viewBox="0 0 300 170"><path id="p1" d="M40 125C70 40 110 150 150 80S230 40 262 110" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><circle cx="40" cy="125" r="13" fill="#fff"/><circle cx="262" cy="110" r="13" fill="#fff"/></svg>';
  var T2 = '<svg width="300" height="170" viewBox="0 0 300 170"><rect class="l2" x="60" y="95" width="130" height="60" rx="12" fill="#fff" opacity=".45"/><rect class="l2" x="85" y="60" width="130" height="60" rx="12" fill="#fff" opacity=".7"/><rect class="l2" x="110" y="25" width="130" height="60" rx="12" fill="#fff"/></svg>';
  var T3 = '<svg width="300" height="170" viewBox="0 0 300 170"><g class="g3"><rect x="55" y="35" width="55" height="45" rx="10" fill="#0f0d1a"/><rect x="123" y="35" width="55" height="45" rx="10" fill="#fff"/><rect x="191" y="35" width="55" height="45" rx="10" fill="#fff" opacity=".6"/><rect x="55" y="92" width="55" height="45" rx="10" fill="#fff" opacity=".6"/><rect x="123" y="92" width="123" height="45" rx="10" fill="#0f0d1a"/></g></svg>';
  document.getElementById("t1").innerHTML = T1; document.getElementById("t2").innerHTML = T2; document.getElementById("t3").innerHTML = T3;

  var tl = gsap.timeline({ paused: true });
  // 0 - 1.9 count up
  tl.fromTo("#num", { scale: 0.92 }, { scale: 1, duration: 2.0, ease: "power2.out" }, 0);
  tl.fromTo("#c1", { y: 0 }, { y: -290 * 1, duration: 1.7, ease: "power3.out" }, 0.1);
  tl.fromTo("#c2", { y: 0 }, { y: -290 * 20, duration: 1.7, ease: "power3.out" }, 0.1);
  tl.fromTo("#c3", { y: 0 }, { y: -290 * 30, duration: 1.7, ease: "power3.out" }, 0.1);
  tl.fromTo("#k", { y: 300 }, { y: 0, duration: 0.4, ease: "back.out(2)" }, 0.0);
  tl.fromTo("#rays", { rotation: 0, opacity: 0.0, transformOrigin: cx + "px " + cy + "px" }, { rotation: 18, opacity: 1, duration: 5, ease: "none" }, 0);
  // hit: slam punch at 1.8
  tl.to("#num", { scale: 1.12, duration: 0.1, ease: "power2.out" }, 1.8);
  tl.to("#num", { scale: 1, duration: 0.5, ease: "elastic.out(1,0.5)" }, 1.9);
  tl.to("#num", { y: -10, duration: 0.5, ease: "power2.inOut" }, 2.3);
  // confetti
  pieces.forEach(function (p, i) {
    var ang = -Math.PI / 2 + (R() - .5) * 2.6, v = 260 + R() * 520, dx = Math.cos(ang) * v, dy = Math.sin(ang) * v * 0.9, dur = 1.2 + R() * 0.8, rot = (R() - .5) * 900;
    tl.set(p, { x: cx, y: cy + 150, opacity: 1, rotation: 0 }, 1.8);
    tl.to(p, { x: cx + dx, duration: dur, ease: "power1.out" }, 1.8);
    tl.to(p, { y: cy + 150 + dy, duration: dur * 0.45, ease: "power2.out" }, 1.8);
    tl.to(p, { y: cy + 150 + dy + 520, duration: dur * 0.9, ease: "power2.in" }, 1.8 + dur * 0.45);
    tl.to(p, { rotation: rot, duration: dur * 1.3, ease: "none" }, 1.8);
  });
  tl.to("#burst", { opacity: 0, duration: 0.4 }, 3.4);
  // thanks line
  tl.fromTo("#thanks i", { yPercent: 120 }, { yPercent: 0, duration: 0.45, ease: "power3.out" }, 2.0);
  // tiles
  [["#t1", 2.4], ["#t2", 2.65], ["#t3", 2.9]].forEach(function (t, k) {
    tl.fromTo(t[0], { y: 260, rotation: (k - 1) * 14, scale: 0.6, opacity: 0 }, { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.8)" }, t[1]);
  });
  tl.fromTo("#p1", { strokeDasharray: 520, strokeDashoffset: 520 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 2.6);
  tl.fromTo(".l2", { x: -90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, stagger: 0.12, ease: "power3.out" }, 2.85);
  tl.fromTo(".g3 rect", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, stagger: 0.07, ease: "back.out(2)" }, 3.1);
  // thanks line compacts, cta
  tl.fromTo("#cta", { y: 120, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 3.7);
  tl.to("#cta", { backgroundColor: "#ff4d8d", color: "#fff", duration: 0.2 }, 4.3);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
