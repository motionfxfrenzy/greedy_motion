<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Data centre fly-through</title>
<script src="vendor/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#04070d}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:#04070d;font-family:'Space Grotesk',Arial,sans-serif}
canvas{position:absolute;inset:0;width:1280px;height:720px;display:block}
#cap{position:absolute;left:0;right:0;bottom:0;padding:60px 0 56px;background:linear-gradient(transparent,rgba(2,5,10,.82));text-align:center;color:#eaf6ff;font-size:68px;font-weight:700;letter-spacing:-1px;text-shadow:0 0 30px rgba(0,200,255,.7),0 4px 24px #000}
#cap b{color:#3ee6ff}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
<canvas id="c" width="1280" height="720"></canvas>
<div id="cap">Your cloud, <b>always on</b></div>
</div>
<script type="module">
import * as THREE from "./vendor/three/three.module.js";
function prng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=prng(7);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("c"),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(1280,720,false);
const scene=new THREE.Scene();
const FOG=0x04070d;scene.background=new THREE.Color(FOG);scene.fog=new THREE.FogExp2(FOG,0.032);
const camera=new THREE.PerspectiveCamera(62,1280/720,0.1,200);
scene.add(new THREE.AmbientLight(0x30486a,1.2));
const L=new THREE.PointLight(0x3ee6ff,60,30);scene.add(L);

const LEN=140, HALF=3.2, RH=5, RW=1.3, RD=1.2;
const nR=Math.floor(LEN/1.5);
// racks
const rackGeo=new THREE.BoxGeometry(RD,RH,RW);
const rackMat=new THREE.MeshStandardMaterial({color:0x0e1626,roughness:.5,metalness:.7});
const racks=new THREE.InstancedMesh(rackGeo,rackMat,nR*2);
const m=new THREE.Matrix4();
// LEDs
const COLS=3,ROWS=22;
const ledGeo=new THREE.BoxGeometry(.04,.07,.16);
const ledMat=new THREE.MeshBasicMaterial({color:0xffffff});
const nL=nR*2*COLS*ROWS;
const leds=new THREE.InstancedMesh(ledGeo,ledMat,nL);
leds.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(nL*3),3);
const ph=new Float32Array(nL),fr=new Float32Array(nL),hue=new Uint8Array(nL);
let li=0,ri=0;
const pal=[[0.1,1,0.55],[0.1,0.8,1],[1,0.7,0.1],[0.2,1,0.9]];
for(let s=0;s<2;s++)for(let i=0;i<nR;i++){
  const z=-i*1.5, x=(s?1:-1)*HALF;
  m.makeTranslation(x,RH/2,z);racks.setMatrixAt(ri++,m);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    m.makeTranslation(x+(s?-1:1)*(RD/2+.01),.35+r*.2,z-.45+c*.38);
    leds.setMatrixAt(li,m);ph[li]=rnd()*40;fr[li]=.8+rnd()*3.5;hue[li]=rnd()<.8?(rnd()<.7?0:1):(rnd()<.5?2:3);li++;
  }
}
scene.add(racks,leds);
// accent strips on rack tops/frames
const lineMat=new THREE.MeshBasicMaterial({color:0x3ee6ff});
for(const sx of[-1,1]){
  const g=new THREE.BoxGeometry(.05,.05,LEN);
  const a=new THREE.Mesh(g,lineMat);a.position.set(sx*(HALF-RD/2-.02),RH+.02,-LEN/2);scene.add(a);
  const b=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x1b7bff}));b.position.set(sx*(HALF-RD/2-.02),.06,-LEN/2);scene.add(b);
}
// floor
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,LEN+20),new THREE.MeshStandardMaterial({color:0x070c16,roughness:.35,metalness:.8}));
floor.rotation.x=-Math.PI/2;floor.position.set(0,0,-LEN/2);scene.add(floor);
// glowing cable lines on floor (flat ribbons + data pulses as dashed shader-free boxes)
const cableCols=[0x3ee6ff,0xff3df0,0x41ff9a,0xffb23d,0x3e7bff];
const pulses=[];
for(let k=0;k<5;k++){
  const x=-1.6+k*.8;
  const cab=new THREE.Mesh(new THREE.BoxGeometry(.07,.03,LEN),new THREE.MeshBasicMaterial({color:cableCols[k]}));
  cab.position.set(x,.02,-LEN/2);scene.add(cab);
  const glow=new THREE.Mesh(new THREE.BoxGeometry(.22,.01,LEN),new THREE.MeshBasicMaterial({color:cableCols[k],transparent:true,opacity:.14,depthWrite:false,blending:THREE.AdditiveBlending}));
  glow.position.set(x,.025,-LEN/2);scene.add(glow);
  for(let j=0;j<10;j++){
    const p=new THREE.Mesh(new THREE.BoxGeometry(.13,.06,1.4),new THREE.MeshBasicMaterial({color:0xffffff}));
    p.userData={x,o:rnd()*LEN,sp:6+rnd()*10};p.position.set(x,.07,0);scene.add(p);pulses.push(p);
  }
}
// ceiling light bars
for(let i=0;i<LEN/6;i++){
  const bar=new THREE.Mesh(new THREE.BoxGeometry(1.6,.05,.25),new THREE.MeshBasicMaterial({color:0x9fdcff}));
  bar.position.set(0,RH+1.2,-i*6-2);scene.add(bar);
}
const col=new THREE.Color();
function draw(t){
  const k=Math.min(Math.max(t/5,0),1);
  const e=k*k*(3-2*k)*.35+k*.65; // gentle ease, mostly linear
  const z=-e*38;
  camera.position.set(Math.sin(t*.9)*.18,1.9+Math.sin(t*.7)*.07,z+2);
  camera.lookAt(Math.sin(t*.6)*.35,1.9,z-12);
  L.position.set(0,3,z-3);
  const arr=leds.instanceColor.array;
  for(let i=0;i<nL;i++){
    const v=Math.sin((t+ph[i])*fr[i]*6.283)>.25?1:.06;
    const p=pal[hue[i]];
    arr[i*3]=p[0]*v;arr[i*3+1]=p[1]*v;arr[i*3+2]=p[2]*v;
  }
  leds.instanceColor.needsUpdate=true;
  for(const p of pulses){const d=p.userData;p.position.z=-(((d.o+t*d.sp)%LEN));}
  renderer.render(scene,camera);
}
window.addEventListener("hf-seek",e=>draw(e.detail.time));
draw(window.__hfThreeTime||0);
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.from("#cap",{opacity:0,y:30,duration:.7,ease:"power3.out"},.5);
tl.to({},{duration:5},0);
window.__timelines["main"]=tl;
</script></body></html>
