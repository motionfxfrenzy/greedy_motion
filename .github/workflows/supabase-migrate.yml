# Applies supabase/migrations to the Supabase project that matches the branch.
#   staging    -> greedymotion-staging    (ltaxhznuixoslbbcjkts)
#   production -> greedymotion-production (bwwquxhexwyodsavsjar)
# `main` is for commits only and deploys nothing. Backend deploys are handled by Railway's own branch
# triggers (staging -> Railway staging, production -> Railway production).
# Needs SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the matching GitHub environment; until both
# are set the job warns and skips instead of failing.
name: supabase-migrate

on:
  push:
    branches: [staging, production]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ github.ref_name == 'production' && 'bwwquxhexwyodsavsjar' || 'ltaxhznuixoslbbcjkts' }}
    steps:
      - id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD are not set for the ${{ github.ref_name }} environment; skipping migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.guard.outputs.skip != 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - if: steps.guard.outputs.skip != 'true'
        run: supabase db push
