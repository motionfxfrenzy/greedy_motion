# Quality gates for every push and pull request to main, staging and production.
# - checks:   types, template catalog, brand-token lint, engine/fixture freshness, unified director/formats/author bundle
#             freshness (skills:check), format builder (test:formats), media layer (no services needed)
# - ownership: per-user isolation and concurrent writes against a real Postgres (backend/test/ownership.mjs), and
#             entitlements: grant/revoke, view-only enforcement, fail-closed, billing contract (backend/test/entitlements.mjs)
# - creative: renders every library/engine composition twice (identical frames) and under two brands (different
#             frames), software GPU (scripts/check-creative.mjs)
name: ci

on:
  push:
    branches: [main, staging, production]
  pull_request:
    branches: [main, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run templates:verify
      - run: npm run check:brand-tokens
      - run: node worker/templates/beat-plan/build.mjs --check
      - run: node scripts/build-engine-fixtures.mjs --check
      - run: npm run styles:check
      - run: npm run skills:check
      - run: npm run test:cloud-skills -w backend
      - run: npm run test:script-rules -w backend
      - run: npm run test:scene-rendering
      - run: node worker/test/motion-blur.mjs
      - run: npm run test:formats -w backend
      - run: npm run test:pro -w backend
      - run: npm run test:entitlements-eval -w backend
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node .claude/skills/gm-skill-authoring/scripts/pop_gate.mjs --self-test
      - run: npm run test:visuals -w backend
      - run: npm run test:media -w backend
      - run: npm run test:worker-launcher -w backend
      - run: npm test -w frontend

  ownership:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: videosaas
          POSTGRES_PASSWORD: videosaas
          POSTGRES_DB: videosaas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U videosaas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://videosaas:videosaas@127.0.0.1:5432/videosaas
      APP_ENV: local
      PLANNER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ownership -w backend
      - run: npm run test:visuals-db -w backend
      - run: npm run test:entitlements -w backend

  creative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install hyperframes browser ensure
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/build-skill-bundle.mjs --gates
      - run: npm run scenes:verify
      - run: npm run styles:verify
      - run: npm run styles:ui
      - run: npm run styles:media
      - run: node scripts/check-creative.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: creative-failure-captures
          path: validation/creative-libraries/last-failure/
          if-no-files-found: ignore
