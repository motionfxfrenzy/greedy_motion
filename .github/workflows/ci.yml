# Quality gates for every push and pull request to main, staging and production. Railway deploys only when this workflow is green.
# BLOCKING: build - it installs, type-checks and builds. If the code builds, it can ship.
# ADVISORY (continue-on-error: they run and show red in the log, but never stop a deploy; fix them at your own pace):
# - tests:     unit and format tests (pricing, media layer, launcher, frontend, brand tokens, template catalog)
# - engine:    generated files are up to date (beat-plan build, style library, skill bundle)
# - ownership: per-user isolation, entitlements and billing against a real Postgres
# - creative:  renders every look and scene in a browser (software GPU)
name: ci

on:
  push:
    branches: [main, staging, production]
  pull_request:
    branches: [main, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build -w frontend

  tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run templates:verify
      - run: npm run check:brand-tokens
      - run: npm run test:cloud-skills -w backend
      - run: npm run test:script-rules -w backend
      - run: npm run test:scene-rendering
      - run: node worker/test/motion-blur.mjs
      - run: npm run test:formats -w backend
      - run: npm run test:pro -w backend
      - run: npm run test:entitlements-eval -w backend
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node .claude/skills/gm-skill-authoring/scripts/pop_gate.mjs --self-test
      - run: npm run test:visuals -w backend
      - run: npm run test:media -w backend
      - run: npm run test:worker-launcher -w backend
      - run: npm test -w frontend

  engine:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node worker/templates/beat-plan/build.mjs --check
      - run: npm run styles:check
      - run: npm run skills:check

  ownership:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: videosaas
          POSTGRES_PASSWORD: videosaas
          POSTGRES_DB: videosaas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U videosaas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://videosaas:videosaas@127.0.0.1:5432/videosaas
      APP_ENV: local
      PLANNER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ownership -w backend
      - run: npm run test:visuals-db -w backend
      - run: npm run test:entitlements -w backend

  creative:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install hyperframes browser ensure
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/build-engine-fixtures.mjs
      - run: node scripts/build-skill-bundle.mjs --gates
      - run: npm run scenes:verify
      - run: npm run styles:verify
      - run: npm run styles:ui
      - run: npm run styles:media
      - run: node scripts/check-creative.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: creative-failure-captures
          path: validation/creative-libraries/last-failure/
          if-no-files-found: ignore
