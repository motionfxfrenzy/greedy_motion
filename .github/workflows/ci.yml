# Deployability checks for every push and pull request to main, staging and production.
# CI answers one question: will this commit build and start where it is deployed?
#   build:   install, type-check, and build the frontend (what Vercel builds).
#   backend: build backend/Dockerfile (what Railway builds) and start it against a throwaway Postgres;
#            /healthz and /readyz must answer. This catches engine/contracts changes that only break at start-up.
# Business and creative decisions (pricing, brand tokens, style library, template catalog, look renders)
# are not CI's job: their scripts stay in package.json for running by hand (npm run templates:verify,
# check:brand-tokens, styles:check, scenes:verify, test:ownership -w backend, ...).
name: ci

on:
  push:
    branches: [main, staging, production]
  pull_request:
    branches: [main, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build -w frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: videosaas
          POSTGRES_PASSWORD: videosaas
          POSTGRES_DB: videosaas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U videosaas" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the Railway image
        run: docker build -f backend/Dockerfile -t backend:ci .
      - name: Start it
        run: |
          docker run -d --name backend --network host \
            -e APP_ENV=local -e PLANNER=deterministic -e AUTH_MODE=none \
            -e STORAGE_DRIVER=filesystem -e WORKER_LAUNCH=external \
            -e HOST=127.0.0.1 -e PORT=4000 \
            -e DATABASE_URL=postgres://videosaas:videosaas@127.0.0.1:5432/videosaas \
            backend:ci
      - name: It answers /healthz and /readyz
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/readyz; then echo; curl -sf http://127.0.0.1:4000/healthz; echo; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' backend)" != "true" ]; then break; fi
            sleep 2
          done
          echo "The backend did not become ready."; docker logs backend; exit 1
      - if: always()
        run: docker logs backend 2>&1 | tail -40 || true
