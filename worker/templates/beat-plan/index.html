  <style>
    /* Beat-plan composition engine. Every colour is a theme token (worker/themes/CONTRACT.md); the
       --bp-* inks are chosen per theme at build time from those tokens for contrast. Video scale. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0; overflow: hidden; background: var(--bg); }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
    #stage, #wipes, #captions { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .beat, .seam, .cam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .field { position: absolute; display: block; background: var(--brand); }
    .disc { border-radius: 50%; }
    .panel { border-radius: calc(var(--radius) * 3); }
    .halo { position: absolute; display: block; border-radius: 50%; border-style: solid; border-color: var(--bp-on-brand); opacity: 0.16; }
    .col { position: absolute; display: flex; flex-direction: column; justify-content: center; }
    .col.top { justify-content: flex-start; }
    .col.center { align-items: center; text-align: center; }
    .kw { font-family: var(--font-display); font-weight: var(--bp-dw); line-height: 1.04; letter-spacing: -0.02em; color: var(--fg); text-wrap: balance; }
    .kw .w { display: inline-block; }
    .kw .ph { display: block; }
    .kw .acc { position: relative; color: var(--bp-accent); }
    .kw .ul { position: absolute; display: block; left: 0; right: 0; bottom: -0.02em; height: 0.075em; border-radius: 99px; background: currentColor; transform-origin: 0 50%; }
    .sub { display: block; font-family: var(--font-body); font-weight: 400; line-height: 1.25; color: var(--bp-muted); text-wrap: balance; }
    .flood .kw, .flood .sub { color: var(--bp-on-brand); }
    .flood .kw .acc { color: var(--bp-accent-on-brand); }
    .card { position: absolute; display: block; background: var(--bp-card); border-radius: var(--radius);
      box-shadow: 0 44px 90px color-mix(in srgb, var(--bp-shade) 24%, transparent), 0 8px 20px color-mix(in srgb, var(--bp-shade) 14%, transparent); }
    .shot { position: absolute; left: 10px; top: 10px; right: 10px; bottom: 10px; overflow: hidden; border-radius: calc(var(--radius) * 0.6); background: var(--bp-card); }
    .shot img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; object-fit: cover; object-position: top center; }
    .ring { position: absolute; display: block; border: 6px solid var(--brand); border-radius: 18px; }
    .ripple { position: absolute; display: block; border: 5px solid var(--brand); border-radius: 50%; }
    .cursor { position: absolute; left: 0; top: 0; display: block; z-index: 30; filter: drop-shadow(0 6px 9px color-mix(in srgb, var(--bp-shade) 38%, transparent)); }
    .cursor svg { display: block; width: 100%; height: 100%; }
    .cursor path { fill: var(--bp-cursor); stroke: var(--bp-cursor-edge); }
    .check { position: absolute; display: block; border-radius: 50%; background: var(--brand); box-shadow: 0 16px 34px color-mix(in srgb, var(--bp-shade) 24%, transparent); }
    .check svg { position: absolute; left: 22%; top: 22%; width: 56%; height: 56%; display: block; }
    .check path { fill: none; stroke: var(--bp-on-brand); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .burst { position: absolute; display: block; border-radius: 50%; border: 6px solid var(--brand); }
    .flood .check { background: var(--bp-on-brand); }
    .flood .check path { stroke: var(--brand); }
    .flood .burst { border-color: var(--bp-on-brand); }
    .chipbox { position: absolute; display: block; border-radius: 18px; background: var(--bp-card); box-shadow: 0 18px 40px color-mix(in srgb, var(--bp-shade) 22%, transparent); }
    .fieldbox { position: absolute; display: block; border-radius: 16px; background: var(--bp-card); border: 4px solid var(--brand); overflow: hidden;
      box-shadow: 0 18px 40px color-mix(in srgb, var(--bp-shade) 20%, transparent); }
    .type-wrap { position: absolute; left: 26px; top: 0; height: 100%; white-space: nowrap; }
    .type-txt { display: inline-block; font-family: var(--font-body); font-weight: 700; color: var(--bp-on-card); white-space: nowrap; }
    .type-cover { position: absolute; display: block; top: 0; height: 100%; background: var(--bp-card); }
    .caret { position: absolute; display: block; top: 24%; height: 52%; width: 4px; border-radius: 2px; background: var(--brand); }
    .track { position: absolute; display: block; left: 0; top: 0; width: 100%; height: 100%; border-radius: 999px; }
    .track.off { background: var(--border); }
    .track.on { background: var(--brand); }
    .knob { position: absolute; display: block; border-radius: 50%; background: var(--bp-card); box-shadow: 0 4px 10px color-mix(in srgb, var(--bp-shade) 25%, transparent); }
    .stat { position: absolute; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: var(--bp-dw);
      color: var(--bp-on-card); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bar { position: absolute; display: block; border-radius: 999px; background: var(--border); overflow: hidden; }
    .bar i { position: absolute; display: block; left: 0; top: 0; width: 100%; height: 100%; background: var(--brand); transform-origin: 0 50%; }
    .drag { position: absolute; display: block; border-radius: 16px; background: var(--brand); box-shadow: 0 18px 36px color-mix(in srgb, var(--bp-shade) 26%, transparent); }
    .drag svg { position: absolute; left: 30%; top: 22%; width: 40%; height: 56%; display: block; }
    .drag path { fill: none; stroke: var(--bp-on-brand); stroke-width: 3; stroke-linecap: round; }
    .drop { position: absolute; display: block; border-radius: 18px; border: 5px dashed var(--brand); }
    .marquee { position: absolute; display: block; border: 5px solid var(--brand); border-radius: 12px; background: color-mix(in srgb, var(--brand) 14%, transparent); transform-origin: 0 0; }
    .thumb { position: absolute; display: block; width: 12px; border-radius: 6px; background: var(--brand); }
    .dot { position: absolute; display: block; border-radius: 50%; background: var(--brand); }
    .lockup { display: flex; align-items: center; justify-content: center; gap: 28px; }
    .lockup img { display: block; width: auto; height: auto; object-fit: contain; }
    .logo-bug { position: absolute; display: block; width: auto; object-fit: contain; z-index: 6; }
    .name { font-family: var(--font-display); font-weight: var(--bp-dw); line-height: 1; letter-spacing: -0.02em; color: var(--fg); white-space: nowrap; }
    .pill { display: inline-block; background: var(--brand); color: var(--bp-on-brand); font-family: var(--font-body); font-weight: 700; border-radius: 999px; white-space: nowrap; }
    .wipe { position: absolute; display: block; background: var(--brand); }
    .cap { position: absolute; left: 0; width: 100%; display: flex; justify-content: center; }
    .cap span { display: block; max-width: 82%; padding: 0.28em 0.7em; border-radius: 0.45em; background: var(--fg); color: var(--bg);
      font-family: var(--font-body); font-weight: 700; line-height: 1.25; text-align: center; text-wrap: balance; }
  </style>
<style id="bp-styles">/* Brand-token-only graphic treatments. No fonts, remote assets, timers or CSS animation. */
.look-material .card { border: 8px solid var(--bp-card); border-radius: 3px; box-shadow: 10px 14px 0 color-mix(in srgb,var(--bp-shade) 22%,transparent); }
.look-material .pill { border-radius: 4px; box-shadow: 5px 6px 0 color-mix(in srgb,var(--bp-shade) 20%,transparent); }
.look-material .disc { border-radius: 7%; box-shadow: 12px 15px 0 color-mix(in srgb,var(--bp-shade) 16%,transparent); }
.look-material .ul { height: 5px; }
.style-figure { position:absolute; pointer-events:none; }
.style-piece { position:absolute; background:var(--brand); color:var(--bp-on-brand); box-shadow:8px 12px 0 color-mix(in srgb,var(--bp-shade) 18%,transparent); border:3px solid color-mix(in srgb,var(--fg) 20%,transparent); }
.style-piece:nth-child(even) { background:var(--bp-accent); }
.style-piece::after { content:""; position:absolute; inset:0; opacity:.16; background:repeating-linear-gradient(18deg,transparent 0 5px,var(--bp-shade) 6px,transparent 7px); }
.look-vox-collage .style-piece { border:9px solid var(--bp-card); }
.look-vox-collage .style-piece::after { background:radial-gradient(var(--bp-shade) 1.6px,transparent 2px); background-size:8px 8px; opacity:.32; }
.look-vox-collage .style-piece:nth-child(3) { border-radius:50%; }
.look-vox-collage .card::after,.look-paper-collage .card::after { content:""; position:absolute; width:26%; height:24px; top:0; left:37%; background:color-mix(in srgb,var(--accent) 65%,transparent); }
.look-paper-diorama .style-piece { border-width:7px; border-color:color-mix(in srgb,var(--bg) 60%,var(--brand)); box-shadow:14px 20px 0 color-mix(in srgb,var(--bp-shade) 35%,transparent); }
.look-paper-diorama .style-piece::after { background:repeating-linear-gradient(0deg,transparent 0 8px,var(--bp-shade) 9px 11px,transparent 12px 16px); }
.look-paper .style-piece { border-width:6px; border-color:color-mix(in srgb,var(--bg) 75%,var(--brand)); box-shadow:5px 5px 0 var(--brand),13px 18px 0 color-mix(in srgb,var(--bp-shade) 23%,transparent); }
.look-paper-cutout .style-piece { box-shadow:4px 5px 0 color-mix(in srgb,var(--bp-shade) 18%,transparent); border-width:0; }
.look-paper-cutout .style-piece:nth-child(2) { border-radius:50%; }
.look-paper-stop-motion .style-piece,.look-paper-cut .style-piece { clip-path:polygon(2% 2%,20% 0,39% 3%,62% 0,81% 3%,98% 0,100% 25%,97% 48%,100% 76%,98% 100%,77% 97%,55% 100%,29% 97%,0 100%,3% 70%,0 40%); }
.look-paper-stop-motion .style-piece { border:8px dashed color-mix(in srgb,var(--bg) 70%,var(--brand)); }
.look-paper-collage .style-piece:nth-child(odd) { border:8px solid var(--bp-card); }
.look-paper-collage .style-piece:nth-child(even)::after { background:repeating-linear-gradient(45deg,transparent 0 12px,var(--bp-shade) 13px 18px); opacity:.35; }
.look-origami .style-piece { clip-path:polygon(50% 0,100% 35%,78% 100%,0 73%); box-shadow:none; }
.look-origami .style-piece::after { opacity:.35; background:conic-gradient(from 30deg at 50% 45%,transparent 0 90deg,var(--bp-shade) 90deg 180deg,transparent 180deg 270deg,var(--bg) 270deg); }
.look-paper-cut .style-piece { border:6px solid var(--bg); }
.look-clay .style-piece { border:0; border-radius:38% 43% 35% 42%; box-shadow:inset -10px -14px 15px color-mix(in srgb,var(--bp-shade) 30%,transparent),inset 8px 10px 12px color-mix(in srgb,var(--bg) 40%,transparent),9px 14px 8px color-mix(in srgb,var(--bp-shade) 20%,transparent); }
.look-clay .style-piece::after { inset:16%; border-radius:50%; background:repeating-radial-gradient(ellipse at 40% 50%,transparent 0 5px,var(--bp-shade) 6px,transparent 7px 11px); opacity:.1; }
.look-clay .card,.look-clay .pill { border-radius:28px; }
.look-clay .disc { border-radius:40% 45% 36% 48%; }
.look-clay-goofy .style-piece:nth-child(3) { border-radius:48% 28% 42% 33%; }
.look-clay-clean .style-piece { border-radius:25%; }
.look-clay-clean .style-piece::after { opacity:.035; }
.look-clay-puppet .style-piece { border:5px dashed var(--bp-on-brand); border-radius:20%; }
.look-clay-puppet .style-piece::after { background:repeating-linear-gradient(0deg,transparent 0 6px,var(--bp-shade) 7px),repeating-linear-gradient(90deg,transparent 0 6px,var(--bp-shade) 7px); }
.look-claymation .style-piece { border-radius:42%; }
.look-claymation .style-piece::after { opacity:.055; }
.look-drawn .card { border:3px solid var(--fg); box-shadow:7px 9px 0 color-mix(in srgb,var(--brand) 30%,transparent); }
.look-drawn .pill { border:3px solid var(--fg); border-radius:12px 5px 16px 7px; }

/* Text remains native, legible, and brand-colored over generated material footage. */
.has-material-video .w, .has-material-video .sub { background: var(--bg); color: var(--fg); box-decoration-break: clone; -webkit-box-decoration-break: clone; }

/* Sketch look: notebook paper under a type scene, in the theme's own paper and ink. */
.sk-paper { background-color: color-mix(in srgb, var(--bg) 92%, var(--surface)); background-image: linear-gradient(color-mix(in srgb, var(--fg) 9%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--fg) 9%, transparent) 1px, transparent 1px); background-size: 48px 48px; }</style></head>
