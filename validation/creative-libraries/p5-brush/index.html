<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Spike: p5.js + p5.brush drawn on seek</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/p5.min.js"></script>
    <script src="vendor/p5.brush.js"></script>
    <style>
      body { margin: 0; background: var(--bg); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #paint { position: absolute; inset: 0; }
      #paint canvas { width: 1920px !important; height: 1080px !important; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="4">
      <div id="paint"></div>
    </div>
    <script>
      // p5 never runs its own loop. The GSAP timeline (which HyperFrames seeks) calls render(t),
      // and render reseeds every frame, so the same t always paints the same pixels.
      const css = getComputedStyle(document.documentElement);
      const tokenBrand = css.getPropertyValue("--brand").trim();
      const tokenFg = css.getPropertyValue("--fg").trim();
      const tokenBg = css.getPropertyValue("--bg").trim();
      // Paint inside p5's own draw cycle (p.redraw → p.draw): p5.brush flushes its strokes at the end of
      // draw, so painting from outside it drops the last stroke.
      let P = null, now = 0;
      new p5((p) => {
        brush.instance(p);
        p.setup = () => { p.createCanvas(1920, 1080, p.WEBGL); p.pixelDensity(1); p.noLoop(); P = p; };
        p.draw = () => paint(now);
      }, document.getElementById("paint"));

      function render(t) { now = t; if (P) P.redraw(); }

      function paint(t) {
        P.randomSeed(7); P.noiseSeed(7);
        P.background(tokenBg);
        const k = Math.min(1, t / 3);                        // 0 → 1 over 3 s
        brush.set("HB", tokenFg, 1.6);
        brush.line(-700, 300, -700 + 1400 * k, 300);          // a ground line drawing itself
        brush.set("marker", tokenBrand, 2.4);
        const bob = Math.sin(t * Math.PI * 2) * 18;          // pure function of t
        brush.circle(-200 + 400 * k, -40 + bob, 110);         // a character's head moving along
        brush.set("2B", tokenFg, 1.2);
        brush.line(-200 + 400 * k, 70 + bob, -200 + 400 * k, 260);
        brush.render && brush.render();
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: 4, duration: 4, ease: "none", onUpdate: () => render(state.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
