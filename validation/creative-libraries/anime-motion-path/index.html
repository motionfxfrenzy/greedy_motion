<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Spike: Anime.js motion path</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/anime.umd.min.js"></script>
    <style>
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-display, sans-serif); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      svg { position: absolute; inset: 0; }
      #route { fill: none; stroke: var(--brand); stroke-width: 6; stroke-linecap: round; }
      #card { position: absolute; left: 0; top: 0; width: 120px; height: 80px; margin: -40px 0 0 -60px; border-radius: 18px;
              background: var(--brand); box-shadow: 0 12px 30px rgba(0,0,0,.25); }
      h1 { position: absolute; left: 120px; top: 90px; margin: 0; font-size: 72px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="4">
      <h1 id="title">Follow the flow</h1>
      <svg viewBox="0 0 1920 1080"><path id="route" d="M200 820 C 600 300, 900 1000, 1250 520 S 1650 260, 1760 640" /></svg>
      <div id="card"></div>
    </div>
    <script>
      // Anime.js v4 owns the path motion; HyperFrames seeks it through the animejs adapter.
      const { animate, createTimeline, svg } = anime;
      const route = svg.createDrawable("#route");
      const tl = createTimeline({ autoplay: false, defaults: { ease: "inOutCubic" } });
      tl.add(route, { draw: ["0 0", "0 1"], duration: 1800 }, 0)
        .add("#card", { ...svg.createMotionPath("#route"), duration: 2600 }, 600);
      window.__hfAnime = window.__hfAnime || [];
      window.__hfAnime.push(tl);
      // GSAP owns the text, as in the engine.
      const gtl = gsap.timeline({ paused: true });
      gtl.from("#title", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gtl;
    </script>
  </body>
</html>
