<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="vendor/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1220; }
    #root { width: 1920px; height: 1080px; color: #f8fafc; font-family: Arial, sans-serif; position: relative; }
    #eyebrow { position: absolute; top: 170px; left: 160px; font-size: 28px; letter-spacing: 6px; color: #a7f3d0; }
    #title { position: absolute; top: 240px; left: 160px; font-size: 98px; letter-spacing: -4px; }
    #subtitle { position: absolute; top: 380px; left: 160px; font-size: 36px; color: #cbd5e1; }
    #card { position: absolute; top: 520px; left: 160px; width: 1600px; height: 300px; background: #18263b; border: 2px solid #334155; border-radius: 32px; padding: 44px 56px; }
    #label { font-size: 28px; color: #cbd5e1; }
    #counter { font-size: 112px; font-weight: 700; line-height: 1.25; color: #a7f3d0; }
    #track { position: absolute; left: 470px; top: 151px; width: 1040px; height: 24px; border-radius: 12px; background: #334155; overflow: hidden; }
    #bar { height: 100%; width: 100%; transform-origin: left center; background: #6ee7b7; }
    #badge { position: absolute; left: 160px; top: 870px; font-size: 30px; color: #a7f3d0; opacity: 0; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080" data-fps="30">
    <p id="eyebrow" class="clip" data-start="0" data-duration="6" data-track-index="0">VIDEOSAAS / LOCAL VALIDATION</p>
    <h1 id="title" class="clip" data-start="0" data-duration="6" data-track-index="1">A working motion pipeline.</h1>
    <p id="subtitle" class="clip" data-start="0" data-duration="6" data-track-index="2">Six seconds. Local assets. Editable source.</p>
    <div id="card" class="clip" data-start="0" data-duration="6" data-track-index="3">
      <p id="label">Animation progress</p>
      <p id="counter">0</p>
      <div id="track"><div id="bar"></div></div>
    </div>
    <p id="badge" class="clip" data-start="0" data-duration="6" data-track-index="4">READY FOR THE NEXT VALIDATION STEP</p>
  </div>
  <script>
    const progress = { value: 0 };
    const counter = document.getElementById('counter');
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#title', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0);
    tl.fromTo('#card', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0.2);
    tl.to(progress, { value: 100, duration: 3, ease: 'none', onUpdate: () => { counter.textContent = String(Math.round(progress.value)); } }, 0.8);
    tl.fromTo('#bar', { scaleX: 0 }, { scaleX: 1, duration: 3, ease: 'none' }, 0.8);
    tl.to('#badge', { opacity: 1, duration: 0.4 }, 4);
    tl.to({}, { duration: 1.6 }, 4.4);
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
    tl.seek(0);
  </script>
</body>
</html>
