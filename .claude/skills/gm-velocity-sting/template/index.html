  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <title>gm-velocity-sting · fill-mode template</title>
    <!-- Brand: theme.css carries the 18 theme tokens (worker/themes/CONTRACT.md) from the brand kit or a gallery theme;
         fonts.css its faces. Nothing below hard-codes a colour or a typeface. -->
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="theme.css">
    <script src="vendor/gsap.min.js"></script>
    <style>
      :root {
        --shadow: 0 14px 20px 4px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 24px 40px 6px rgba(0, 0, 0, 0.12);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body, sans-serif); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
      .scene { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
      .cam { position: absolute; inset: 0; will-change: transform, filter; }

      /* ---------- lockup (A + G): two parts that counter-bounce ---------- */
      .lockup { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
      .mark { display: grid; place-items: center; width: 340px; height: 158px; }
      .mark img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
      .mono { display: grid; place-items: center; width: 158px; height: 158px; border-radius: 40px; background: var(--accent); color: var(--on-accent); font-family: var(--font-display, sans-serif); font-weight: 700; font-size: 92px; line-height: 1; }
      .wordmark { display: flex; gap: 0.24em; font-family: var(--font-display, sans-serif); font-weight: 700; font-size: var(--wm-size, 132px); line-height: 1; letter-spacing: -0.045em; white-space: nowrap; }
      .wordmark span { display: block; }
      .w-1 { color: var(--fg); }
      .w-2 { color: var(--accent-ink); }

      /* ---------- B: the entry surface ---------- */
      .b-card { position: absolute; left: 190px; top: 216px; width: 700px; padding: 52px 56px; border-radius: 32px; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 18px; }
      .b-title { margin: 0; font-family: var(--font-display, sans-serif); font-weight: 700; font-size: 50px; letter-spacing: -0.03em; line-height: 1.1; }
      .b-sub { margin: -6px 0 10px; font-size: 22px; font-weight: 600; color: var(--muted-ink); }
      .b-opt { display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 9999px; background: var(--bg); font-size: 21px; font-weight: 600; }
      .b-div { display: flex; align-items: center; gap: 16px; font-size: 18px; font-weight: 600; color: var(--muted-ink); }
      .b-div::before, .b-div::after { content: ""; flex: 1; height: 2px; background: var(--border); }
      .b-label { font-size: 20px; font-weight: 700; margin-bottom: -8px; }
      .b-field { height: 64px; border-radius: 18px; border: 2px solid var(--border); background: var(--bg); padding: 0 20px; display: flex; align-items: center; font-size: 21px; font-weight: 600; color: var(--muted-ink); }
      .b-cta { height: 66px; border-radius: 9999px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 21px; font-weight: 700; margin-top: 4px; }

      /* ---------- C: the same surface, closer ---------- */
      .c-card { position: absolute; left: -80px; top: 120px; width: 1240px; height: 1100px; border-radius: 64px; background: var(--surface); box-shadow: var(--shadow-lg); }
      .c-div { position: absolute; left: 190px; right: 190px; top: 70px; display: flex; align-items: center; gap: 28px; font-size: 34px; font-weight: 600; color: var(--muted-ink); }
      .c-div::before, .c-div::after { content: ""; flex: 1; height: 3px; background: var(--border); }
      .c-label { position: absolute; left: 190px; top: 200px; font-size: 44px; font-weight: 700; }
      .c-field { position: absolute; left: 190px; top: 278px; width: 860px; height: 136px; border-radius: 36px; border: 4px solid var(--accent); background: var(--bg); padding: 0 44px; display: flex; align-items: center; font-size: 50px; font-weight: 600; white-space: nowrap; overflow: hidden; }
      .c-ph { position: absolute; left: 48px; color: var(--muted-ink); }
      .c-caret { display: inline-block; width: 5px; height: 60px; margin-left: 4px; background: var(--accent); border-radius: 3px; }
      .c-cta { position: absolute; left: 190px; top: 470px; width: 860px; height: 136px; border-radius: 9999px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 46px; font-weight: 700; white-space: nowrap; }
      .c-cta.pressed { background: var(--accent); color: var(--on-accent); }

      /* ---------- D: one number ---------- */
      .d-panel { position: absolute; left: 110px; top: 130px; width: 860px; height: 820px; border-radius: 40px; background: var(--surface); box-shadow: var(--shadow); }
      .d-label { position: absolute; left: 64px; top: 52px; font-family: var(--font-display, sans-serif); font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
      .d-num { position: absolute; left: 54px; top: 112px; font-family: var(--font-display, sans-serif); font-weight: 800; letter-spacing: -0.05em; line-height: 1.32; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .d-of { position: absolute; left: 68px; top: 466px; font-family: var(--font-mono, monospace); font-size: 36px; color: var(--muted-ink); }
      .d-bar { position: absolute; left: 64px; top: 540px; width: 732px; height: 16px; border-radius: 9999px; background: var(--border); overflow: hidden; }
      .d-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 732px; border-radius: 9999px; background: var(--accent); transform-origin: 0 50%; }
      .d-steps { position: absolute; left: 64px; top: 598px; display: flex; flex-direction: column; gap: 22px; }
      .d-st { display: flex; align-items: center; gap: 18px; font-size: 27px; font-weight: 600; color: var(--muted-ink); height: 34px; }
      .d-st b { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--border); font-size: 16px; color: var(--on-accent); }
      .d-st.done b { background: var(--accent); border-color: var(--accent); }
      .d-st.now { color: var(--fg); }
      .d-st.now b { border-color: var(--accent); }

      /* ---------- E: the real navigation. Each row carries its own highlight pill, sized by its own text,
           so no text width is ever measured or pasted. ---------- */
      .e-card { position: absolute; left: 120px; top: 110px; width: 840px; height: 860px; border-radius: 40px; background: var(--surface); box-shadow: var(--shadow); }
      .e-head { position: absolute; left: 56px; top: 50px; display: flex; align-items: center; gap: 16px; }
      .e-head .mark { width: 84px; height: 39px; }
      .e-head .mono { width: 44px; height: 44px; border-radius: 12px; font-size: 26px; }
      .e-head .wm { font-family: var(--font-display, sans-serif); font-weight: 700; font-size: 36px; letter-spacing: -0.04em; white-space: nowrap; }
      .e-rule { position: absolute; left: 56px; right: 56px; top: 132px; height: 2px; background: var(--border); }
      .e-list { position: absolute; left: 56px; top: 168px; width: 728px; height: 600px; overflow: hidden; }
      .e-row { position: absolute; left: 0; height: 92px; line-height: 92px; padding: 0 28px; border-radius: 9999px; font-family: var(--font-display, sans-serif); font-size: 60px; font-weight: 700; letter-spacing: -0.025em; white-space: nowrap; }
      .e-row.on { background: var(--accent); color: var(--on-accent); }
      .e-sep { position: absolute; left: 28px; right: 0; height: 2px; background: var(--border); }
      .e-foot { position: absolute; left: 56px; right: 56px; bottom: 52px; font-size: 26px; font-weight: 600; color: var(--muted-ink); }

      /* ---------- F: the one action ---------- */
      .f-page { position: absolute; inset: 0; }
      .f-h1 { position: absolute; left: 90px; top: 140px; margin: 0; font-family: var(--font-display, sans-serif); font-size: 96px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
      .f-sub { position: absolute; left: 92px; top: 256px; width: 900px; font-size: 28px; font-weight: 600; color: var(--muted-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .f-btns { position: absolute; left: 90px; top: 330px; display: flex; gap: 20px; }
      .f-btn { height: 96px; padding: 0 46px; border-radius: 9999px; background: var(--fg); color: var(--bg); display: flex; align-items: center; font-size: 32px; font-weight: 700; white-space: nowrap; }
      .f-btn2 { height: 96px; padding: 0 40px; border-radius: 9999px; background: var(--surface); display: flex; align-items: center; font-size: 30px; font-weight: 700; white-space: nowrap; }
      .f-menu { position: absolute; left: 90px; top: 450px; width: 900px; padding: 28px; border-radius: 34px; background: var(--surface); box-shadow: var(--shadow-lg); }
      .f-mh { height: 44px; margin: 0 0 16px 8px; font-family: var(--font-display, sans-serif); font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
      .f-rows { position: relative; height: 452px; }
      .f-row { position: absolute; left: 0; right: 0; height: 104px; border-radius: 24px; border: 3px solid var(--border); background: var(--surface); }
      .f-row .rd { position: absolute; left: 26px; top: 32px; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--border); }
      .f-row .nm { position: absolute; left: 84px; top: 0; line-height: 98px; font-size: 34px; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; }
      .f-row .mt { position: absolute; right: 28px; top: 0; line-height: 98px; font-family: var(--font-mono, monospace); font-size: 21px; color: var(--muted-ink); white-space: nowrap; }
      .f-sel { position: absolute; inset: -3px; border-radius: 24px; border: 4px solid var(--accent); }
      .f-hover { position: absolute; inset: 0; border-radius: 21px; background: var(--bg); }
      .f-rd-on { position: absolute; inset: -3px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); font-size: 18px; font-weight: 800; }
      .f-needs { position: absolute; left: 118px; top: 1050px; font-size: 26px; font-weight: 600; color: var(--muted-ink); white-space: nowrap; }
      .cursor { position: absolute; left: 0; top: 0; width: 128px; height: 128px; z-index: 30; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.3)); }
      .cursor svg { display: block; width: 100%; height: 100%; }
      .cursor path { fill: var(--fg); stroke: var(--bg); stroke-width: 1.4; stroke-linejoin: round; }

      /* ---------- G ---------- */
      .g-line { font-family: var(--font-display, sans-serif); font-size: 46px; font-weight: 700; letter-spacing: -0.02em; margin-top: 30px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1080" data-duration="11.933">
      <section id="sc-a" class="scene">
        <div id="a-cam" class="cam" data-layout-allow-overflow="">
          <div class="lockup">
            <div id="a-mark" class="mark brand-mark"></div>
            <div id="a-word" class="wordmark"><span class="w-1 bw1"></span><span class="w-2 bw2"></span></div>
          </div>
        </div>
      </section>

      <section id="sc-b" class="scene">
        <div id="b-cam" class="cam" data-layout-allow-overflow="">
          <div class="b-card">
            <h1 id="b-title" class="b-title"></h1>
            <div id="b-sub" class="b-sub b-row"></div>
            <div id="b-opt1" class="b-opt b-row"></div>
            <div id="b-opt2" class="b-opt b-row"></div>
            <div id="b-div" class="b-div b-row"></div>
            <div id="b-label" class="b-label b-row"></div>
            <div id="b-field" class="b-field b-row"></div>
            <div id="b-cta" class="b-cta b-row"></div>
          </div>
        </div>
      </section>

      <section id="sc-c" class="scene">
        <div id="c-cam" class="cam" data-layout-allow-overflow="">
          <div class="c-card" data-layout-allow-overflow="">
            <div id="c-div" class="c-div"></div>
            <div id="c-label" class="c-label"></div>
            <div class="c-field"><span id="c-ph" class="c-ph" data-layout-allow-overlap=""></span><span id="c-typed"></span><span id="c-caret" class="c-caret"></span></div>
            <div id="c-cta" class="c-cta"></div>
          </div>
        </div>
      </section>

      <section id="sc-d" class="scene">
        <div id="d-cam" class="cam" data-layout-allow-overflow="">
          <div class="d-panel">
            <div id="d-label" class="d-label"></div>
            <div id="d-num" class="d-num"></div>
            <div id="d-of" class="d-of"></div>
            <div class="d-bar"><div id="d-fill" class="d-fill"></div></div>
            <div id="d-steps" class="d-steps"></div>
          </div>
        </div>
      </section>

      <section id="sc-e" class="scene">
        <div id="e-cam" class="cam" data-layout-allow-overflow="">
          <div class="e-card">
            <div class="e-head"><div class="mark brand-mark small"></div><span class="wm"><span class="w-1 bw1"></span> <span class="w-2 bw2"></span></span></div>
            <div class="e-rule"></div>
            <div id="e-list" class="e-list" data-layout-allow-overflow=""></div>
            <div id="e-foot" class="e-foot"></div>
          </div>
        </div>
      </section>

      <section id="sc-f" class="scene">
        <div id="f-cam" class="cam" data-layout-allow-overflow="">
          <div id="f-page" class="f-page" data-layout-allow-overflow="">
            <h1 id="f-h1" class="f-h1"></h1>
            <div id="f-sub" class="f-sub"></div>
            <div class="f-btns"><div id="f-btn" class="f-btn"></div><div id="f-btn2" class="f-btn2"></div></div>
            <div id="f-menu" class="f-menu">
              <div id="f-mh" class="f-mh"></div>
              <div id="f-rows" class="f-rows"></div>
            </div>
            <div id="f-needs" class="f-needs"></div>
          </div>
          <div id="cursor" class="cursor" data-layout-allow-overflow="" data-layout-allow-overlap="" data-layout-allow-occlusion="">
            <svg viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.3-4.1 2.9 6.6 3-1.3-2.9-6.5h5.9z" /></svg>
          </div>
        </div>
      </section>

      <section id="sc-g" class="scene">
        <div id="g-cam" class="cam" data-layout-allow-overflow="">
          <div class="lockup">
            <div id="g-mark" class="mark brand-mark"></div>
            <div class="wordmark"><span id="g-w1" class="w-1 bw1"></span><span id="g-w2" class="w-2 bw2"></span></div>
            <div id="g-line" class="g-line"></div>
          </div>
        </div>
      </section>

      <!-- Music bed + SFX premixed to the fixed frame plan (references/ledger.json), so it fits every product. -->
      <audio id="sting-mix" src="assets/audio/sting-mix.wav" data-start="0" data-duration="11.933" data-track-index="1" data-volume="1"></audio>
    </div>

    <script id="format-engine">/* engine.js, inlined by scripts/build-format.mjs */</script>
  </body>
</html>
